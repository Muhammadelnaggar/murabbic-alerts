name: Smart Alerts GET safety checks
on:
  push:
    branches:
      - murabbik-safety-backup
    paths:
      - 'murabbik-safety/test_get_state_reads_20261014.cjs'
      - 'murabbik-safety/server_get_state_reads_candidate_20261014.js'
      - 'murabbik-safety/build_get_critical_path_20261014.py'
      - '.github/workflows/smart-alert-get-safety.yml'
  workflow_dispatch:

jobs:
  get-only-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Existing GET safety regression
        run: |
          node --check murabbik-safety/server_get_state_reads_candidate_20261014.js
          node murabbik-safety/test_get_state_reads_20261014.cjs
      - name: Build critical path candidate on runner
        run: |
          python3 murabbik-safety/build_get_critical_path_20261014.py
          node --check murabbik-safety/server_get_critical_path_candidate_20261014.js
      - name: Save unshipped test candidate
        uses: actions/upload-artifact@v4
        with:
          name: smart-alert-get-critical-path-candidate
          path: murabbik-safety/server_get_critical_path_candidate_20261014.js
          retention-days: 3
