<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل إنتاج اللبن اليومي — مُرَبِّك</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

  <link rel="stylesheet" href="css/forms.css">
 
</head>
<body>
  <div id="devbar"></div>
<header>
  <div class="mbk-head">
    <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
    <div class="mbk-center">
      <div class="mbk-page-title">تسجيل إنتاج اللبن اليومي</div>
      <div class="mbk-app-name">مُرَبِّيك</div>
    </div>
    <a class="mbk-back" href="add-event.html">رجوع</a>
  </div>
</header>


  <div class="wrap">
    <!-- رسالة عامة للمستخدم عند الحاجة فقط -->
    <div id="msg" class="msg" aria-live="polite"></div>

   <form id="milkForm" autocomplete="off" novalidate>
  <div id="sysbar" class="infobar"></div>
<div id="bulkBox" class="hide compact-section">
  <div id="bulkDateBar" style="display:none;margin:0 0 12px 0"></div>
 <div id="bulkInfo" class="muted compact-note"></div>

 <div style="width:100%">
<table id="bulkTable" class="compact-table">
      <thead>
        <tr>
          <th style="text-align:right;padding:8px 10px">رقم الحيوان</th>
          <th style="text-align:center;padding:8px 10px">النوع</th>
          <th style="text-align:center;padding:8px 10px">حلبة 1</th>
          <th style="text-align:center;padding:8px 10px">حلبة 2</th>
          <th style="text-align:center;padding:8px 10px" id="bulkHeadS3">حلبة 3</th>
          <th style="text-align:center;padding:8px 10px">الإجمالي</th>
        </tr>
      </thead>
      <tbody id="bulkRows"></tbody>
    </table>
  </div>

<div class="actions-bar" id="bulkActions">
  <button type="button" id="saveBulkBtn" class="save">حفظ اللبن</button>
  <button type="button" id="cancelBulkBtn" class="ghost">لوحة التحكم</button>
</div>
</div>
      <div class="row">
        <div class="col">
          <label for="animalNumber">رقم الحيوان</label>
<input id="animalNumber" class="big-number-input" name="animalNumber" data-field="animalNumber"
       inputmode="numeric" autocomplete="off" required />

        </div>
        <div class="col">
          <label for="eventDate">تاريخ اليوم</label>
         <input id="eventDate" name="eventDate" data-field="eventDate" type="date" required />
        </div>
      </div>
           <div id="sessions">
        <div class="row">
          <div class="col">
            <label id="s1label" for="s1">حلبة 1 (كجم)</label>
            <input id="s1" data-field="milkS1" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0.0" />
          </div>
          <div class="col">
            <label id="s2label" for="s2">حلبة 2 (كجم)</label>
            <input id="s2" data-field="milkS2" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0.0" />
          </div>
          <div class="col" id="col-s3">
            <label id="s3label" for="s3">حلبة 3 (كجم)</label>
            <input id="s3" data-field="milkS3" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0.0" />
          </div>
        </div>
          </div>

<div id="milkComponentsBox" class="hide compact-section"></div>

<div id="singleTotalBox" class="muted total-line">
  الإجمالي: <span data-key="singleTotalText">—</span> كجم
</div>

<div class="actions-bar" id="singleActionsBar">
  <button type="submit" class="save">حفظ اللبن اليومي</button>

  <button type="button" id="openCowCardBtn" class="ghost">
    فتح بطاقة الحيوان
  </button>
</div>
  </form>
  </div>

<script>
const $ = (id) => document.getElementById(id);

const form = $("milkForm");
const sysbar = $("sysbar");
const msgBox = $("msg");

const animalInput = $("animalNumber");
const dateInput = $("eventDate");

const sessionsBox = $("sessions");
const singleTotalBox = $("singleTotalBox");
const bulkBox = $("bulkBox");
const bulkDateBar = $("bulkDateBar");
const bulkInfo = $("bulkInfo");
const bulkRows = $("bulkRows");
const bulkHeadS3 = $("bulkHeadS3");
const milkComponentsBox = $("milkComponentsBox");
const bulkActions = $("bulkActions");

const saveBulkBtn = $("saveBulkBtn");
const cancelBulkBtn = $("cancelBulkBtn");
const openCowCardBtn = $("openCowCardBtn");
const singleSaveBtn = form?.querySelector('button[type="submit"]');
const singleActions = $("singleActionsBar");

const inputSlots = {
  milkS1: {
    input: $("s1"),
    label: $("s1label"),
    wrap: $("s1")?.closest(".col"),
    n: 1
  },

  milkS2: {
    input: $("s2"),
    label: $("s2label"),
    wrap: $("s2")?.closest(".col"),
    n: 2
  },

  milkS3: {
    input: $("s3"),
    label: $("s3label"),
    wrap: $("s3")?.closest(".col"),
    n: 3
  }
};

let currentMode = "single";
let currentSingleRow = null;
let selectedSingleSessionNumber = null;

if (saveBulkBtn) {
  saveBulkBtn.textContent = "حفظ الحلبة";
}

if (singleSaveBtn) {
  singleSaveBtn.textContent = "حفظ الحلبة";
}

if (
  singleTotalBox?.childNodes?.[0]
) {
  singleTotalBox.childNodes[0].textContent =
    "الإجمالي حتى الآن: ";
}

function qs(name) {
  return new URL(location.href)
    .searchParams
    .get(name) || "";
}

function requestedBulkMode() {
  return (
    qs("mode") === "bulk" ||
    !!qs("numbers")
  );
}

function formatKg(value) {
  const n = Number(value);

  return Number.isFinite(n)
    ? Number(
        n.toFixed(1)
      ).toString()
    : "—";
}

function escapeHtml(value) {
  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

async function postServer(
  path,
  payload
) {
  const res =
    await fetch(
      path,
      {
        method:
          "POST",

        credentials:
          "same-origin",

        cache:
          "no-store",

        headers: {
          "Content-Type":
            "application/json",

          "Accept":
            "application/json"
        },

        body:
          JSON.stringify(
            payload || {}
          )
      }
    );

  const data =
    await res
      .json()
      .catch(
        () => ({
          ok: false,

          ui: {
            status:
              "error",

            message:
              "تعذّر قراءة رد السيرفر."
          }
        })
      );

  if (
    res.status === 401 ||
    data?.error ===
      "auth_required"
  ) {
    return {
      ok: false,

      ui: {
        status:
          "error",

        message:
          data?.message ||
          "سجّل الدخول أولًا."
      }
    };
  }

  return data;
}

function showBar(ui) {
  const status =
    String(
      ui?.status ||
      "info"
    );

  const cls =
    status === "success"
      ? "success"
      : status === "error"
        ? "error"
        : status === "warning"
          ? "warning"
          : "info";

  if (!sysbar) {
    return;
  }

  sysbar.className =
    `infobar mbk-infobar show ${cls}`;

  sysbar.style.display =
    "block";

  sysbar.textContent =
    String(
      ui?.message ||
      ""
    );
}

function showMsg(text) {
  if (!msgBox) {
    return;
  }

  msgBox.textContent =
    String(
      text || ""
    );

  msgBox.style.display =
    text
      ? "block"
      : "none";
}
function clearBulkMissingMilkHighlight() {
  document
    .querySelectorAll(
      "input[data-key='currentSessionKg'][data-mbk-missing-milk='1']"
    )
    .forEach(
      input => {
        input.removeAttribute(
          "data-mbk-missing-milk"
        );

        input.removeAttribute(
          "aria-invalid"
        );

        input.style.outline =
          "";

        input.style.outlineOffset =
          "";
      }
    );
}

function highlightBulkMissingMilkRows(
  missingRows = []
) {
  clearBulkMissingMilkHighlight();

  const targets =
    new Set(
      (
        Array.isArray(
          missingRows
        )
          ? missingRows
          : []
      )
        .map(
          row => {
            const animalNumber =
              String(
                row?.animalNumber ||
                ""
              ).trim();

            const sessionNumber =
              Number(
                row?.sessionNumber ||
                0
              );

            return (
              animalNumber &&
              Number.isInteger(
                sessionNumber
              )
            )
              ? `${animalNumber}::${sessionNumber}`
              : "";
          }
        )
        .filter(Boolean)
    );

  document
    .querySelectorAll(
      "[data-mbk-row='daily-milk-session']"
    )
    .forEach(
      row => {
        const input =
          row.querySelector(
            "input[data-key='currentSessionKg']"
          );

        if (!input) {
          return;
        }

        const key =
          `${String(row.dataset.number || "").trim()}::${Number(input.dataset.sessionNumber || 0)}`;

        if (
          !targets.has(key)
        ) {
          return;
        }

        input.setAttribute(
          "data-mbk-missing-milk",
          "1"
        );

        input.setAttribute(
          "aria-invalid",
          "true"
        );

        input.style.outline =
          "2px solid #dc2626";

        input.style.outlineOffset =
          "1px";
      }
    );
}

function showBulkMissingMilkConfirmation(
  data
) {
  highlightBulkMissingMilkRows(
    data?.missingMilkRows
  );

  if (!sysbar) {
    return;
  }

  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions-bar";

  const saveAnywayBtn =
    document.createElement(
      "button"
    );

  saveAnywayBtn.type =
    "button";

  saveAnywayBtn.className =
    "save";

  saveAnywayBtn.textContent =
    "حفظ على أي حال";

  const reviewBtn =
    document.createElement(
      "button"
    );

  reviewBtn.type =
    "button";

  reviewBtn.className =
    "ghost";

  reviewBtn.textContent =
    "مراجعة";

  actions.appendChild(
    saveAnywayBtn
  );

  actions.appendChild(
    reviewBtn
  );

  sysbar.appendChild(
    actions
  );

 reviewBtn.addEventListener(
    "click",
    () => {
      actions.remove();

      if (sysbar) {
        sysbar.textContent =
          "";

        sysbar.className =
          "infobar";

        sysbar.style.display =
          "none";
      }

      document
        .querySelector(
          "input[data-key='currentSessionKg'][data-mbk-missing-milk='1']"
        )
        ?.focus();
    }
  );

  saveAnywayBtn.addEventListener(
    "click",
    async () => {
      saveAnywayBtn.disabled =
        true;

      reviewBtn.disabled =
        true;

      try {
        await runSave({
          confirmMissingMilk:
            true
        });
      } catch (_) {
        showBar({
          status:
            "error",

          message:
            "تعذّر الاتصال بالسيرفر أثناء الحفظ."
        });
      }
    }
  );
}
function renderMilkComponents(
  componentsUi
) {
  if (
    !milkComponentsBox
  ) {
    return;
  }

  const sections =
    Array.isArray(
      componentsUi
        ?.sections
    )
      ? componentsUi
          .sections
          .filter(
            section =>
              section
                ?.visible ===
              true
          )
      : [];

  milkComponentsBox
    .innerHTML = "";

  if (
    componentsUi
      ?.enabled !== true ||
    !sections.length
  ) {
    milkComponentsBox
      .classList
      .add("hide");

    return;
  }

  sections.forEach(
    section => {
      const sectionEl =
        document
          .createElement(
            "div"
          );

      sectionEl
        .dataset
        .mbkMilkComponentKind =
        String(
          section?.kind ||
          section?.key ||
          ""
        );

      const titleEl =
        document
          .createElement(
            "div"
          );

      titleEl
        .style
        .fontWeight =
        "900";

      titleEl
        .style
        .marginBottom =
        "10px";

      titleEl
        .textContent =
        String(
          section?.title ||
          "مكونات اللبن"
        );

      sectionEl
        .appendChild(
          titleEl
        );

      const rowEl =
        document
          .createElement(
            "div"
          );

      rowEl.className =
        "row";

      const inputs =
        Array.isArray(
          section?.inputs
        )
          ? section
              .inputs
              .filter(
                input =>
                  input
                    ?.visible !==
                  false
              )
          : [];

      inputs.forEach(
        item => {
          const colEl =
            document
              .createElement(
                "div"
              );

          colEl.className =
            "col";

          const labelEl =
            document
              .createElement(
                "label"
              );

          labelEl
            .textContent =
            String(
              item?.label ||
              ""
            );

          const inputEl =
            document
              .createElement(
                "input"
              );

          inputEl.type =
            String(
              item?.type ||
              "number"
            );

          inputEl
            .inputMode =
            "decimal";

          inputEl.value =
            item?.value ??
            "";

          inputEl.disabled =
            item?.disabled ===
            true;

          inputEl
            .dataset
            .mbkMilkComponentKind =
            String(
              section?.kind ||
              section?.key ||
              ""
            );

          inputEl
            .dataset
            .key =
            String(
              item?.key ||
              ""
            );

          if (
            item?.step !==
            undefined
          ) {
            inputEl.step =
              String(
                item.step
              );
          }

          if (
            item?.min !==
            undefined
          ) {
            inputEl.min =
              String(
                item.min
              );
          }

          if (
            item?.max !==
            undefined
          ) {
            inputEl.max =
              String(
                item.max
              );
          }

          colEl
            .appendChild(
              labelEl
            );

          colEl
            .appendChild(
              inputEl
            );

          rowEl
            .appendChild(
              colEl
            );
        }
      );

      sectionEl
        .appendChild(
          rowEl
        );

      milkComponentsBox
        .appendChild(
          sectionEl
        );
    }
  );

  milkComponentsBox
    .classList
    .remove("hide");
}

function readMilkComponents() {
  const components =
    {};

  milkComponentsBox
    ?.querySelectorAll(
      "input[data-mbk-milk-component-kind][data-key]"
    )
    .forEach(
      input => {
        if (
          input.disabled
        ) {
          return;
        }

        const kind =
          String(
            input
              .dataset
              .mbkMilkComponentKind ||
            ""
          ).trim();

        const key =
          String(
            input
              .dataset
              .key ||
            ""
          ).trim();

        if (
          !kind ||
          !key
        ) {
          return;
        }

        if (
          !components[
            kind
          ]
        ) {
          components[
            kind
          ] = {};
        }

        components[
          kind
        ][
          key
        ] =
          input.value ||
          "";
      }
    );

  return components;
}

function hideAllSingleSlots() {
  Object
    .values(
      inputSlots
    )
    .forEach(
      slot => {
        slot.wrap
          ?.classList
          .add(
            "hide"
          );

        if (
          slot.input
        ) {
          slot.input
            .disabled =
            true;

          slot.input
            .value =
            "";
        }
      }
    );
}

function renderSingle(ui) {
  currentMode =
    "single";

  currentSingleRow =
    null;

  selectedSingleSessionNumber =
    null;

  bulkBox
    ?.classList
    .add("hide");

  sessionsBox
    ?.classList
    .remove("hide");

  singleTotalBox
    ?.classList
    .remove("hide");

  singleActions
    ?.classList
    .remove("hide");

  openCowCardBtn
    ?.classList
    .remove("hide");

  singleTotalBox
    ?.parentNode
    ?.insertBefore(
      milkComponentsBox,
      singleTotalBox
    );

  renderMilkComponents(
    ui?.components
  );

  hideAllSingleSlots();

  const row =
    ui?.single ||
    ui?.rows?.[0] ||
    null;

  const totalEl =
    document
      .querySelector(
        "[data-key='singleTotalText']"
      );

  if (
    !row ||
    row?.ok === false ||
    row?.canSave ===
      false
  ) {
    if (
      totalEl
    ) {
      totalEl
        .textContent =
        "—";
    }

    if (
      singleSaveBtn
    ) {
      singleSaveBtn
        .disabled =
        true;
    }

    return;
  }

  currentSingleRow =
    row;

  const required =
    Number(
      row
        .requiredSessions ||
      0
    );

  const next =
    Number(
      row
        .nextSessionNumber
    );

  const sessions =
    Array.isArray(
      row
        .milkSessions
    )
      ? row
          .milkSessions
      : [];

  const byNumber =
    new Map(
      sessions.map(
        item => [
          Number(
            item?.n
          ),

          Number(
            item?.kg
          )
        ]
      )
    );

  for (
    let n = 1;
    n <= required;
    n += 1
  ) {
    const slot =
      inputSlots[
        `milkS${n}`
      ];

    if (!slot) {
      continue;
    }

    const hasRecorded =
      byNumber.has(n) &&
      Number.isFinite(
        byNumber.get(n)
      );

    const isCurrent =
      Number.isInteger(
        next
      ) &&
      n === next;

    if (
      !hasRecorded &&
      !isCurrent
    ) {
      continue;
    }

    slot.wrap
      ?.classList
      .remove(
        "hide"
      );

    if (
      slot.label
    ) {
      slot.label
        .textContent =
        hasRecorded
          ? `حلبة ${n} (كجم) — مسجلة`
          : `حلبة ${n} (كجم) — الحالية`;
    }

    if (
      slot.input
    ) {
      slot.input
        .disabled =
        false;

      slot.input
        .value =
        hasRecorded
          ? formatKg(
              byNumber.get(
                n
              )
            )
          : "";

      slot.input
        .dataset
        .sessionNumber =
        String(n);
    }
  }

  if (
    totalEl
  ) {
    totalEl
      .textContent =
      formatKg(
        row
          .currentTotalKg ||
        0
      );
  }

  selectedSingleSessionNumber =
    Number.isInteger(
      next
    )
      ? next
      : null;

  if (
    singleSaveBtn
  ) {
    singleSaveBtn
      .disabled =
      ui?.canSave !==
        true ||
      !Number.isInteger(
        next
      );
  }
}

function renderCompletedSingle(
  savedRow
) {
  currentMode =
    "single";

  currentSingleRow =
    null;

  selectedSingleSessionNumber =
    null;

  hideAllSingleSlots();

  const required =
    Number(
      savedRow
        ?.requiredSessions ||
      0
    );

  const sessions =
    Array.isArray(
      savedRow
        ?.milkSessions
    )
      ? savedRow
          .milkSessions
      : [];

  const byNumber =
    new Map(
      sessions.map(
        item => [
          Number(
            item?.n
          ),

          Number(
            item?.kg
          )
        ]
      )
    );

  for (
    let n = 1;
    n <= required;
    n += 1
  ) {
    const slot =
      inputSlots[
        `milkS${n}`
      ];

    if (
      !slot ||
      !byNumber.has(n)
    ) {
      continue;
    }

    slot.wrap
      ?.classList
      .remove(
        "hide"
      );

    if (
      slot.label
    ) {
      slot.label
        .textContent =
        `حلبة ${n} (كجم) — مكتملة`;
    }

    if (
      slot.input
    ) {
      slot.input
        .value =
        formatKg(
          byNumber.get(
            n
          )
        );

      slot.input
        .disabled =
        true;
    }
  }

  const totalEl =
    document
      .querySelector(
        "[data-key='singleTotalText']"
      );

  if (
    totalEl
  ) {
    totalEl
      .textContent =
      formatKg(
        savedRow
          ?.currentTotalKg
      );
  }

  if (
    singleSaveBtn
  ) {
    singleSaveBtn
      .disabled =
      true;
  }
}

function bulkSessionCell(
  row,
  n
) {
  const required =
    Number(
      row
        ?.requiredSessions ||
      0
    );

  if (
    !required ||
    n > required
  ) {
    return `
      <td style="padding:6px 4px;background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0">
        —
      </td>
    `;
  }

  const sessions =
    Array.isArray(
      row
        ?.milkSessions
    )
      ? row
          .milkSessions
      : [];

  const recorded =
    sessions.find(
      item =>
        Number(
          item?.n
        ) === n
    );

  const next =
    Number(
      row
        ?.nextSessionNumber
    );

  if (
    recorded &&
    Number.isFinite(
      Number(
        recorded?.kg
      )
    )
  ) {
    return `
      <td style="padding:6px 4px;background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0">
        <input
          type="number"
          value="${escapeHtml(formatKg(recorded.kg))}"
          disabled
          style="width:100%;min-width:0;padding:10px 6px;text-align:center"
        />
      </td>
    `;
  }

  if (
    row?.ok !== false &&
    Number.isInteger(
      next
    ) &&
    next === n
  ) {
    return `
      <td style="padding:6px 4px;background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0">
        <input
          data-key="currentSessionKg"
          data-session-number="${n}"
          type="number"
          min="0"
          step="0.1"
          inputmode="decimal"
          placeholder="0.0"
          style="width:100%;min-width:0;padding:10px 6px;text-align:center"
        />
      </td>
    `;
  }

  return `
    <td style="padding:6px 4px;background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0">
      —
    </td>
  `;
}

function renderBulk(ui) {
  currentMode =
    "bulk";

  bulkBox
    ?.classList
    .remove("hide");

  sessionsBox
    ?.classList
    .add("hide");

  singleTotalBox
    ?.classList
    .add("hide");

  singleActions
    ?.classList
    .add("hide");

  openCowCardBtn
    ?.classList
    .add("hide");

  bulkActions
    ?.parentNode
    ?.insertBefore(
      milkComponentsBox,
      bulkActions
    );

  renderMilkComponents(
    ui?.components
  );

  const animalCol =
    animalInput
      ?.closest(
        ".col"
      );

  const dateCol =
    dateInput
      ?.closest(
        ".col"
      );

  const firstRow =
    animalInput
      ?.closest(
        ".row"
      );

  animalCol
    ?.classList
    .add("hide");

  if (
    bulkDateBar &&
    dateCol &&
    !bulkDateBar
      .contains(
        dateCol
      )
  ) {
    bulkDateBar
      .style
      .display =
      "block";

    bulkDateBar
      .innerHTML =
      "";

    dateCol
      .style
      .flex =
      "1 1 100%";

    dateCol
      .style
      .minWidth =
      "100%";

    bulkDateBar
      .appendChild(
        dateCol
      );
  }

  if (
    firstRow
  ) {
    const hasVisibleCol =
      Array
        .from(
          firstRow
            .querySelectorAll(
              ".col"
            )
        )
        .some(
          el =>
            !el
              .classList
              .contains(
                "hide"
              ) &&
            !bulkDateBar
              ?.contains(
                el
              )
        );

    firstRow
      .classList
      .toggle(
        "hide",
        !hasVisibleCol
      );
  }

  const rows =
    (
      Array.isArray(
        ui?.rows
      )
        ? ui.rows
        : []
    )
      .slice()
      .sort(
        (a, b) =>
          String(
            a?.animalNumber ||
            ""
          ).localeCompare(
            String(
              b?.animalNumber ||
              ""
            ),
            "ar",
            {
              numeric: true,
              sensitivity: "base"
            }
          )
      );

  const hasThirdSession =
    rows.some(
      row =>
        Number(
          row
            ?.requiredSessions ||
          0
        ) >= 3
    );

  if (
    bulkHeadS3
  ) {
    bulkHeadS3
      .style
      .display =
      hasThirdSession
        ? ""
        : "none";
  }

  if (
    bulkInfo
  ) {
    bulkInfo
      .textContent =
      String(
        ui?.message ||
        ""
      );
  }

  if (
    saveBulkBtn
  ) {
    saveBulkBtn
      .disabled =
      ui?.canSave !==
      true;
  }

  if (
    !bulkRows
  ) {
    return;
  }

  bulkRows.innerHTML =
    rows
      .map(
        row => {
          const next =
            Number(
              row
                ?.nextSessionNumber
            );

          const canSave =
            row?.ok !==
              false &&
            row?.canSave !==
              false &&
            Number.isInteger(
              next
            );

          const kindText =
            canSave
              ? (
                  row
                    ?.speciesLabel ||
                  row
                    ?.species ||
                  ""
                )
              : (
                  row
                    ?.reason ||
                  "مرفوض"
                );

          return `
            <tr
              data-mbk-row="daily-milk-session"
              data-number="${escapeHtml(row?.animalNumber || "")}"
              data-can-save="${canSave ? "1" : "0"}"
              style="${canSave ? "" : "opacity:.55;filter:grayscale(.15)"}"
            >
              <td style="padding:8px 6px;background:#fff;border:1px solid #e2e8f0;border-left:none;border-radius:0 12px 12px 0;font-weight:800;white-space:nowrap;font-size:15px">
                ${escapeHtml(row?.animalNumber || "")}
              </td>

              <td style="padding:8px 6px;background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;text-align:center;font-weight:800;font-size:13px">
                ${escapeHtml(kindText)}
              </td>

              ${bulkSessionCell(
                row,
                1
              )}

              ${bulkSessionCell(
                row,
                2
              )}

              ${
                hasThirdSession
                  ? bulkSessionCell(
                      row,
                      3
                    )
                  : ""
              }

              <td style="padding:8px 6px;background:#fff;border:1px solid #e2e8f0;border-right:none;border-radius:12px 0 0 12px;text-align:center;font-size:14px">
                <div style="font-weight:900;color:#0b7f47;min-width:0;font-size:14px">
                  ${
                    canSave
                      ? escapeHtml(
                          formatKg(
                            row
                              ?.currentTotalKg ||
                            0
                          )
                        )
                      : "—"
                  }
                </div>
              </td>
            </tr>
          `;
        }
      )
      .join("");
}

function renderServerUi(
  ui,
  {
    showStatus = true
  } = {}
) {
  if (
    showStatus
  ) {
    showBar(
      ui || {}
    );
  }

  if (
    ui?.mode ===
      "bulk" ||
    requestedBulkMode()
  ) {
    renderBulk(
      ui || {}
    );

    return;
  }

  renderSingle(
    ui || {}
  );
}

function gatePayload() {
  return {
    animalNumbers:
      qs("numbers"),

    animalNumber:
      animalInput
        ?.value ||
      "",

    eventDate:
      dateInput
        ?.value ||
      ""
  };
}

function savePayload() {
  const components =
    readMilkComponents();

  if (
    currentMode ===
    "bulk"
  ) {
    return {
      eventDate:
        dateInput
          ?.value ||
        "",

      components,

      rows:
        Array
          .from(
            document
              .querySelectorAll(
                "[data-mbk-row='daily-milk-session'][data-can-save='1']"
              )
          )
          .map(
            row => {
              const input =
                row
                  .querySelector(
                    "input[data-key='currentSessionKg']"
                  );

              return {
                animalNumber:
                  row
                    .dataset
                    .number ||
                  "",

                sessionNumber:
                  Number(
                    input
                      ?.dataset
                      .sessionNumber ||
                    0
                  ),

                milkKg:
                  input
                    ?.value ||
                  ""
              };
            }
          )
    };
  }

  const slot =
    inputSlots[
      `milkS${selectedSingleSessionNumber}`
    ];

  return {
    animalNumber:
      animalInput
        ?.value ||
      "",

    eventDate:
      dateInput
        ?.value ||
      "",

    sessionNumber:
      selectedSingleSessionNumber,

    milkKg:
      slot
        ?.input
        ?.value ||
      "",

    components
  };
}

async function runGate({
  silent = false
} = {}) {
  const payload =
    gatePayload();

  if (
    !payload
      .eventDate ||
    (
      !payload
        .animalNumber &&
      !payload
        .animalNumbers
    )
  ) {
    return;
  }

  showMsg("");

  if (
    !silent
  ) {
    showBar({
      status:
        "info",

      message:
        "جارِ التحقق…"
    });
  }

  const data =
    await postServer(
      "/api/daily-milk/session/gate",
      payload
    );

  const ui =
    data.ui || {
      status:
        data.ok
          ? "success"
          : "error",

      message:
        data.message ||
        "تم استلام رد السيرفر.",

      canSave:
        data.allowed ===
        true,

      rows: [],

      single:
        null
    };

  renderServerUi(
    ui,
    {
      showStatus:
        !silent
    }
  );

  return data;
}

async function runSave({
  confirmMissingMilk = false
} = {}) {
  showMsg("");

  showBar({
    status:
      "info",

    message:
      "جارِ حفظ الحلبة…"
  });

  const modeBeforeSave =
    currentMode;

  const payload =
    savePayload();

  if (
    modeBeforeSave ===
      "bulk" &&
    confirmMissingMilk ===
      true
  ) {
    payload.confirmMissingMilk =
      true;
  }

  const data =
    await postServer(
      "/api/daily-milk/session/save",
      payload
    );

  const ui =
    data.ui || {
      status:
        data.ok
          ? "success"
          : "error",

      message:
        data.message ||
        "تم استلام رد السيرفر."
    };

  showBar(ui);

  if (
    modeBeforeSave ===
      "bulk" &&
    data
      ?.confirmationRequired ===
      true &&
    data?.stage ===
      "daily_milk_session_missing_confirmation"
  ) {
    showBulkMissingMilkConfirmation(
      data
    );

    return;
  }

  if (
    !data.ok ||
    !Array.isArray(
      data.saved
    ) ||
    !data
      .saved
      .length
  ) {
    return;
  }

  clearBulkMissingMilkHighlight();

  if (
    modeBeforeSave ===
    "single"
  ) {
    const savedRow =
      data.saved[0];

    if (
      savedRow
        ?.completed ===
      true
    ) {
      renderCompletedSingle(
        savedRow
      );

      return;
    }

    await runGate({
      silent: true
    });

    showBar(ui);

    return;
  }

  await runGate({
    silent: true
  });

  showBar(ui);
}
form
  ?.addEventListener(
    "submit",
    async e => {
      e.preventDefault();

      try {
        await runSave();
      } catch (_) {
        showBar({
          status:
            "error",

          message:
            "تعذّر الاتصال بالسيرفر أثناء الحفظ."
        });
      }
    }
  );

saveBulkBtn
  ?.addEventListener(
    "click",
    async () => {
      try {
        await runSave();
      } catch (_) {
        showBar({
          status:
            "error",

          message:
            "تعذّر الاتصال بالسيرفر أثناء الحفظ."
        });
      }
    }
  );

cancelBulkBtn
  ?.addEventListener(
    "click",
    () => {
      location.href =
        "/dashboard.html";
    }
  );

openCowCardBtn
  ?.addEventListener(
    "click",
    () => {
      const n =
        animalInput
          ?.value ||
        "";

      if (!n) {
        return;
      }

      location.href =
        `/cow-card.html?number=${encodeURIComponent(n)}`;
    }
  );

animalInput
  ?.addEventListener(
    "change",
    runGate
  );

animalInput
  ?.addEventListener(
    "blur",
    runGate
  );

dateInput
  ?.addEventListener(
    "change",
    runGate
  );

Object
  .values(
    inputSlots
  )
  .forEach(
    slot => {
      slot.input
        ?.addEventListener(
          "input",
          () => {
            if (
              slot.input
                .disabled ||
              slot.wrap
                ?.classList
                .contains(
                  "hide"
                )
            ) {
              return;
            }

            selectedSingleSessionNumber =
              slot.n;
          }
        );
    }
  );

const initialDate =
  qs("date") ||
  qs("eventDate") ||
  "";

const initialNumber =
  qs("animalNumber") ||
  qs("number") ||
  qs("animalId") ||
  "";

if (
  initialDate &&
  dateInput
) {
  dateInput.value =
    initialDate;
}

if (
  initialNumber &&
  animalInput
) {
  animalInput.value =
    initialNumber;
}

if (
  (
    qs("numbers") ||
    initialNumber
  ) &&
  dateInput?.value
) {
  runGate();
}
</script>
</body>
</html>
