<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="insemination">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ستايل ونظام الفورم المركزي -->
  <link rel="stylesheet" href="css/forms.css">
  


  <title>تسجيل التلقيح — مُرَبِّيك</title>
</head>

<body>

  <!-- نفس هيدر الولادة القياسي -->
  <header>
    <div class="mbk-head">
      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
      <div class="mbk-center">
        <div class="mbk-page-title">تسجيل التلقيح</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>
      <a class="mbk-back" href="add-event.html">رجوع</a>
    </div>
  </header>
<div id="gateBox" class="infobar mbk-infobar" style="display:none;"></div>
  <script>window.dataLayer = window.dataLayer || [];</script>

 <main>
<form id="eventForm"
      class="card grid"
      data-event="تلقيح"
      autocomplete="off"
      novalidate>

      <label>رقم الحيوان *</label>
      <input data-field="animalNumber" inputmode="numeric" />

      <label>تاريخ التلقيح *</label>
      <input type="date" data-field="eventDate" />

      <label>طريقة التلقيح *</label>
      <select data-field="inseminationMethod">
        <option value="">اختر</option>
        <option>طبيعي</option>
        <option>اصطناعي</option>
      </select>

     <label>كود السائل المنوي *</label>
     <input data-field="semenCode" list="semenCodeOptions" autocomplete="off" />
     <datalist id="semenCodeOptions"></datalist>

     <label>اسم الملقّح *</label>
     <input data-field="inseminator" list="inseminatorOptions" autocomplete="off" />
     <datalist id="inseminatorOptions"></datalist>

      <label>وقت التلقيح *</label>
      <div class="radio-group">
        <label><input type="radio" name="inseminationTime" value="صباحا" data-field="inseminationTime"> صباحا</label>
        <label><input type="radio" name="inseminationTime" value="مساءا" data-field="inseminationTime"> مساءا</label>
      </div>

      <label>حالة الشياع *</label>
      <div class="radio-group">
        <label><input type="radio" name="heatStatus" value="صباحا" data-field="heatStatus"> صباحا</label>
        <label><input type="radio" name="heatStatus" value="مساءا" data-field="heatStatus"> مساءا</label>
      </div>

      <label>ملاحظات</label>
<textarea data-field="notes"></textarea>

<div class="row" id="editToolsRow" style="display:none">
  <div>
    <label>القائم بالتعديل</label>
    <input
      id="correctionPerformedBy"
      type="text"
      maxlength="160"
      list="correctionPerformersList"
      placeholder="اسم الفني أو الطبيب"
      autocomplete="off"
    />
    <datalist id="correctionPerformersList"></datalist>
    <small class="form-hint">
      يُستخدم نفس دليل الفنيين والأطباء في مُرَبِّيك.
    </small>
  </div>

  <div>
    <label>سبب التعديل</label>
    <input
      id="correctionReason"
      type="text"
      maxlength="500"
      placeholder="اكتب سبب تصحيح بيانات التلقيح"
    />
    <small class="form-hint">
      يُحفظ سبب التعديل داخل سجل التصحيحات.
    </small>
  </div>
</div>

<div class="actions-bar">
  <button type="submit" class="save">حفظ التلقيح ✅</button>
  <button type="button" id="openCowCardBtn" class="ghost">فتح بطاقة الحيوان</button>
</div>


    </form>

  </main>
<!-- تهيئة الصفحة فقط — الحفظ والتحديث أصبحا في السيرفر عبر forms-init.js -->
<script>
  const qp = new URLSearchParams(location.search);

  const requestedEditMode =
    String(qp.get("mode") || "")
      .trim()
      .toLowerCase() === "edit";

  const editEventId =
    String(qp.get("eventId") || "").trim();

  const isEditMode =
    requestedEditMode && !!editEventId;

  const form = document.getElementById("eventForm");
  const animalEl = document.querySelector('[data-field="animalNumber"]');
const dateEl = document.querySelector('[data-field="eventDate"]');
const gateBox = document.getElementById("gateBox");
const saveBtn = form?.querySelector('button[type="submit"]');

const correctionPerformedByEl =
  document.getElementById(
    "correctionPerformedBy"
  );

const correctionPerformersListEl =
  document.getElementById(
    "correctionPerformersList"
  );

 if (animalEl) {
  animalEl.value =
    qp.get("animalNumbers") ||
    qp.get("numbers") ||
    qp.get("animalNumber") ||
    qp.get("number") ||
    qp.get("animalId") ||
    "";
}

if (dateEl) {
  dateEl.value =
    qp.get("eventDate") ||
    qp.get("date") ||
    qp.get("inseminationDate") ||
    qp.get("heatDate") ||
    new Date().toISOString().slice(0, 10);
}
  const heatTimeFromQuery =
  qp.get("heatStatus") ||
  qp.get("heatTime") ||
  qp.get("observedHeatTime") ||
  "";

setRadioValue("heatStatus", heatTimeFromQuery);
  function parseNumbers(raw) {
    const map = {
      "٠": "0","١": "1","٢": "2","٣": "3","٤": "4","٥": "5","٦": "6","٧": "7","٨": "8","٩": "9",
      "۰": "0","۱": "1","۲": "2","۳": "3","۴": "4","۵": "5","۶": "6","۷": "7","۸": "8","۹": "9"
    };

    const s = String(raw || "").replace(/[٠-٩۰-۹]/g, d => map[d] || d);
    return [...new Set((s.match(/\d+/g) || []).map(x => x.trim()).filter(Boolean))];
  }

  function readRadio(form, name) {
    return String(form.querySelector(`input[name="${name}"]:checked`)?.value || "").trim();
  }
    function normalizeDayPart(v) {
    const s = String(v || "")
      .trim()
      .replace(/[ًٌٍَُِّْ]/g, "")
      .replace(/\s+/g, "");

    if (s === "ص" || s.includes("صباح")) return "صباحا";
    if (s === "م" || s.includes("مساء")) return "مساءا";

    return String(v || "").trim();
  }

  function setRadioValue(name, value) {
    const wanted = normalizeDayPart(value);
    if (!wanted) return;

    const radios = [...form.querySelectorAll(`input[name="${name}"]`)];
    const target = radios.find(r => normalizeDayPart(r.value) === wanted);

    if (target) target.checked = true;
  }
  function compactReason(reason) {
    return String(reason || "")
      .replace(/^❌\s*/, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function showGate(msg, type = "info") {
    const box = gateBox;
    if (!box) return;

    box.style.display = "block";
    box.className = "infobar mbk-infobar show " + (
      type === "error" ? "error" :
      type === "success" ? "success" :
      type === "warn" ? "warning" :
      "info"
    );

    box.innerHTML = `
      <div style="display:grid;gap:10px;text-align:center">
        <div style="white-space:pre-line;font-weight:900;font-size:15px;line-height:1.7">
          ${String(msg || "").replace(/</g, "&lt;").replace(/>/g, "&gt;")}
        </div>

        <button type="button" id="gateOkBtn"
          style="width:auto;min-width:110px;margin:0 auto;padding:8px 16px;border-radius:999px;border:2px solid #0b7f47;background:#fff;color:#0b7f47;font-weight:900;cursor:pointer">
          حسنًا
        </button>
      </div>
    `;

    box.querySelector("#gateOkBtn")?.addEventListener("click", () => {
      box.style.display = "none";
    });

    try { box.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (_) {}
  }
  async function sessionFetchJson(url, options = {}) {
  const r = await fetch(url, {
    method: options.method || "GET",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Accept": "application/json",
      ...(options.body ? { "Content-Type": "application/json" } : {}),
      ...(options.headers || {})
    },
    body: options.body ? JSON.stringify(options.body) : undefined
  });

  const data = await r.json().catch(() => ({
    ok: false,
    message: ""
  }));

  if (r.status === 401 || data?.error === "auth_required") {
    showGate(data?.message || "سجّل الدخول أولًا.", "error");
    return { r, data, authRequired: true };
  }

 return { r, data, authRequired: false };
}

function renderCorrectionPerformers(items = []) {
  if (!correctionPerformersListEl) return;

  const values =
    [...new Set(
      (Array.isArray(items) ? items : [])
        .map(x =>
          String(x || "").trim()
        )
        .filter(Boolean)
    )];

  correctionPerformersListEl.replaceChildren(
    ...values.map(value => {
      const option =
        document.createElement("option");

      option.value = value;

      return option;
    })
  );
}

async function loadEditEvent() {
  if (!editEventId) {
    showGate(
      "❌ تعذّر تحديد حدث التلقيح المطلوب تعديله.",
      "error"
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }

    return;
  }

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
    }

    if (animalEl) {
      animalEl.readOnly = true;
    }

    if (dateEl) {
      dateEl.disabled = true;
    }

    showGate(
      "جارِ تحميل بيانات التلقيح للتعديل…",
      "info"
    );

    const {
      r,
      data,
      authRequired
    } =
      await sessionFetchJson(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`
      );

    if (authRequired) return;

    if (
      !r.ok ||
      !data?.ok ||
      !data?.event
    ) {
      showGate(
        data?.message ||
          "❌ تعذّر تحميل بيانات التلقيح للتعديل.",
        "error"
      );

      return;
    }

    if (
      String(
        data.event.typeKey || ""
      ).trim() !== "insemination"
    ) {
      showGate(
        "❌ الحدث المحدد ليس حدث تلقيح.",
        "error"
      );

      return;
    }

    if (
      data.event?.editPolicy?.editable !== true
    ) {
      showGate(
        data.event?.editPolicy?.reason ||
          "❌ هذا الحدث غير متاح للتعديل.",
        "error"
      );

      return;
    }

    renderCorrectionPerformers(
      data.correctionPerformers
    );

    const ev =
      data.event;

    const d =
      ev.data || {};

    if (animalEl) {
      animalEl.value =
        String(
          ev.animalNumber || ""
        ).trim();
    }

    if (dateEl) {
      dateEl.value =
        String(
          d.eventDate ||
          ev.eventDate ||
          ""
        )
          .trim()
          .slice(0, 10);
    }

    const methodEl =
      form.querySelector(
        '[data-field="inseminationMethod"]'
      );

    const semenEl =
      form.querySelector(
        '[data-field="semenCode"]'
      );

    const inseminatorEl =
      form.querySelector(
        '[data-field="inseminator"]'
      );

    const notesEl =
      form.querySelector(
        '[data-field="notes"]'
      );

    if (methodEl) {
      methodEl.value =
        String(
          d.inseminationMethod || ""
        ).trim();
    }

    if (semenEl) {
      semenEl.value =
        String(
          d.semenCode || ""
        ).trim();
    }

    if (inseminatorEl) {
      inseminatorEl.value =
        String(
          d.inseminator || ""
        ).trim();
    }

    setRadioValue(
      "inseminationTime",
      d.inseminationTime || ""
    );

    setRadioValue(
      "heatStatus",
      d.heatStatus || ""
    );

    if (notesEl) {
      notesEl.value =
        String(
          d.notes || ""
        );
    }

    setDetailsDisabled(false);

    if (animalEl) {
      animalEl.readOnly = true;
    }

    if (dateEl) {
      dateEl.disabled = false;
    }

    const editToolsRow =
      document.getElementById(
        "editToolsRow"
      );

    const correctionReasonEl =
      document.getElementById(
        "correctionReason"
      );

    if (editToolsRow) {
      editToolsRow.style.display = "";
    }

    if (correctionPerformedByEl) {
      correctionPerformedByEl.required = true;
    }

    if (correctionReasonEl) {
      correctionReasonEl.required = true;
    }

    const title =
      document.querySelector(
        ".mbk-page-title"
      );

    if (title) {
      title.textContent =
        "تعديل تلقيح";
    }

    document.title =
      "تعديل تلقيح — مُرَبِّيك";

    if (saveBtn) {
      saveBtn.textContent =
        "حفظ التعديل ✅";

      saveBtn.disabled = false;
    }

    const back =
      document.querySelector(
        ".mbk-back"
      );

    if (back) {
      back.href =
        `event-list.html?number=${encodeURIComponent(
          ev.animalNumber || ""
        )}`;
    }

    if (gateBox) {
      gateBox.style.display = "none";
    }

  } catch (err) {
    console.error(
      "insemination edit load failed",
      err
    );

    showGate(
      "❌ تعذّر تحميل بيانات التلقيح للتعديل.",
      "error"
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }
  }
}

function collectPayload() {
    const animalNumber = String(animalEl?.value || "").trim();
    const eventDate = String(dateEl?.value || "").trim();

    return {
      animalNumber,
      animalNumbers: animalNumber,
      number: animalNumber,
      numbers: animalNumber,
      eventDate,
      inseminationMethod: String(form.querySelector('[data-field="inseminationMethod"]')?.value || "").trim(),
      semenCode: String(form.querySelector('[data-field="semenCode"]')?.value || "").trim(),
      inseminator: String(form.querySelector('[data-field="inseminator"]')?.value || "").trim(),
      inseminationTime: readRadio(form, "inseminationTime"),
      heatStatus: readRadio(form, "heatStatus"),
      notes: String(form.querySelector('[data-field="notes"]')?.value || "").trim()
    };
  }

  function setDetailsDisabled(disabled) {
    form.querySelectorAll("[data-field], button[type='submit']").forEach((el) => {
      const key = el.getAttribute("data-field") || "";
      if (key === "animalNumber" || key === "eventDate") return;
      el.disabled = !!disabled;
    });
  }

  function applyAcceptedNumbers(data) {
    const acceptedNums = Array.isArray(data.accepted)
      ? data.accepted.map(x => String(x.animalNumber || "").trim()).filter(Boolean)
      : [];

    if (!acceptedNums.length) return;

    const current = parseNumbers(animalEl?.value || "");
    const same =
      current.length === acceptedNums.length &&
      current.every((x, i) => x === acceptedNums[i]);

    if (same) return;

    animalEl.value = acceptedNums.join(",");
  }

  function renderGateResult(data) {
    const msg = String(data?.message || data?.error || "").trim();
    const msgClean = compactReason(msg);

    const rejectedItems = Array.isArray(data?.rejected) ? data.rejected : [];

    const rejectedLines = rejectedItems
      .slice(0, 8)
      .map(x => {
        const n = String(x.animalNumber || "").trim();
        const reason = compactReason(x.reason || "");
               if (!reason) return "";
        if (msgClean.includes(reason)) return "";
        return `${n}: ${reason}`;
      })
      .filter(Boolean);

    const fullMsg = [
      msg,
      rejectedLines.length ? rejectedLines.join("\n") : ""
    ].filter(Boolean).join("\n\n");

    if (fullMsg) {
      showGate(fullMsg, data?.allowed ? "success" : "error");
    }

    if (data?.allowed) {
      applyAcceptedNumbers(data);
      setDetailsDisabled(false);
    } else {
      setDetailsDisabled(true);
    }
  }

  let gateTimer = null;
  let lastGateKey = "";

async function runGateNow() {
  if (!form) return;

  const payload = collectPayload();
  const nums = parseNumbers(payload.animalNumber);

  const gateKey = JSON.stringify({
    n: nums.join(","),
    d: payload.eventDate
  });

  if (gateKey === lastGateKey) return;
  lastGateKey = gateKey;

  if (!nums.length || !payload.eventDate) {
    setDetailsDisabled(true);
    if (gateBox) gateBox.style.display = "none";
    return;
  }

  try {
    setDetailsDisabled(true);
    showGate("جارِ التحقق من أهلية التلقيح…", "info");

    const { r, data, authRequired } = await sessionFetchJson("/api/insemination/gate", {
      method: "POST",
      body: payload
    });

    if (authRequired) return;

    if (!r.ok && !data?.message && !data?.error) {
      data.message = "تعذّر التحقق من أهلية التلقيح الآن.";
    }

    renderGateResult(data);

  } catch (err) {
    console.error("insemination gate failed", err);
    showGate("❌ تعذّر التحقق من أهلية التلقيح الآن.", "error");
    setDetailsDisabled(true);
  }
}

  function scheduleGate() {
  if (requestedEditMode) return;

  clearTimeout(gateTimer);
  gateTimer =
    setTimeout(
      runGateNow,
      350
    );
}

  animalEl?.addEventListener("input", scheduleGate);
  animalEl?.addEventListener("change", scheduleGate);
  dateEl?.addEventListener("change", scheduleGate);

 form?.addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = collectPayload();

if (requestedEditMode) {
  if (!isEditMode) {
    showGate(
      "❌ تعذّر تحديد حدث التلقيح المطلوب تعديله.",
      "error"
    );

    return;
  }

  const correctionPerformedBy =
    String(
      correctionPerformedByEl?.value || ""
    ).trim();

  if (!correctionPerformedBy) {
    showGate(
      "❌ أدخل اسم القائم بالتعديل.",
      "error"
    );

    correctionPerformedByEl?.focus?.();

    return;
  }

  const correctionReason =
    String(
      document.getElementById(
        "correctionReason"
      )?.value || ""
    ).trim();

  if (!correctionReason) {
    showGate(
      "❌ اكتب سبب التعديل.",
      "error"
    );

    document
      .getElementById(
        "correctionReason"
      )
      ?.focus?.();

    return;
  }

  payload.correctionPerformedBy =
    correctionPerformedBy;

  payload.correctionReason =
    correctionReason;

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
    }

    showGate(
      "جارِ حفظ تعديل التلقيح…",
      "info"
    );

    const {
      r,
      data,
      authRequired
    } =
      await sessionFetchJson(
        `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
        {
          method: "POST",
          body: payload
        }
      );

    if (authRequired) return;

    if (
      !r.ok &&
      !data?.message &&
      !data?.error
    ) {
      data.message =
        "تعذّر حفظ تعديل التلقيح.";
    }

    const serverMessage =
      String(
        data?.message ||
        data?.error ||
        ""
      ).trim();

    if (serverMessage) {
      showGate(
        serverMessage,
        data?.ok
          ? "success"
          : "error"
      );
    }

    if (data?.ok) {
      setTimeout(() => {
        location.href =
          `event-list.html?number=${encodeURIComponent(
            payload.animalNumber
          )}`;
      }, 1000);
    }

  } catch (err) {
    console.error(
      "insemination correction failed",
      err
    );

    showGate(
      "❌ تعذّر حفظ تعديل التلقيح الآن.",
      "error"
    );

  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
    }
  }

  return;
}

const nums =
  parseNumbers(
    payload.animalNumber
  );

const isBulk =
    new URLSearchParams(location.search).get("mode") === "bulk" ||
    nums.length > 1;

  const endpoint = isBulk
    ? "/api/insemination/bulk-save"
    : "/api/insemination/save";

  const btn = form.querySelector('button[type="submit"]');

  try {
    if (btn) btn.disabled = true;

    const { r, data, authRequired } = await sessionFetchJson(endpoint, {
      method: "POST",
      body: payload
    });

    if (authRequired) return;

    if (!r.ok && !data?.message && !data?.error) {
      data.message = "تعذّر حفظ التلقيح الآن.";
    }

    const mainMsg = String(data.message || data.error || "").trim();
    const mainClean = compactReason(mainMsg);

    const rejectedLines = Array.isArray(data.rejected) && data.rejected.length
      ? data.rejected.slice(0, 8).map(x => {
          const n = String(x.animalNumber || "").trim();
          const reason = compactReason(x.reason || "");
                   if (!reason) return "";
          if (mainClean.includes(reason)) return "";
          return `${n}: ${reason}`;
        }).filter(Boolean).join("\n")
      : "";

    const serverMessage = [
      mainMsg,
      rejectedLines
    ].filter(Boolean).join("\n\n");

    if (serverMessage.trim()) {
      showGate(serverMessage, data.ok ? "success" : "error");
    }

    if (data.ok && data.redirectUrl) {
      setTimeout(() => {
        location.href = data.redirectUrl;
      }, 1100);
    }

  } catch (err) {
    console.error("insemination save failed", err);
    showGate("❌ تعذّر حفظ التلقيح الآن.", "error");
  } finally {
    if (btn) btn.disabled = false;
  }
});
  const openBtn = document.getElementById("openCowCardBtn");
  openBtn?.addEventListener("click", () => {
    const n = String(animalEl?.value || "").trim();
    if (!n) {
      showGate("اكتب رقم الحيوان أولًا.", "error");
      return;
    }

    location.href = `cow-card.html?number=${encodeURIComponent(n)}`;
  });

async function loadInseminationSavedOptions() {
  try {
    const { r, data, authRequired } = await sessionFetchJson("/api/insemination/options");

    if (authRequired) return;
    if (!r.ok || data?.ok !== true) return;

    const semenList = document.getElementById("semenCodeOptions");
    const inseminatorList = document.getElementById("inseminatorOptions");

    if (semenList) {
      semenList.innerHTML = "";
      (data.semenCodes || []).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        semenList.appendChild(opt);
      });
    }

    if (inseminatorList) {
      inseminatorList.innerHTML = "";
      (data.inseminators || []).forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        inseminatorList.appendChild(opt);
      });
    }
  } catch (_) {}
}
  setDetailsDisabled(true);
loadInseminationSavedOptions();

if (requestedEditMode) {
  if (!editEventId) {
    showGate(
      "❌ رابط تعديل التلقيح غير مكتمل.",
      "error"
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }

  } else {
    loadEditEvent();
  }

} else {
  scheduleGate();
}
</script>
</body>
</html>
