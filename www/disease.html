<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="css/forms.css">
  
 <title>التشخيص الصحي — مُرَبِّيك</title>
 
</head>
<body data-page="disease">
<header class="mbk-top">
  <div class="mbk-head">
    <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">

    <div class="mbk-title">
      <div class="mbk-page" id="pageTitle">التشخيص الصحي</div>
      <div class="mbk-app">مُرَبِّيك</div>
    </div>

    <a class="mbk-back" id="backLink" href="add-event.html" aria-label="رجوع">رجوع</a>
  </div>
</header>

  <main>
    
  <div id="gateBox" class="infobar info show">
    جاري تجهيز التشخيصات المناسبة...
  </div>
    <div class="card grid">
      <div class="row">
        <div>
          <label>رقم الحيوان</label>
          <input id="animalNumber" inputmode="numeric" placeholder="مثال: 1023" required />
        </div>
        <div>
          <label>تاريخ التشخيص</label>
          <input id="eventDate" type="date" required />
        </div>
               <div>
          <label>ملاحظات</label>
          <input id="notes" placeholder="اختياري" />
        </div>
      </div>
    </div>
<div
  class="card grid"
  id="diseaseDetailCard"
  hidden
  style="display:none"
>
  <div
    id="diseaseDetailTitle"
    class="form-hint"
  ></div>

  <div class="row">
    <div>
      <label for="parasiteType">
        نوع الطفيل
      </label>

      <select
        id="parasiteType"
      ></select>
    </div>

    <div>
      <label for="parasiteDiagnosisMethod">
        طريقة التشخيص
      </label>

      <select
        id="parasiteDiagnosisMethod"
      ></select>
    </div>

    <div>
      <label for="parasiteSeverity">
        شدة الإصابة
      </label>

      <select
        id="parasiteSeverity"
      ></select>
    </div>
  </div>

  <div>
    <label>
      العلامات الموجودة
    </label>

    <div
      id="parasiteSignsList"
      class="mbk-action-list mbk-event-grid"
    ></div>
  </div>

  <div
    id="parasiteBodySitesWrap"
    hidden
    style="display:none"
  >
    <label>
      مواضع الإصابة
    </label>

    <div
      id="parasiteBodySitesList"
      class="mbk-action-list mbk-event-grid"
    ></div>
  </div>
</div>
    <div
      class="card grid"
      id="diseaseConfirmCard"
      hidden
      style="display:none"
    >
      <div id="diseaseConfirmText" class="form-hint"></div>

      <div class="mbk-action-list mbk-event-grid">
        <button
          type="button"
          class="mbk-action-tile"
          id="confirmDiseaseBtn"
        >
          تأكيد التسجيل
        </button>

        <button
          type="button"
          class="mbk-action-tile"
          id="cancelDiseaseBtn"
        >
          إلغاء
        </button>
      </div>
    </div>

   <div
  class="card grid"
  id="editToolsCard"
  hidden
  style="display:none"
>
  <div class="row">
    <div>
      <label for="correctionPerformedBy">القائم بالتعديل</label>
      <input
        id="correctionPerformedBy"
        type="text"
        list="operationalPerformersList"
        maxlength="160"
        autocomplete="off"
        placeholder="اسم القائم بالتعديل"
      />
    </div>

    <div>
      <label for="correctionReason">سبب التعديل</label>
      <input
        id="correctionReason"
        type="text"
        maxlength="500"
        autocomplete="off"
        placeholder="اكتب سبب تصحيح التشخيص الصحي"
      />
    </div>
  </div>

  <datalist id="operationalPerformersList"></datalist>
</div>

<div id="animalSummary" class="form-hint"></div>

<div
  id="dz"
  class="mbk-action-hub mbk-event-hub"
></div>
  </main>

<script>
(function(){
  const API_BASE = location.origin;
  const $ = (id) => document.getElementById(id);

  const animalNumberEl = $("animalNumber");
  const eventDateEl = $("eventDate");
  const gateBox = $("gateBox");
  const dz = $("dz");
  const animalSummary = $("animalSummary");
  const notesEl = $("notes");

  const editToolsCard =
    $("editToolsCard");

  const correctionPerformedByEl =
    $("correctionPerformedBy");

  const correctionReasonEl =
    $("correctionReason");

  const operationalPerformersList =
    $("operationalPerformersList");

  const pageTitle =
    $("pageTitle");

  const backLink =
    $("backLink");
    const diseaseConfirmCard =
  $("diseaseConfirmCard");

const diseaseConfirmText =
  $("diseaseConfirmText");

const confirmDiseaseBtn =
  $("confirmDiseaseBtn");

const cancelDiseaseBtn =
  $("cancelDiseaseBtn");
  const diseaseDetailCard =
  $("diseaseDetailCard");

const diseaseDetailTitle =
  $("diseaseDetailTitle");

const parasiteTypeEl =
  $("parasiteType");

const parasiteDiagnosisMethodEl =
  $("parasiteDiagnosisMethod");

const parasiteSeverityEl =
  $("parasiteSeverity");

const parasiteSignsList =
  $("parasiteSignsList");

const parasiteBodySitesWrap =
  $("parasiteBodySitesWrap");

const parasiteBodySitesList =
  $("parasiteBodySitesList");

let pendingDiseaseItem = null;
let pendingDiseaseButton = null;
let currentEditDiseaseData = null;

  const params =
    new URLSearchParams(
      location.search
    );

  const requestedEditMode =
    String(
      params.get("mode") || ""
    )
      .trim()
      .toLowerCase() === "edit";

  const editEventId =
    String(
      params.get("eventId") || ""
    ).trim();

  const isEditMode =
    requestedEditMode &&
    !!editEventId;


  let gateTimer = null;
  let gateAllowed = false;
  let gateKey = "";
  let gateMessage =
    "لم يتم التحقق من الحيوان بعد.";

  let currentDiseaseCode = "";


  function todayLocal(){
    const d = new Date();

    d.setMinutes(
      d.getMinutes() -
      d.getTimezoneOffset()
    );

    return d
      .toISOString()
      .slice(0,10);
  }


  function digitsOnly(v){
    const map = {
      "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
      "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
      "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
      "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
    };

    return String(v || "")
      .replace(
        /[٠-٩۰-۹]/g,
        d => map[d] || d
      )
      .replace(/[^\d]/g, "")
      .trim();
  }


  function setBar(
    el,
    text,
    type
  ){
    if (!el) return;

    el.textContent =
      text || "";

    el.className =
      "infobar show " +
      (type || "info");
  }


  function handleAuthRequired(
    j,
    status
  ){
    if (
      status === 401 ||
      (
        j &&
        (
          j.error ===
            "auth_required" ||
          j.message ===
            "سجّل الدخول أولًا."
        )
      )
    ) {
      location.href =
        "login.html?next=" +
        encodeURIComponent(
          location.pathname +
          location.search
        );

      return true;
    }

    return false;
  }


  async function apiRequest(
    url,
    {
      method = "GET",
      body
    } = {}
  ){
    const options = {
      method,
      credentials:
        "same-origin",
      cache:
        "no-store",
      headers: {
        "Accept":
          "application/json"
      }
    };

    if (body !== undefined) {
      options.headers[
        "Content-Type"
      ] =
        "application/json";

      options.body =
        JSON.stringify(
          body || {}
        );
    }

    const r =
      await fetch(
        API_BASE + url,
        options
      );

    const j =
      await r
        .json()
        .catch(() => ({}));

    if (
      handleAuthRequired(
        j,
        r.status
      )
    ) {
      throw new Error(
        j.message ||
        "❌ سجّل الدخول أولًا."
      );
    }

    if (
      !r.ok ||
      j.ok === false
    ) {
      const err =
        new Error(
          j.message ||
          "تعذّر تنفيذ الطلب."
        );

      err.status =
        r.status;

      err.response =
        j;

      throw err;
    }

    return j;
  }


  function renderSummary(
    animal
  ){
    if (!animalSummary) return;

    if (!animal) {
      animalSummary.textContent =
        "";

      return;
    }

    const parts = [];

    if (
      animal.productionStatus
    ) {
      parts.push(
        "إنتاجيًا: " +
        animal.productionStatus
      );
    }

    if (
      animal.reproductiveStatus
    ) {
      parts.push(
        "تناسليًا: " +
        animal.reproductiveStatus
      );
    }

    if (
      animal.followerStatus
    ) {
      parts.push(
        "حالة التابع: " +
        animal.followerStatus
      );
    }

    animalSummary.textContent =
      parts.join(" — ");
  }


  function renderPerformers(
    items = []
  ){
    operationalPerformersList
      .replaceChildren();

    [
      ...new Set(
        (
          Array.isArray(items)
            ? items
            : []
        )
          .map(x =>
            String(x || "")
              .trim()
          )
          .filter(Boolean)
      )
    ].forEach(name => {
      const option =
        document.createElement(
          "option"
        );

      option.value =
        name;

      operationalPerformersList
        .appendChild(option);
    });
  }
function diseaseDetailSavedValue(
  saved,
  key,
  fallback = ""
){
  if (
    !saved ||
    typeof saved !== "object"
  ) {
    return fallback;
  }

  const direct =
    saved[key];

  if (
    direct !== undefined &&
    direct !== null &&
    direct !== ""
  ) {
    return direct;
  }

  const nested =
    saved.details &&
    typeof saved.details === "object"
      ? saved.details[key]
      : undefined;

  return (
    nested !== undefined &&
    nested !== null &&
    nested !== ""
  )
    ? nested
    : fallback;
}


function fillDiseaseDetailSelect(
  selectEl,
  items,
  selectedValue,
  placeholder
){
  if (!selectEl) return;

  selectEl.innerHTML = "";

  const empty =
    document.createElement(
      "option"
    );

  empty.value = "";
  empty.textContent =
    placeholder;

  selectEl.appendChild(
    empty
  );

  (
    Array.isArray(items)
      ? items
      : []
  ).forEach(value => {
    const option =
      document.createElement(
        "option"
      );

    option.value =
      value;

    option.textContent =
      value;

    if (
      String(value) ===
      String(
        selectedValue ||
        ""
      )
    ) {
      option.selected =
        true;
    }

    selectEl.appendChild(
      option
    );
  });
}


function renderDiseaseDetailChecks(
  container,
  name,
  items,
  selectedValues
){
  if (!container) return;

  container.innerHTML = "";

  const selected =
    new Set(
      Array.isArray(
        selectedValues
      )
        ? selectedValues
            .map(x =>
              String(
                x || ""
              ).trim()
            )
        : []
    );

  (
    Array.isArray(items)
      ? items
      : []
  ).forEach(value => {
    const label =
      document.createElement(
        "label"
      );

    label.className =
      "mbk-action-tile";

    const input =
      document.createElement(
        "input"
      );

    input.type =
      "checkbox";

    input.name =
      name;

    input.value =
      value;

    input.checked =
      selected.has(value);

    const text =
      document.createElement(
        "span"
      );

    text.textContent =
      value;

    label.appendChild(
      input
    );

    label.appendChild(
      text
    );

    container.appendChild(
      label
    );
  });
}


function clearDiseaseDetailForm(){
  if (diseaseDetailCard) {
    diseaseDetailCard.hidden =
      true;

    diseaseDetailCard
      .style.display =
      "none";
  }

  if (diseaseDetailTitle) {
    diseaseDetailTitle
      .textContent =
      "";
  }

  if (parasiteTypeEl) {
    parasiteTypeEl
      .innerHTML =
      "";
  }

  if (
    parasiteDiagnosisMethodEl
  ) {
    parasiteDiagnosisMethodEl
      .innerHTML =
      "";
  }

  if (parasiteSeverityEl) {
    parasiteSeverityEl
      .innerHTML =
      "";
  }

  if (parasiteSignsList) {
    parasiteSignsList
      .innerHTML =
      "";
  }

  if (parasiteBodySitesList) {
    parasiteBodySitesList
      .innerHTML =
      "";
  }

  if (parasiteBodySitesWrap) {
    parasiteBodySitesWrap
      .hidden =
      true;

    parasiteBodySitesWrap
      .style.display =
      "none";
  }
}


function renderDiseaseDetailForm(
  item,
  saved = null
){
  clearDiseaseDetailForm();

  if (
    !item?.detailForm ||
    !item?.detailOptions
  ) {
    return;
  }

  const options =
    item.detailOptions ||
    {};

  const savedParasiteType =
    diseaseDetailSavedValue(
      saved,
      "parasiteType",
      ""
    );

  const savedDiagnosisMethod =
    diseaseDetailSavedValue(
      saved,
      "diagnosisMethod",
      ""
    );

  const savedSeverity =
    diseaseDetailSavedValue(
      saved,
      "severity",
      ""
    );

  const savedSigns =
    diseaseDetailSavedValue(
      saved,
      "signs",
      []
    );

  const savedBodySites =
    diseaseDetailSavedValue(
      saved,
      "bodySites",
      []
    );

  diseaseDetailTitle
    .textContent =
    `تفاصيل «${item.name || "التشخيص"}»`;

  fillDiseaseDetailSelect(
    parasiteTypeEl,
    options.parasiteTypes,
    savedParasiteType,
    "اختر نوع الطفيل"
  );

  fillDiseaseDetailSelect(
    parasiteDiagnosisMethodEl,
    options.diagnosisMethods,
    savedDiagnosisMethod,
    "اختر طريقة التشخيص"
  );

  fillDiseaseDetailSelect(
    parasiteSeverityEl,
    options.severities,
    savedSeverity,
    "اختر شدة الإصابة"
  );

  renderDiseaseDetailChecks(
    parasiteSignsList,
    "parasiteSigns",
    options.signs,

    Array.isArray(
      savedSigns
    )
      ? savedSigns
      : []
  );

  const bodySites =
    Array.isArray(
      options.bodySites
    )
      ? options.bodySites
      : [];

  renderDiseaseDetailChecks(
    parasiteBodySitesList,
    "parasiteBodySites",
    bodySites,

    Array.isArray(
      savedBodySites
    )
      ? savedBodySites
      : []
  );

  const showBodySites =
    bodySites.length > 0;

  parasiteBodySitesWrap.hidden =
    !showBodySites;

  parasiteBodySitesWrap
    .style.display =
    showBodySites
      ? ""
      : "none";

  diseaseDetailCard.hidden =
    false;

  diseaseDetailCard
    .style.display =
    "";
}


function collectDiseaseDetails(
  item
){
  if (!item?.detailForm) {
    return {
      ok: true,
      details: null
    };
  }

  const parasiteType =
    String(
      parasiteTypeEl
        ?.value ||
      ""
    ).trim();

  const diagnosisMethod =
    String(
      parasiteDiagnosisMethodEl
        ?.value ||
      ""
    ).trim();

  const severity =
    String(
      parasiteSeverityEl
        ?.value ||
      ""
    ).trim();

  const signs =
    Array.from(
      document
        .querySelectorAll(
          'input[name="parasiteSigns"]:checked'
        )
    )
      .map(x =>
        String(
          x.value || ""
        ).trim()
      )
      .filter(Boolean);

  const bodySites =
    Array.from(
      document
        .querySelectorAll(
          'input[name="parasiteBodySites"]:checked'
        )
    )
      .map(x =>
        String(
          x.value || ""
        ).trim()
      )
      .filter(Boolean);

  if (!parasiteType) {
    return {
      ok: false,
      message:
        "❌ اختر نوع الطفيل."
    };
  }

  if (!diagnosisMethod) {
    return {
      ok: false,
      message:
        "❌ اختر طريقة تشخيص الإصابة الطفيلية."
    };
  }

  if (!severity) {
    return {
      ok: false,
      message:
        "❌ اختر شدة الإصابة."
    };
  }

  if (
    item.detailForm ===
      "external_parasites" &&
    !bodySites.length
  ) {
    return {
      ok: false,
      message:
        "❌ اختر موضع إصابة واحدًا على الأقل للطفيليات الخارجية."
    };
  }

  return {
    ok: true,

    details: {
      formType:
        item.detailForm,

      parasiteType,
      diagnosisMethod,
      severity,
      signs,
      bodySites
    }
  };
}

function renderDiseases(
  list,
  selectedCode = ""
){
  dz.innerHTML = "";

  const source =
    Array.isArray(list)
      ? list.filter(
          item =>
            item &&
            item.code &&
            !item.specialPage
        )
      : [];

  if (!source.length) {
    return;
  }

  const groups =
    new Map();

  source.forEach(item => {
    const groupName =
      String(
        item.group || "عام"
      ).trim();

    if (!groups.has(groupName)) {
      groups.set(
        groupName,
        []
      );
    }

    groups
      .get(groupName)
      .push(item);
  });

  groups.forEach(
    (
      items,
      groupName
    ) => {
      const sec =
        document.createElement(
          "section"
        );

      sec.className =
        "mbk-action-section";

      const title =
        document.createElement(
          "h3"
        );

      title.className =
        "mbk-action-section-title";

      title.textContent =
        groupName;

      const wrap =
        document.createElement(
          "div"
        );

      wrap.className =
        "mbk-action-list mbk-event-grid";

      items.forEach(item => {
        const btn =
          document.createElement(
            "button"
          );

        btn.type =
          "button";

        btn.className =
          "mbk-action-tile mbk-event-card";

        btn.dataset.code =
          item.code || "";

               const label =
          document.createElement(
            "span"
          );

        label.className =
          "mbk-event-label";

        label.textContent =
          selectedCode &&
          item.code === selectedCode
            ? `✓ ${item.name || ""}`
            : (
                item.name ||
                ""
              );

        const labelEn =
          document.createElement(
            "small"
          );

        labelEn.className =
          "mbk-disease-en";

        labelEn.dir =
          "ltr";

        labelEn.textContent =
          item.nameEn || "";

        btn.appendChild(
          label
        );

        if (labelEn.textContent) {
          btn.appendChild(
            labelEn
          );
        }

        btn.setAttribute(
          "aria-label",
          [
            item.name || "",
            item.nameEn || ""
          ]
            .filter(Boolean)
            .join(" — ")
        );

        btn.addEventListener(
          "click",
          () =>
            prepareDiseaseConfirmation(
              item,
              btn
            )
        );

        wrap.appendChild(
          btn
        );
      });

      sec.appendChild(
        title
      );

      sec.appendChild(
        wrap
      );

      dz.appendChild(
        sec
      );
    }
  );
}
function clearDiseaseConfirmation(){
  pendingDiseaseItem = null;
  pendingDiseaseButton = null;
  clearDiseaseDetailForm();

  if (diseaseConfirmText) {
    diseaseConfirmText.textContent =
      "";
  }

  if (diseaseConfirmCard) {
    diseaseConfirmCard.hidden =
      true;

    diseaseConfirmCard.style.display =
      "none";
  }

  if (confirmDiseaseBtn) {
    confirmDiseaseBtn.disabled =
      false;

    confirmDiseaseBtn.textContent =
      isEditMode
        ? "تأكيد التعديل"
        : "تأكيد التسجيل";
  }
}


function prepareDiseaseConfirmation(
  item,
  btn
){
  const animalNumber =
    digitsOnly(
      animalNumberEl.value
    );

  const eventDate =
    eventDateEl.value ||
    todayLocal();

  if (
    !animalNumber ||
    !eventDate
  ) {
    setBar(
      gateBox,
      "أدخل رقم الحيوان وتاريخ التشخيص أولًا.",
      "error"
    );

    return;
  }

  if (!isEditMode) {
    const currentGateKey =
      animalNumber +
      "|" +
      eventDate;

    if (
      !gateAllowed ||
      gateKey !== currentGateKey
    ) {
      setBar(
        gateBox,
        gateMessage ||
        "يلزم نجاح التحقق من الحيوان قبل تسجيل التشخيص.",
        "error"
      );

      runGate();

      return;
    }
  }
const savedDetails =
  isEditMode &&
  item?.code ===
    currentDiseaseCode
    ? currentEditDiseaseData
    : null;

renderDiseaseDetailForm(
  item,
  savedDetails
);
  pendingDiseaseItem =
    item;

  pendingDiseaseButton =
    btn;

  if (diseaseConfirmText) {
    diseaseConfirmText.textContent =
      isEditMode
        ? `هل تؤكد تعديل التشخيص للحيوان رقم ${animalNumber} إلى «${item.name || ""}»؟`
        : `هل تؤكد تسجيل «${item.name || ""}» للحيوان رقم ${animalNumber} بتاريخ ${eventDate}؟`;
  }

  if (confirmDiseaseBtn) {
    confirmDiseaseBtn.textContent =
      isEditMode
        ? "تأكيد التعديل"
        : "تأكيد التسجيل";
  }

  if (diseaseConfirmCard) {
    diseaseConfirmCard.hidden =
      false;

    diseaseConfirmCard.style.display =
      "";
  }

  const focusCard =
  item?.detailForm
    ? diseaseDetailCard
    : diseaseConfirmCard;

focusCard
  ?.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


async function confirmPendingDisease(){
  if (
    !pendingDiseaseItem ||
    !pendingDiseaseButton
  ) {
    clearDiseaseConfirmation();
    return;
  }

  if (confirmDiseaseBtn) {
    confirmDiseaseBtn.disabled =
      true;

    confirmDiseaseBtn.textContent =
      isEditMode
        ? "جاري التعديل..."
        : "جاري التسجيل...";
  }

  try {
    if (isEditMode) {
      await saveCorrection(
        pendingDiseaseItem,
        pendingDiseaseButton
      );

    } else {
      await saveDiseaseItem(
        pendingDiseaseItem,
        pendingDiseaseButton
      );
    }

  } finally {
    if (confirmDiseaseBtn) {
      confirmDiseaseBtn.disabled =
        false;

      confirmDiseaseBtn.textContent =
        isEditMode
          ? "تأكيد التعديل"
          : "تأكيد التسجيل";
    }
  }
}
  async function saveDiseaseItem(
    item,
    btn
  ){
    if (isEditMode) {
      await saveCorrection(
        item,
        btn
      );

      return;
    }

    const animalNumber =
      digitsOnly(
        animalNumberEl.value
      );

    const eventDate =
      eventDateEl.value ||
      todayLocal();

    const notes =
      notesEl
        ? notesEl.value
        : "";

    if (
      !animalNumber ||
      !eventDate
    ) {
      setBar(
        gateBox,
        "أدخل رقم الحيوان وتاريخ التشخيص أولًا.",
        "error"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      return;
    }


    if (item.specialPage) {
      const qs =
        new URLSearchParams({

          date:

            eventDate
        });

      if (notes) {
        qs.set(
          "notes",
          notes
        );
      }

      location.href =
        `${item.specialPage}?${qs.toString()}`;

      return;

    const currentGateKey =
      animalNumber +
      "|" +

    if (

    ) {
      setBar(
        gateBox,
        gateMessage ||
        "يلزم نجاح التحقق من الحيوان قبل تسجيل التشخيص.",
        "error"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      runGate();

      return;
    }

const detailResult =
  collectDiseaseDetails(
    item
  );

if (!detailResult.ok) {
  setBar(
    gateBox,

    detailResult.message ||
    "❌ راجع تفاصيل التشخيص الصحي.",

    "error"
  );

  diseaseDetailCard
    ?.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  return;
}

const diseaseDetails =
  detailResult.details;
    btn.disabled = true;

    setBar(
      gateBox,
      "جاري حفظ التشخيص...",
      "info"
    );


    try {
      const j =
        await apiRequest(
          "/api/disease/save",
          {
            method:
              "POST",

            body: {
              animalNumber,
              eventDate,

              diseaseCode:
                item.code,

              notes,

...(diseaseDetails
  ? {
      details:
        diseaseDetails
    }
  : {})
            }
          }
        );

      setBar(
        gateBox,
        j.message ||
        "✅ تم حفظ التشخيص الصحي بنجاح.",
        "success"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      setTimeout(() => {
        location.href =
          j.redirectUrl ||
          `event-list.html?number=${encodeURIComponent(animalNumber)}`;
      }, 2500);

    } catch (e) {
      console.error(
        "disease save failed",
        e
      );

      setBar(
        gateBox,
        e.message ||
        "❌ تعذّر حفظ التشخيص الصحي.",
        "error"
      );

      btn.disabled =
        false;
    }
  }


  async function saveCorrection(
    item,
    btn
  ){
    const animalNumber =
      digitsOnly(
        animalNumberEl.value
      );

    const eventDate =
      eventDateEl.value;

    const notes =
      notesEl
        ? String(
            notesEl.value || ""
          ).trim()
        : "";

    const correctionPerformedBy =
      String(
        correctionPerformedByEl
          ?.value ||
        ""
      ).trim();

    const correctionReason =
      String(
        correctionReasonEl
          ?.value ||
        ""
      ).trim();


    if (
      !correctionPerformedBy
    ) {
      setBar(
        gateBox,
        "❌ أدخل اسم القائم بالتعديل.",
        "error"
      );

      return;
    }


    if (
      !correctionReason
    ) {
      setBar(
        gateBox,
        "❌ اكتب سبب التعديل.",
        "error"
      );

      return;
    }


    if (
      !item?.code ||
      item.specialPage
    ) {
      setBar(
        gateBox,
        "❌ اختر تشخيصًا صحيًا عامًا صالحًا للتعديل.",
        "error"
      );

      return;
    }
const detailResult =
  collectDiseaseDetails(
    item
  );

if (!detailResult.ok) {
  setBar(
    gateBox,

    detailResult.message ||
    "❌ راجع تفاصيل التشخيص الصحي.",

    "error"
  );

  diseaseDetailCard
    ?.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  return;
}

const diseaseDetails =
  detailResult.details;

    btn.disabled = true;

    setBar(
      gateBox,
      "جاري حفظ تعديل التشخيص الصحي...",
      "info"
    );


    try {
      const j =
        await apiRequest(
          `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
          {
            method:
              "POST",

            body: {
              animalNumber,
              eventDate,

              diseaseCode:
                item.code,

              notes,
              ...(diseaseDetails
  ? {
      details:
        diseaseDetails
    }
  : {}),

              correctionPerformedBy,
              correctionReason
            }
          }
        );

      setBar(
        gateBox,
        j.message ||
        "✅ تم تعديل التشخيص الصحي بنجاح.",
        "success"
      );

      setTimeout(() => {
        location.href =
          `event-list.html?number=${encodeURIComponent(animalNumber)}`;
      }, 900);

    } catch (e) {
      console.error(
        "disease correction failed",
        e
      );

      setBar(
        gateBox,
        e.message ||
        "❌ تعذّر تعديل التشخيص الصحي.",
        "error"
      );

      btn.disabled =
        false;
    }
  }


  async function runGate(){
    if (requestedEditMode) {
      return;
    }

    const animalNumber =
      digitsOnly(
        animalNumberEl.value
      );

    const eventDate =
      eventDateEl.value;

    gateAllowed = false;
    gateKey = "";

    gateMessage =
      "لم يتم التحقق من الحيوان بعد.";

    renderSummary(null);

clearDiseaseConfirmation();
renderDiseases([]);


    if (
      !animalNumber ||
      !eventDate
    ) {
      setBar(
        gateBox,
        "أدخل رقم الحيوان وتاريخ التشخيص لعرض التشخيصات المناسبة.",
        "info"
      );

      return;
    }


    setBar(
      gateBox,
      "جاري التحقق من السيرفر...",
      "info"
    );


    try {
      const j =
        await apiRequest(
          "/api/disease/gate",
          {
            method:
              "POST",

            body: {
              animalNumber,
              eventDate
            }
          }
        );


      if (!j.allowed) {
        gateAllowed =
          false;

        gateKey = "";

        gateMessage =
          j.message ||
          "لم يمر الحيوان من التحقق.";

        setBar(
          gateBox,
          gateMessage,
          "error"
        );

       renderSummary(null);

clearDiseaseConfirmation();
renderDiseases([]);

        return;
      }


      gateAllowed =
        true;

      gateKey =
        animalNumber +
        "|" +
        eventDate;

      gateMessage =
        j.message ||
        "✅ الحيوان صالح لتسجيل التشخيص.";

      setBar(
        gateBox,
        gateMessage,
        "success"
      );

         renderSummary(
        j.animal ||
        null
      );

      clearDiseaseConfirmation();

      renderDiseases(
        Array.isArray(j.diseases)
          ? j.diseases
          : []
      );

    } catch (e) {
      console.error(
        "disease gate failed",
        e
      );

      gateAllowed =
        false;

      gateKey = "";

      gateMessage =
        e.message ||
        "❌ تعذّر التحقق من السيرفر. لا يمكن حفظ التشخيص المباشر قبل نجاح التحقق.";

      setBar(
        gateBox,
        gateMessage,
        "error"
      );

     clearDiseaseConfirmation();
renderDiseases([]);

renderSummary(null);
    }
  }


  function scheduleGate(){
  if (requestedEditMode) {
    return;
  }

  clearDiseaseConfirmation();

  clearTimeout(
    gateTimer
  );

  gateTimer =
    setTimeout(
      runGate,
      350
    );
}


  function hydrateNormal(){
    animalNumberEl.value =
      digitsOnly(
        params.get("number") ||
        params.get("animalNumber") ||
        params.get("animalId") ||
        ""
      );

    const d =
      String(
        params.get("date") ||
        params.get("eventDate") ||
        ""
      ).slice(0,10);

    eventDateEl.value =
      /^\d{4}-\d{2}-\d{2}$/
        .test(d)
        ? d
        : todayLocal();
  }


  async function loadEditEvent(){
    setBar(
      gateBox,
      "جاري تحميل التشخيص الصحي للتعديل...",
      "info"
    );

    const data =
      await apiRequest(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`
      );


    if (
      data.ok !== true ||
      !data.event
    ) {
      throw new Error(
        data.message ||
        "تعذّر تحميل التشخيص الصحي للتعديل."
      );
    }


    const ev =
      data.event;
      currentEditDiseaseData =
  ev.data || {};


    if (
      ev.typeKey !== "health"
    ) {
      throw new Error(
        "الحدث المطلوب ليس تشخيصًا صحيًا عامًا."
      );
    }


    if (
      ev.editPolicy
        ?.editable !== true
    ) {
      throw new Error(
        ev.editPolicy
          ?.reason ||
        "هذا الحدث غير متاح للتعديل."
      );
    }


    animalNumberEl.value =
      ev.animalNumber ||
      "";

    animalNumberEl.readOnly =
      true;


    eventDateEl.value =
      ev.data?.eventDate ||
      ev.eventDate ||
      "";

    /*
      التاريخ ثابت ولا يعدّل.
      السيرفر لديه الحارس النهائي.
    */
    eventDateEl.disabled =
      true;


    notesEl.value =
      ev.data?.notes ||
      "";


    currentDiseaseCode =
      String(
        ev.data
          ?.diseaseCode ||
        ""
      ).trim();


    const gate =
      await apiRequest(
        "/api/disease/gate",
        {
          method:
            "POST",

          body: {
            animalNumber:
              animalNumberEl.value,

            eventDate:
              eventDateEl.value
          }
        }
      );


    if (
      gate.allowed === false
    ) {
      throw new Error(
        gate.message ||
        "تعذّر تجهيز التشخيص الصحي للتعديل."
      );
    }


    const editableDiseases =
      (
        Array.isArray(
          gate.diseases
        )
          ? gate.diseases
          : []
      )
        .filter(item =>
          item &&
          item.code &&
          !item.specialPage
        );


    if (
      !editableDiseases.length
    ) {
      throw new Error(
        "لا توجد تشخيصات صحية عامة متاحة للتعديل لهذا الحيوان."
      );
    }


    renderSummary(
      gate.animal ||
      null
    );


    renderDiseases(
      editableDiseases,
      currentDiseaseCode
    );


    renderPerformers(
      data.correctionPerformers ||
      []
    );


    editToolsCard.hidden =
      false;

    editToolsCard.style.display =
      "";


    correctionPerformedByEl.required =
      true;

    correctionReasonEl.required =
      true;


    if (pageTitle) {
      pageTitle.textContent =
        "تعديل التشخيص الصحي";
    }


    document.title =
      "تعديل التشخيص الصحي — مُرَبِّيك";


    if (backLink) {
      backLink.href =
        `event-list.html?number=${encodeURIComponent(ev.animalNumber || "")}`;
    }


    const currentName =
      ev.data?.diseaseName ||
      editableDiseases
        .find(
          item =>
            item.code ===
            currentDiseaseCode
        )
        ?.name ||
      "";


    setBar(
      gateBox,

      currentName
        ? `التشخيص الحالي: ${currentName}. عدّل الملاحظات إن لزم، ثم اختر التشخيص المصحح بعد إدخال القائم بالتعديل وسبب التعديل.`
        : "عدّل الملاحظات إن لزم، ثم اختر التشخيص المصحح بعد إدخال القائم بالتعديل وسبب التعديل.",

      "success"
    );
  }


  async function init(){
    try {
      if (
        requestedEditMode
      ) {
        if (!editEventId) {
          throw new Error(
            "رابط تعديل التشخيص الصحي غير مكتمل."
          );
        }

        await loadEditEvent();

     } else {
  hydrateNormal();

  renderDiseases([]);

  await runGate();
}

    } catch (e) {
      console.error(
        "disease page init failed",
        e
      );

      setBar(
        gateBox,
        e.message ||
        "❌ تعذّر تجهيز صفحة التشخيص الصحي.",
        "error"
      );

      dz.innerHTML =
        "";
    }
  }


  animalNumberEl
    .addEventListener(
      "input",
      scheduleGate
    );


  eventDateEl
    .addEventListener(
      "change",
      scheduleGate
    );

confirmDiseaseBtn
  ?.addEventListener(
    "click",
    confirmPendingDisease
  );

cancelDiseaseBtn
  ?.addEventListener(
    "click",
    clearDiseaseConfirmation
  );
  init();

})();
</script>
