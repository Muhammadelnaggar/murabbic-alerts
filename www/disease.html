<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="css/forms.css">
  
 <title>التشخيص الصحي — مُرَبِّيك</title>
 
</head>
<body data-page="disease">
<header class="mbk-top">
  <div class="mbk-head">
    <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">

    <div class="mbk-title">
      <div class="mbk-page" id="pageTitle">التشخيص الصحي</div>
      <div class="mbk-app">مُرَبِّيك</div>
    </div>

    <a class="mbk-back" id="backLink" href="add-event.html" aria-label="رجوع">رجوع</a>
  </div>
</header>

  <main>
    
  <div id="gateBox" class="infobar info show">
    جاري تجهيز التشخيصات المناسبة...
  </div>
    <div class="card grid">
      <div class="row">
        <div>
          <label>رقم الحيوان</label>
          <input id="animalNumber" inputmode="numeric" placeholder="مثال: 1023" required />
        </div>
        <div>
          <label>تاريخ التشخيص</label>
          <input id="eventDate" type="date" required />
        </div>
               <div>
          <label>ملاحظات</label>
          <input id="notes" placeholder="اختياري" />
        </div>
      </div>
    </div>
  <div
  class="card grid"
  id="editDiseaseCard"
  hidden
  style="display:none"
>
  <div>
    <label for="editDiseaseSelect">التشخيص</label>
    <select id="editDiseaseSelect"></select>
  </div>
</div>

<div
  class="card grid"
  id="diseaseDetailCard"
  hidden
  style="display:none"
>
  <div
    id="diseaseDetailTitle"
    class="form-hint"
  ></div>

  <div
    id="diseaseDetailFields"
    class="grid"
  ></div>
</div>

<div
  class="card grid"
  id="editToolsCard"
  hidden
  style="display:none"
>
  <div class="row">
    <div>
      <label for="correctionPerformedBy">
        القائم بالتعديل
      </label>

      <input
        id="correctionPerformedBy"
        type="text"
        list="operationalPerformersList"
        maxlength="160"
        autocomplete="off"
        placeholder="اسم القائم بالتعديل"
      />
    </div>

    <div>
      <label for="correctionReason">
        سبب التعديل
      </label>

      <input
        id="correctionReason"
        type="text"
        maxlength="500"
        autocomplete="off"
        placeholder="اكتب سبب تصحيح التشخيص الصحي"
      />
    </div>
  </div>

  <datalist
    id="operationalPerformersList"
  ></datalist>
</div>

<div
  class="card grid"
  id="diseaseConfirmCard"
  hidden
  style="display:none"
>
  <div
    id="diseaseConfirmText"
    class="form-hint"
  ></div>

  <div class="mbk-action-list mbk-event-grid">
    <button
      type="button"
      class="mbk-action-tile"
      id="confirmDiseaseBtn"
    >
      تأكيد التسجيل
    </button>

    <button
      type="button"
      class="mbk-action-tile"
      id="cancelDiseaseBtn"
    >
      إلغاء
    </button>
  </div>
</div>

<div id="animalSummary" class="form-hint"></div>

<div
  id="dz"
  class="mbk-action-hub mbk-event-hub"
></div>
  </main>

<script>
(function(){
  const API_BASE = location.origin;
  const $ = (id) => document.getElementById(id);

  const animalNumberEl = $("animalNumber");
  const eventDateEl = $("eventDate");
  const gateBox = $("gateBox");
  const dz = $("dz");
  const animalSummary = $("animalSummary");
  const notesEl = $("notes");

  const editToolsCard =
    $("editToolsCard");

  const correctionPerformedByEl =
    $("correctionPerformedBy");

  const correctionReasonEl =
    $("correctionReason");

  const operationalPerformersList =
    $("operationalPerformersList");

  const pageTitle =
    $("pageTitle");

  const backLink =
    $("backLink");
    const diseaseConfirmCard =
  $("diseaseConfirmCard");

const diseaseConfirmText =
  $("diseaseConfirmText");

const confirmDiseaseBtn =
  $("confirmDiseaseBtn");

const cancelDiseaseBtn =
  $("cancelDiseaseBtn");

const editDiseaseCard =
  $("editDiseaseCard");

const editDiseaseSelect =
  $("editDiseaseSelect");

const diseaseDetailCard =
  $("diseaseDetailCard");

const diseaseDetailTitle =
  $("diseaseDetailTitle");

const diseaseDetailFields =
  $("diseaseDetailFields");

let pendingDiseaseItem = null;
let pendingDiseaseButton = null;

let currentEditDiseaseData = null;
let editableDiseaseItems = [];


  const params =
    new URLSearchParams(
      location.search
    );

  const requestedEditMode =
    String(
      params.get("mode") || ""
    )
      .trim()
      .toLowerCase() === "edit";

  const editEventId =
    String(
      params.get("eventId") || ""
    ).trim();

  const isEditMode =
    requestedEditMode &&
    !!editEventId;


  let gateTimer = null;
  let gateAllowed = false;
  let gateKey = "";
  let gateMessage =
    "لم يتم التحقق من الحيوان بعد.";

  let currentDiseaseCode = "";


  function todayLocal(){
    const d = new Date();

    d.setMinutes(
      d.getMinutes() -
      d.getTimezoneOffset()
    );

    return d
      .toISOString()
      .slice(0,10);
  }


  function digitsOnly(v){
    const map = {
      "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
      "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
      "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
      "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
    };

    return String(v || "")
      .replace(
        /[٠-٩۰-۹]/g,
        d => map[d] || d
      )
      .replace(/[^\d]/g, "")
      .trim();
  }


  function setBar(
    el,
    text,
    type
  ){
    if (!el) return;

    el.textContent =
      text || "";

    el.className =
      "infobar show " +
      (type || "info");
  }


  function handleAuthRequired(
    j,
    status
  ){
    if (
      status === 401 ||
      (
        j &&
        (
          j.error ===
            "auth_required" ||
          j.message ===
            "سجّل الدخول أولًا."
        )
      )
    ) {
      location.href =
        "login.html?next=" +
        encodeURIComponent(
          location.pathname +
          location.search
        );

      return true;
    }

    return false;
  }


  async function apiRequest(
    url,
    {
      method = "GET",
      body
    } = {}
  ){
    const options = {
      method,
      credentials:
        "same-origin",
      cache:
        "no-store",
      headers: {
        "Accept":
          "application/json"
      }
    };

    if (body !== undefined) {
      options.headers[
        "Content-Type"
      ] =
        "application/json";

      options.body =
        JSON.stringify(
          body || {}
        );
    }

    const r =
      await fetch(
        API_BASE + url,
        options
      );

    const j =
      await r
        .json()
        .catch(() => ({}));

    if (
      handleAuthRequired(
        j,
        r.status
      )
    ) {
      throw new Error(
        j.message ||
        "❌ سجّل الدخول أولًا."
      );
    }

    if (
      !r.ok ||
      j.ok === false
    ) {
      const err =
        new Error(
          j.message ||
          "تعذّر تنفيذ الطلب."
        );

      err.status =
        r.status;

      err.response =
        j;

      throw err;
    }

    return j;
  }


  function renderSummary(
    animal
  ){
    if (!animalSummary) return;

    if (!animal) {
      animalSummary.textContent =
        "";

      return;
    }

    const parts = [];

    if (
      animal.productionStatus
    ) {
      parts.push(
        "إنتاجيًا: " +
        animal.productionStatus
      );
    }

    if (
      animal.reproductiveStatus
    ) {
      parts.push(
        "تناسليًا: " +
        animal.reproductiveStatus
      );
    }

    if (
      animal.followerStatus
    ) {
      parts.push(
        "حالة التابع: " +
        animal.followerStatus
      );
    }

    animalSummary.textContent =
      parts.join(" — ");
  }


  function renderPerformers(
    items = []
  ){
    operationalPerformersList
      .replaceChildren();

    [
      ...new Set(
        (
          Array.isArray(items)
            ? items
            : []
        )
          .map(x =>
            String(x || "")
              .trim()
          )
          .filter(Boolean)
      )
    ].forEach(name => {
      const option =
        document.createElement(
          "option"
        );

      option.value =
        name;

      operationalPerformersList
        .appendChild(option);
    });
  }

function diseaseDetailSavedValue(
  saved,
  key,
  fallback = ""
){
  if (
    !saved ||
    typeof saved !== "object"
  ) {
    return fallback;
  }

  if (
    saved[key] !== undefined &&
    saved[key] !== null &&
    saved[key] !== ""
  ) {
    return saved[key];
  }

  const nested =
    saved.details &&
    typeof saved.details === "object"
      ? saved.details[key]
      : undefined;

  return (
    nested !== undefined &&
    nested !== null &&
    nested !== ""
  )
    ? nested
    : fallback;
}


function clearDiseaseDetailForm(){
  diseaseDetailFields
    ?.replaceChildren();

  if (diseaseDetailTitle) {
    diseaseDetailTitle.textContent =
      "";
  }

  if (diseaseDetailCard) {
    diseaseDetailCard.hidden =
      true;

    diseaseDetailCard.style.display =
      "none";
  }
}


function renderDiseaseDetailForm(
  item,
  saved = null
){
  clearDiseaseDetailForm();

  const fields =
    Array.isArray(
      item?.detailOptions?.fields
    )
      ? item.detailOptions.fields
      : [];

  if (!fields.length) {
    return;
  }

  diseaseDetailTitle.textContent =
    `تفاصيل «${item.name || "التشخيص"}»`;

  fields.forEach(field => {
    const key =
      String(
        field?.key || ""
      ).trim();

    if (!key) return;

    const control =
      String(
        field?.control || "text"
      ).trim();

    const options =
      Array.isArray(field?.options)
        ? field.options
        : [];

    const wrap =
      document.createElement("div");

    const label =
      document.createElement("label");

    label.textContent =
      String(
        field?.label || key
      ) +
      (
        field?.required
          ? " *"
          : ""
      );

    wrap.appendChild(label);

    const savedValue =
      diseaseDetailSavedValue(
        saved,
        key,
        control === "multi_select"
          ? []
          : ""
      );

    if (
      control === "multi_select"
    ) {
      const list =
        document.createElement("div");

      list.className =
        "mbk-action-list mbk-event-grid";

      const selected =
        new Set(
          Array.isArray(savedValue)
            ? savedValue.map(
                v =>
                  String(v || "")
              )
            : []
        );

      options.forEach(value => {
        const optionLabel =
          document.createElement(
            "label"
          );

        optionLabel.className =
          "mbk-action-tile";

        const input =
          document.createElement(
            "input"
          );

        input.type =
          "checkbox";

        input.value =
          value;

        input.dataset.detailKey =
          key;

        input.checked =
          selected.has(
            String(value)
          );

        const text =
          document.createElement(
            "span"
          );

        text.textContent =
          value;

        optionLabel.appendChild(
          input
        );

        optionLabel.appendChild(
          text
        );

        list.appendChild(
          optionLabel
        );
      });

      wrap.appendChild(list);

    } else if (
      control === "select"
    ) {
      const select =
        document.createElement(
          "select"
        );

      select.dataset.detailKey =
        key;

      const empty =
        document.createElement(
          "option"
        );

      empty.value = "";

      empty.textContent =
        String(
          field?.placeholder ||
          "اختر"
        );

      select.appendChild(empty);

      options.forEach(value => {
        const option =
          document.createElement(
            "option"
          );

        option.value =
          value;

        option.textContent =
          value;

        option.selected =
          String(value) ===
          String(
            savedValue || ""
          );

        select.appendChild(option);
      });

      wrap.appendChild(select);

    } else {
      const input =
        document.createElement(
          "input"
        );

      input.type =
        control === "number"
          ? "number"
          : "text";

      input.dataset.detailKey =
        key;

      input.value =
        String(
          savedValue ?? ""
        );

      if (field?.placeholder) {
        input.placeholder =
          String(
            field.placeholder
          );
      }

      wrap.appendChild(input);
    }

    diseaseDetailFields
      ?.appendChild(wrap);
  });

  diseaseDetailCard.hidden =
    false;

  diseaseDetailCard.style.display =
    "";
}


function collectDiseaseDetails(
  item
){
  const fields =
    Array.isArray(
      item?.detailOptions?.fields
    )
      ? item.detailOptions.fields
      : [];

  if (!fields.length) {
    return null;
  }

  const details = {};

  const controls =
    Array.from(
      diseaseDetailFields
        ?.querySelectorAll(
          "[data-detail-key]"
        ) || []
    );

  fields.forEach(field => {
    const key =
      String(
        field?.key || ""
      ).trim();

    if (!key) return;

    const matches =
      controls.filter(
        el =>
          el.dataset.detailKey ===
          key
      );

    if (
      String(
        field?.control || ""
      ) === "multi_select"
    ) {
      details[key] =
        matches
          .filter(
            el => el.checked
          )
          .map(
            el =>
              String(
                el.value || ""
              ).trim()
          )
          .filter(Boolean);

      return;
    }

    details[key] =
      String(
        matches[0]?.value || ""
      ).trim();
  });

  return details;
}


function setDiseaseCatalogVisible(
  show
){
  if (!dz) return;

  dz.hidden =
    !show;

  dz.style.display =
    show
      ? ""
      : "none";
}


function renderEditDiseaseSelect(
  list,
  selectedCode = ""
){
  editDiseaseSelect
    .replaceChildren();

  const groups =
    new Map();

  (
    Array.isArray(list)
      ? list
      : []
  )
    .filter(
      item =>
        item &&
        item.code
    )
    .forEach(item => {
      const groupName =
        String(
          item.group || "عام"
        ).trim();

      if (
        !groups.has(
          groupName
        )
      ) {
        groups.set(
          groupName,
          []
        );
      }

      groups
        .get(groupName)
        .push(item);
    });

  groups.forEach(
    (
      items,
      groupName
    ) => {
      const optgroup =
        document.createElement(
          "optgroup"
        );

      optgroup.label =
        groupName;

      items.forEach(item => {
        const option =
          document.createElement(
            "option"
          );

        option.value =
          item.code;

        option.textContent =
          item.name ||
          item.code;

        optgroup.appendChild(
          option
        );
      });

      editDiseaseSelect
        .appendChild(
          optgroup
        );
    }
  );

  editDiseaseSelect.value =
    String(
      selectedCode || ""
    ).trim();
}


function selectDiseaseForEdit(
  diseaseCode
){
  const code =
    String(
      diseaseCode || ""
    ).trim();

  const item =
    editableDiseaseItems.find(
      x =>
        String(
          x?.code || ""
        ).trim() ===
        code
    );

  if (!item) {
    return false;
  }

  const saved =
    item.code ===
      currentDiseaseCode
      ? currentEditDiseaseData
      : null;

  renderDiseaseDetailForm(
    item,
    saved
  );

  pendingDiseaseItem =
    item;

  pendingDiseaseButton =
    confirmDiseaseBtn;

  diseaseConfirmText.textContent =
    "راجع البيانات ثم اضغط حفظ التعديل.";

  confirmDiseaseBtn.textContent =
    "حفظ التعديل";

  diseaseConfirmCard.hidden =
    false;

  diseaseConfirmCard.style.display =
    "";

  return true;
}
function renderDiseases(
  list,
  selectedCode = ""
){
  dz.innerHTML = "";

  const source =
    Array.isArray(list)
      ? list.filter(
          item =>
            item &&
            item.code 
           
        )
      : [];

  if (!source.length) {
    return;
  }

  const groups =
    new Map();

  source.forEach(item => {
    const groupName =
      String(
        item.group || "عام"
      ).trim();

    if (!groups.has(groupName)) {
      groups.set(
        groupName,
        []
      );
    }

    groups
      .get(groupName)
      .push(item);
  });

  groups.forEach(
    (
      items,
      groupName
    ) => {
      const sec =
        document.createElement(
          "section"
        );

      sec.className =
        "mbk-action-section";

      const title =
        document.createElement(
          "h3"
        );

      title.className =
        "mbk-action-section-title";

      title.textContent =
        groupName;

      const wrap =
        document.createElement(
          "div"
        );

      wrap.className =
        "mbk-action-list mbk-event-grid";

      items.forEach(item => {
        const btn =
          document.createElement(
            "button"
          );

        btn.type =
          "button";

        btn.className =
          "mbk-action-tile mbk-event-card";

        btn.dataset.code =
          item.code || "";

               const label =
          document.createElement(
            "span"
          );

        label.className =
          "mbk-event-label";

        label.textContent =
          selectedCode &&
          item.code === selectedCode
            ? `✓ ${item.name || ""}`
            : (
                item.name ||
                ""
              );

        const labelEn =
          document.createElement(
            "small"
          );

        labelEn.className =
          "mbk-disease-en";

        labelEn.dir =
          "ltr";

        labelEn.textContent =
          item.nameEn || "";

        btn.appendChild(
          label
        );

        if (labelEn.textContent) {
          btn.appendChild(
            labelEn
          );
        }

        btn.setAttribute(
          "aria-label",
          [
            item.name || "",
            item.nameEn || ""
          ]
            .filter(Boolean)
            .join(" — ")
        );

        btn.addEventListener(
          "click",
          () =>
            prepareDiseaseConfirmation(
              item,
              btn
            )
        );

        wrap.appendChild(
          btn
        );
      });

      sec.appendChild(
        title
      );

      sec.appendChild(
        wrap
      );

      dz.appendChild(
        sec
      );
    }
  );
}
function clearDiseaseConfirmation(){
  pendingDiseaseItem = null;
  pendingDiseaseButton = null;
  clearDiseaseDetailForm();

  if (diseaseConfirmText) {
    diseaseConfirmText.textContent =
      "";
  }

  if (diseaseConfirmCard) {
    diseaseConfirmCard.hidden =
      true;

    diseaseConfirmCard.style.display =
      "none";
  }

  if (confirmDiseaseBtn) {
    confirmDiseaseBtn.disabled =
      false;

    confirmDiseaseBtn.textContent =
      isEditMode
        ? "حفظ التعديل"
        : "تأكيد التسجيل";
  }
}


function prepareDiseaseConfirmation(
  item,
  btn
){
  const animalNumber =
    digitsOnly(
      animalNumberEl.value
    );

  const eventDate =
    eventDateEl.value ||
    todayLocal();

  if (
    !animalNumber ||
    !eventDate
  ) {
    setBar(
      gateBox,
      "أدخل رقم الحيوان وتاريخ التشخيص أولًا.",
      "error"
    );

    return;
  }

  if (!isEditMode) {
    const currentGateKey =
      animalNumber +
      "|" +
      eventDate;

    if (
      !gateAllowed ||
      gateKey !== currentGateKey
    ) {
      setBar(
        gateBox,
        gateMessage ||
        "يلزم نجاح التحقق من الحيوان قبل تسجيل التشخيص.",
        "error"
      );

      runGate();

      return;
    }
  }
const savedDetails =
  isEditMode &&
  item?.code ===
    currentDiseaseCode
    ? currentEditDiseaseData
    : null;

renderDiseaseDetailForm(
  item,
  savedDetails
);

pendingDiseaseItem =
  item;

pendingDiseaseButton =
  btn;

  if (diseaseConfirmText) {
    diseaseConfirmText.textContent =
      isEditMode
        ? `هل تؤكد تعديل التشخيص للحيوان رقم ${animalNumber} إلى «${item.name || ""}»؟`
        : `هل تؤكد تسجيل «${item.name || ""}» للحيوان رقم ${animalNumber} بتاريخ ${eventDate}؟`;
  }

  if (confirmDiseaseBtn) {
    confirmDiseaseBtn.textContent =
      isEditMode
        ? "تأكيد التعديل"
        : "تأكيد التسجيل";
  }

  if (diseaseConfirmCard) {
    diseaseConfirmCard.hidden =
      false;

    diseaseConfirmCard.style.display =
      "";
  }

  const focusCard =
  diseaseDetailCard &&
  diseaseDetailCard.hidden === false
    ? diseaseDetailCard
    : diseaseConfirmCard;
focusCard
  ?.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


async function confirmPendingDisease(){
  if (
    !pendingDiseaseItem ||
    !pendingDiseaseButton
  ) {
    clearDiseaseConfirmation();
    return;
  }

  if (confirmDiseaseBtn) {
    confirmDiseaseBtn.disabled =
      true;

    confirmDiseaseBtn.textContent =
      isEditMode
        ? "جاري التعديل..."
        : "جاري التسجيل...";
  }

  try {
    if (isEditMode) {
      await saveCorrection(
        pendingDiseaseItem,
        pendingDiseaseButton
      );

    } else {
      await saveDiseaseItem(
        pendingDiseaseItem,
        pendingDiseaseButton
      );
    }

  } finally {
    if (confirmDiseaseBtn) {
      confirmDiseaseBtn.disabled =
        false;

      confirmDiseaseBtn.textContent =
        isEditMode
          ? "حفظ التعديل"
          : "تأكيد التسجيل";
    }
  }
}
async function saveDiseaseItem(
  item,
  btn
){
  if (isEditMode) {
    await saveCorrection(
      item,
      btn
    );

    return;
  }

  const animalNumber =
    digitsOnly(
      animalNumberEl.value
    );

  const eventDate =
    eventDateEl.value ||
    todayLocal();

  const notes =
    notesEl
      ? notesEl.value
      : "";

  if (
    !animalNumber ||
    !eventDate
  ) {
    setBar(
      gateBox,
      "أدخل رقم الحيوان وتاريخ التشخيص أولًا.",
      "error"
    );

    return;
  }

  const currentGateKey =
    animalNumber +
    "|" +
    eventDate;

  if (
    !gateAllowed ||
    gateKey !==
      currentGateKey
  ) {
    setBar(
      gateBox,
      gateMessage ||
      "يلزم نجاح التحقق من الحيوان قبل تسجيل التشخيص.",
      "error"
    );

    runGate();
    return;
  }

  const diseaseDetails =
    collectDiseaseDetails(
      item
    );

  btn.disabled =
    true;

  setBar(
    gateBox,
    "جاري حفظ التشخيص...",
    "info"
  );

  try {
    const j =
      await apiRequest(
        "/api/disease/save",
        {
          method:
            "POST",

          body: {
            animalNumber,
            eventDate,

            diseaseCode:
              item.code,

            notes,

            ...(diseaseDetails
              ? {
                  details:
                    diseaseDetails
                }
              : {})
          }
        }
      );

    setBar(
      gateBox,
      j.message ||
      "✅ تم حفظ التشخيص الصحي بنجاح.",
      "success"
    );

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    setTimeout(() => {
      location.href =
        j.redirectUrl ||
        `event-list.html?number=${encodeURIComponent(
          animalNumber
        )}`;
    }, 2500);

  } catch (e) {
    console.error(
      "disease save failed",
      e
    );

    setBar(
      gateBox,
      e.message ||
      "❌ تعذّر حفظ التشخيص الصحي.",
      "error"
    );

    btn.disabled =
      false;
  }
}

async function saveCorrection(
  item,
  btn
){
  const animalNumber =
    digitsOnly(
      animalNumberEl.value
    );

  const eventDate =
    eventDateEl.value;

  const notes =
    String(
      notesEl?.value || ""
    ).trim();

  const correctionPerformedBy =
    String(
      correctionPerformedByEl
        ?.value || ""
    ).trim();

  const correctionReason =
    String(
      correctionReasonEl
        ?.value || ""
    ).trim();

  const diseaseDetails =
    collectDiseaseDetails(
      item
    );

  btn.disabled =
    true;

  setBar(
    gateBox,
    "جاري حفظ تعديل التشخيص الصحي...",
    "info"
  );

  try {
    const j =
      await apiRequest(
        `/api/events-page/event/${encodeURIComponent(
          editEventId
        )}/correct`,
        {
          method:
            "POST",

          body: {
            animalNumber,
            eventDate,

            diseaseCode:
              item.code,

            notes,

            ...(diseaseDetails
              ? {
                  details:
                    diseaseDetails
                }
              : {}),

            correctionPerformedBy,
            correctionReason
          }
        }
      );

    setBar(
      gateBox,
      j.message ||
      "✅ تم تعديل التشخيص الصحي بنجاح.",
      "success"
    );

    setTimeout(() => {
      location.href =
        `event-list.html?number=${encodeURIComponent(
          animalNumber
        )}`;
    }, 900);

  } catch (e) {
    console.error(
      "disease correction failed",
      e
    );

    setBar(
      gateBox,
      e.message ||
      "❌ تعذّر تعديل التشخيص الصحي.",
      "error"
    );

    btn.disabled =
      false;
  }
}

  async function runGate(){
    if (requestedEditMode) {
      return;
    }

    const animalNumber =
      digitsOnly(
        animalNumberEl.value
      );

    const eventDate =
      eventDateEl.value;

    gateAllowed = false;
    gateKey = "";

    gateMessage =
      "لم يتم التحقق من الحيوان بعد.";

    renderSummary(null);

clearDiseaseConfirmation();
renderDiseases([]);


    if (
      !animalNumber ||
      !eventDate
    ) {
      setBar(
        gateBox,
        "أدخل رقم الحيوان وتاريخ التشخيص لعرض التشخيصات المناسبة.",
        "info"
      );

      return;
    }


    setBar(
      gateBox,
      "جاري التحقق من السيرفر...",
      "info"
    );


    try {
      const j =
        await apiRequest(
          "/api/disease/gate",
          {
            method:
              "POST",

            body: {
              animalNumber,
              eventDate
            }
          }
        );


      if (!j.allowed) {
        gateAllowed =
          false;

        gateKey = "";

        gateMessage =
          j.message ||
          "لم يمر الحيوان من التحقق.";

        setBar(
          gateBox,
          gateMessage,
          "error"
        );

       renderSummary(null);

clearDiseaseConfirmation();
renderDiseases([]);

        return;
      }


      gateAllowed =
        true;

      gateKey =
        animalNumber +
        "|" +
        eventDate;

      gateMessage =
        j.message ||
        "✅ الحيوان صالح لتسجيل التشخيص.";

      setBar(
        gateBox,
        gateMessage,
        "success"
      );

         renderSummary(
        j.animal ||
        null
      );

      clearDiseaseConfirmation();

      renderDiseases(
        Array.isArray(j.diseases)
          ? j.diseases
          : []
      );

    } catch (e) {
      console.error(
        "disease gate failed",
        e
      );

      gateAllowed =
        false;

      gateKey = "";

      gateMessage =
        e.message ||
        "❌ تعذّر التحقق من السيرفر. لا يمكن حفظ التشخيص المباشر قبل نجاح التحقق.";

      setBar(
        gateBox,
        gateMessage,
        "error"
      );

     clearDiseaseConfirmation();
renderDiseases([]);

renderSummary(null);
    }
  }


  function scheduleGate(){
  if (requestedEditMode) {
    return;
  }

  clearDiseaseConfirmation();

  clearTimeout(
    gateTimer
  );

  gateTimer =
    setTimeout(
      runGate,
      350
    );
}


  function hydrateNormal(){
    animalNumberEl.value =
      digitsOnly(
        params.get("number") ||
        params.get("animalNumber") ||
        params.get("animalId") ||
        ""
      );

    const d =
      String(
        params.get("date") ||
        params.get("eventDate") ||
        ""
      ).slice(0,10);

    eventDateEl.value =
      /^\d{4}-\d{2}-\d{2}$/
        .test(d)
        ? d
        : todayLocal();
  }


async function loadEditEvent(){
  setBar(
    gateBox,
    "جاري تحميل التشخيص الصحي للتعديل...",
    "info"
  );

  const data =
    await apiRequest(
      `/api/events-page/event/${encodeURIComponent(
        editEventId
      )}`
    );

  if (
    data.ok !== true ||
    !data.event
  ) {
    throw new Error(
      data.message ||
      "تعذّر تحميل التشخيص الصحي للتعديل."
    );
  }

  const ev =
    data.event;

  currentEditDiseaseData =
    ev.data || {};

  if (
    ev.typeKey !== "health"
  ) {
    throw new Error(
      "الحدث المطلوب ليس تشخيصًا صحيًا عامًا."
    );
  }

  if (
    ev.editPolicy?.editable !==
    true
  ) {
    throw new Error(
      ev.editPolicy?.reason ||
      "هذا الحدث غير متاح للتعديل."
    );
  }

  animalNumberEl.value =
    ev.animalNumber || "";

  animalNumberEl.readOnly =
    true;

  eventDateEl.value =
    ev.data?.eventDate ||
    ev.eventDate ||
    "";

  eventDateEl.disabled =
    true;

  notesEl.value =
    ev.data?.notes || "";

  currentDiseaseCode =
    String(
      ev.data?.diseaseCode ||
      ""
    ).trim();

  const gate =
    await apiRequest(
      "/api/disease/gate",
      {
        method:
          "POST",

        body: {
          animalNumber:
            animalNumberEl.value,

          eventDate:
            eventDateEl.value
        }
      }
    );

  if (
    gate.allowed === false
  ) {
    throw new Error(
      gate.message ||
      "تعذّر تجهيز التشخيص الصحي للتعديل."
    );
  }

  editableDiseaseItems =
    (
      Array.isArray(
        gate.diseases
      )
        ? gate.diseases
        : []
    )
      .filter(
        item =>
          item &&
          item.code
      );

  if (
    !editableDiseaseItems.length
  ) {
    throw new Error(
      "لا توجد تشخيصات صحية متاحة للتعديل لهذا الحيوان."
    );
  }

  renderSummary(
    gate.animal || null
  );

  /*
    Edit Mode:
    لا نعرض كتالوج البطاقات.
  */
  setDiseaseCatalogVisible(
    false
  );

  renderEditDiseaseSelect(
    editableDiseaseItems,
    currentDiseaseCode
  );

  editDiseaseCard.hidden =
    false;

  editDiseaseCard.style.display =
    "";

  renderPerformers(
    data.correctionPerformers ||
    []
  );

  editToolsCard.hidden =
    false;

  editToolsCard.style.display =
    "";

  if (pageTitle) {
    pageTitle.textContent =
      "تعديل التشخيص الصحي";
  }

  document.title =
    "تعديل التشخيص الصحي — مُرَبِّيك";

  if (backLink) {
    backLink.href =
      `event-list.html?number=${encodeURIComponent(
        ev.animalNumber || ""
      )}`;
  }

  cancelDiseaseBtn.textContent =
    "رجوع بدون حفظ";

  if (
    !selectDiseaseForEdit(
      currentDiseaseCode
    )
  ) {
    throw new Error(
      "تعذّر تحميل التشخيص الحالي للتعديل."
    );
  }

  setBar(
    gateBox,
    "عدّل البيانات المطلوبة ثم اضغط حفظ التعديل.",
    "success"
  );
}

  async function init(){
    try {
      if (
        requestedEditMode
      ) {
        if (!editEventId) {
          throw new Error(
            "رابط تعديل التشخيص الصحي غير مكتمل."
          );
        }

        await loadEditEvent();

     } else {
  hydrateNormal();

  renderDiseases([]);

  await runGate();
}

    } catch (e) {
      console.error(
        "disease page init failed",
        e
      );

      setBar(
        gateBox,
        e.message ||
        "❌ تعذّر تجهيز صفحة التشخيص الصحي.",
        "error"
      );

      dz.innerHTML =
        "";
    }
  }


  animalNumberEl
    .addEventListener(
      "input",
      scheduleGate
    );


  eventDateEl
    .addEventListener(
      "change",
      scheduleGate
    );

confirmDiseaseBtn
  ?.addEventListener(
    "click",
    confirmPendingDisease
  );
editDiseaseSelect
  ?.addEventListener(
    "change",
    () => {
      selectDiseaseForEdit(
        editDiseaseSelect.value
      );
    }
  );
cancelDiseaseBtn
  ?.addEventListener(
    "click",
    () => {
      if (isEditMode) {
        location.href =
          `event-list.html?number=${encodeURIComponent(
            animalNumberEl.value ||
            ""
          )}`;

        return;
      }

      clearDiseaseConfirmation();
    }
  );
  init();

})();
</script>
