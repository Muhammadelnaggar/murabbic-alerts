<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="uterine-check">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link
    rel="stylesheet"
    href="css/forms.css"
  />

  <title>تسجيل فحص الرحم</title>
</head>

<body>
  <header>
    <div class="mbk-head">
      <img
        class="mbk-logo"
        src="/images/logo.png"
        alt="مُرَبِّيك"
      >

      <div class="mbk-center">
        <div class="mbk-page-title" id="pageTitle">
  تسجيل فحص الرحم
</div>

        <div class="mbk-app-name">
          مُرَبِّيك
        </div>
      </div>

      <a
  class="mbk-back"
  id="backLink"
  href="add-event.html"
>
        رجوع
      </a>
    </div>
  </header>

  <div
    id="msg"
    class="infobar"
    role="status"
    aria-live="polite"
  ></div>

  <main>
    <section class="card">
      <form
        id="uterineCheckForm"
        class="grid"
      >
        <div class="row">
          <div>
            <label for="animalNumber">
              رقم الحيوان
            </label>

            <input
              type="text"
              id="animalNumber"
              name="animalNumber"
              inputmode="numeric"
              autocomplete="off"
            >
          </div>

          <div>
            <label for="eventDate">
              تاريخ الفحص
            </label>

            <input
              type="date"
              id="eventDate"
              name="eventDate"
            >
          </div>
        </div>

        <div class="row">
          <div>
            <label for="checkStage">
              مرحلة الفحص
            </label>

            <select
              id="checkStage"
              name="checkStage"
            >
              <option value="">
                جاري تحميل المراحل...
              </option>
            </select>
          </div>

          <div>
            <label for="result">
              نتيجة الفحص
            </label>

            <select
              id="result"
              name="result"
            >
              <option value="">
                جاري تحميل النتائج...
              </option>
            </select>
          </div>
        </div>

        <div>
          <label for="vet">
            اسم الطبيب أو الفاحص
          </label>

          <input
  type="text"
  id="vet"
  name="vet"
  list="operationalPerformersList"
  placeholder="اختياري"
  autocomplete="off"
>
        </div>

        <div>
          <label for="notes">
            ملاحظات الفحص
          </label>

          <textarea
            id="notes"
            name="notes"
            rows="4"
            placeholder="اختياري"
          ></textarea>
        </div>
        <div
  class="row"
  id="editToolsRow"
  hidden
  style="display:none"
>
  <div>
    <label for="correctionPerformedBy">
      القائم بالتعديل
    </label>

    <input
      type="text"
      id="correctionPerformedBy"
      list="operationalPerformersList"
      maxlength="160"
      autocomplete="off"
      placeholder="اسم القائم بالتعديل"
    >
  </div>

  <div>
    <label for="correctionReason">
      سبب التعديل
    </label>

    <input
      type="text"
      id="correctionReason"
      maxlength="500"
      autocomplete="off"
      placeholder="اكتب سبب تصحيح فحص الرحم"
    >
  </div>
</div>

<datalist id="operationalPerformersList"></datalist>
      </form>
    </section>
  </main>

  <div class="actions-bar">
    <button
      type="submit"
      form="uterineCheckForm"
      id="saveBtn"
      class="save"
    >
      تسجيل فحص الرحم
    </button>
  </div>

  <script>
    const form =
      document.getElementById(
        "uterineCheckForm"
      );

    const msg =
      document.getElementById("msg");

    const saveBtn =
      document.getElementById("saveBtn");

    const animalNumberInput =
      document.getElementById(
        "animalNumber"
      );

    const eventDateInput =
      document.getElementById(
        "eventDate"
      );

    const checkStageSelect =
      document.getElementById(
        "checkStage"
      );

    const resultSelect =
      document.getElementById(
        "result"
      );
    const vetInput =
  document.getElementById("vet");

const notesInput =
  document.getElementById("notes");

const editToolsRow =
  document.getElementById(
    "editToolsRow"
  );

const correctionPerformedByInput =
  document.getElementById(
    "correctionPerformedBy"
  );

const correctionReasonInput =
  document.getElementById(
    "correctionReason"
  );

const operationalPerformersList =
  document.getElementById(
    "operationalPerformersList"
  );

const pageTitle =
  document.getElementById(
    "pageTitle"
  );

const backLink =
  document.getElementById(
    "backLink"
  );

const params =
  new URLSearchParams(
    location.search
  );

const requestedEditMode =
  String(
    params.get("mode") || ""
  )
    .trim()
    .toLowerCase() === "edit";

const editEventId =
  String(
    params.get("eventId") || ""
  ).trim();

const isEditMode =
  requestedEditMode &&
  !!editEventId;
    function todayLocal() {
      const date = new Date();

      date.setMinutes(
        date.getMinutes() -
        date.getTimezoneOffset()
      );

      return date
        .toISOString()
        .slice(0, 10);
    }

    function showMessage(
      text = "",
      ok = false,
      action = null
    ) {
      if (!msg) return;

      msg.replaceChildren();

      if (!text) {
        msg.className = "infobar";
        msg.style.display = "none";
        return;
      }

      const messageText =
        document.createElement("div");

      messageText.textContent =
        String(text);

      msg.appendChild(messageText);

      if (action?.label) {
        const actions =
          document.createElement("div");

       actions.className =
       "sys-actions";

        const button =
          document.createElement("button");

        button.type = "button";
       button.className =
       "sys-btn primary";

        button.textContent =
          String(action.label);

        button.addEventListener(
          "click",
          () => {
            if (
              typeof action.onClick ===
              "function"
            ) {
              action.onClick();
            }
          }
        );

        actions.appendChild(button);
        msg.appendChild(actions);
      }

      msg.className =
        `infobar mbk-infobar show ${
          ok ? "success" : "error"
        }`;

      msg.style.display = "block";

      try {
        msg.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      } catch (_) {}
    }

    async function requestJSON(
      url,
      options = {}
    ) {
      const response = await fetch(
        url,
        {
          ...options,

          credentials:
            "same-origin",

          cache:
            "no-store",

          headers: {
            "Accept":
              "application/json",

            ...(options.headers || {})
          }
        }
      );

      const data =
        await response
          .json()
          .catch(() => ({}));

      if (
        response.status === 401 ||
        data?.error ===
          "auth_required"
      ) {
        location.replace(
          "login.html"
        );

        throw new Error(
          data.message ||
          "يلزم تسجيل الدخول أولًا."
        );
      }

      return {
        response,
        data
      };
    }

    function collectPayload() {
      return {
        animalNumber:
          animalNumberInput
            .value
            .trim(),

        eventDate:
          eventDateInput.value,

        checkStage:
          checkStageSelect.value,

        result:
          resultSelect.value,

        vet:
  vetInput.value.trim(),

notes:
  notesInput.value.trim()
      };
    }

    function fillSelect(
      select,
      rows = [],
      placeholder = "اختر"
    ) {
      select.replaceChildren();

      const first =
        document.createElement(
          "option"
        );

      first.value = "";
      first.textContent =
        placeholder;

      select.appendChild(first);

      rows.forEach(row => {
        const option =
          document.createElement(
            "option"
          );

        option.value =
          String(
            row?.value || ""
          );

        option.textContent =
          String(
            row?.label || ""
          );

        select.appendChild(option);
      });
    }

    async function loadOptions() {
      const {
        response,
        data
      } = await requestJSON(
        "/api/uterine-check/options",
        {
          method: "GET"
        }
      );

      if (
        !response.ok ||
        data.ok !== true
      ) {
        throw new Error(
          data.message ||
          "تعذّر تحميل قوائم فحص الرحم."
        );
      }

      fillSelect(
        checkStageSelect,
        data?.options?.stages,
        "اختر مرحلة الفحص"
      );

      fillSelect(
        resultSelect,
        data?.options?.results,
        "اختر نتيجة الفحص"
      );
    }
    function renderOperationalPerformers(
  items = []
) {
  if (!operationalPerformersList) {
    return;
  }

  operationalPerformersList
    .replaceChildren();

  [
    ...new Set(
      (Array.isArray(items)
        ? items
        : []
      )
        .map(item =>
          String(item || "").trim()
        )
        .filter(Boolean)
    )
  ].forEach(name => {
    const option =
      document.createElement(
        "option"
      );

    option.value = name;

    operationalPerformersList
      .appendChild(option);
  });
}

async function loadOperationalPerformers() {
  const {
    response,
    data
  } = await requestJSON(
    "/api/event-options/operational-performers",
    {
      method: "GET"
    }
  );

  if (
    response.ok &&
    data.ok === true
  ) {
    renderOperationalPerformers(
      data.operationalPerformers
    );
  }
}

async function loadEditEvent() {
  if (!isEditMode) {
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent =
    "جارِ تحميل الحدث…";

  const {
    response,
    data
  } = await requestJSON(
    `/api/events-page/event/${encodeURIComponent(editEventId)}`,
    {
      method: "GET"
    }
  );

  if (
    !response.ok ||
    data.ok !== true ||
    !data.event
  ) {
    throw new Error(
      data.message ||
      "تعذّر تحميل فحص الرحم للتعديل."
    );
  }

  const ev = data.event;

  if (ev.typeKey !== "uterine_check") {
    throw new Error(
      "الحدث المطلوب ليس فحص رحم."
    );
  }

  if (
    ev.editPolicy?.editable !== true
  ) {
    throw new Error(
      ev.editPolicy?.reason ||
      "هذا الحدث غير متاح للتعديل."
    );
  }

  renderOperationalPerformers(
    data.correctionPerformers
  );

  animalNumberInput.value =
    ev.animalNumber || "";

  animalNumberInput.readOnly = true;

  eventDateInput.value =
    ev.data?.eventDate ||
    ev.eventDate ||
    "";
  eventDateInput.readOnly = true;
  checkStageSelect.value =
    ev.data?.checkStage || "";

  resultSelect.value =
    ev.data?.result || "";

  vetInput.value =
    ev.data?.vet || "";

  notesInput.value =
    ev.data?.notes || "";

  editToolsRow.hidden = false;
editToolsRow.style.display = "";

  correctionPerformedByInput
    .required = true;

  correctionReasonInput
    .required = true;

  if (pageTitle) {
    pageTitle.textContent =
      "تعديل فحص الرحم";
  }

  document.title =
    "تعديل فحص الرحم";

  if (backLink) {
    backLink.href =
      `event-list.html?number=${encodeURIComponent(ev.animalNumber || "")}`;
  }

  saveBtn.textContent =
    "حفظ التعديل ✅";

  saveBtn.disabled = false;

  showMessage(
    "عدّل بيانات فحص الرحم ثم اكتب القائم بالتعديل وسبب التعديل.",
    true
  );
}
    function hydrate() {
      

      animalNumberInput.value =
        params.get("number") ||
        params.get(
          "animalNumber"
        ) ||
        "";

      eventDateInput.value =
        params.get("eventDate") ||
        params.get("date") ||
        todayLocal();
    }

    async function runGate() {
  if (requestedEditMode) {
    return;
  }

  const payload =
    collectPayload();
      if (
        !payload.animalNumber ||
        !payload.eventDate
      ) {
        showMessage("");
        return;
      }

      try {
        const {
          response,
          data
        } = await requestJSON(
          "/api/uterine-check/gate",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );

        if (
          !response.ok ||
          data.ok === false
        ) {
          showMessage(
            data.message ||
            "تعذّر التحقق من الحيوان.",
            false
          );

          return;
        }

        if (
          data.allowed === false
        ) {
          if (!data.silent) {
            showMessage(
              data.message ||
              "لا يمكن تسجيل الفحص.",
              false
            );
          }

          return;
        }

        if (
          data.suggestedStage &&
          !checkStageSelect.value
        ) {
          checkStageSelect.value =
            data.suggestedStage;
        }

        const text = [
          data.message,
          data.advisory
        ]
          .filter(Boolean)
          .join(" ");

        showMessage(
          text,
          true
        );

      } catch (error) {
        showMessage(
          error.message ||
          "تعذّر التحقق من الحيوان.",
          false
        );
      }
    }

    animalNumberInput
      .addEventListener(
        "change",
        runGate
      );

    eventDateInput
      .addEventListener(
        "change",
        runGate
      );

   form.addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    showMessage("");
    saveBtn.disabled = true;

    try {
      const payload =
        collectPayload();

      let response;
      let data;

      if (isEditMode) {
        const correctionPerformedBy =
          correctionPerformedByInput
            .value
            .trim();

        const correctionReason =
          correctionReasonInput
            .value
            .trim();

        if (!correctionPerformedBy) {
          throw new Error(
            "أدخل اسم القائم بالتعديل."
          );
        }

        if (!correctionReason) {
          throw new Error(
            "اكتب سبب التعديل."
          );
        }

        const result =
          await requestJSON(
            `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  ...payload,
                  correctionPerformedBy,
                  correctionReason
                })
            }
          );

        response = result.response;
        data = result.data;

      } else {
        const result =
          await requestJSON(
            "/api/uterine-check/save",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );

        response = result.response;
        data = result.data;
      }

      if (
        !response.ok ||
        data.ok !== true
      ) {
        throw new Error(
          data.message ||
          (
            isEditMode
              ? "تعذّر تعديل فحص الرحم."
              : "تعذّر حفظ فحص الرحم."
          )
        );
      }

      showMessage(
        data.message ||
        (
          isEditMode
            ? "تم تعديل فحص الرحم بنجاح."
            : "تم حفظ فحص الرحم بنجاح."
        ),
        true,
        {
          label: "حسنًا",

          onClick: () => {
            location.href =
              isEditMode
                ? `event-list.html?number=${encodeURIComponent(animalNumberInput.value.trim())}`
                : data.redirectUrl ||
                  "add-event.html";
          }
        }
      );

    } catch (error) {
      showMessage(
        error.message ||
        (
          isEditMode
            ? "تعذّر تعديل فحص الرحم الآن."
            : "تعذّر حفظ فحص الرحم الآن."
        ),
        false
      );

      saveBtn.disabled = false;

      saveBtn.textContent =
        isEditMode
          ? "حفظ التعديل ✅"
          : "تسجيل فحص الرحم";
    }
  }
);
async function init() {
  try {
    hydrate();

    await loadOptions();
    await loadOperationalPerformers();

    if (requestedEditMode) {
      if (!editEventId) {
        throw new Error(
          "رابط تعديل فحص الرحم غير مكتمل."
        );
      }

      await loadEditEvent();

    } else {
      await runGate();
    }

  } catch (error) {
    showMessage(
      error.message ||
      "تعذّر تجهيز صفحة فحص الرحم.",
      false
    );

    saveBtn.disabled = true;
  }
}

    init();
  </script>
</body>
</html>
