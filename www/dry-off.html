<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

  <title>التجفيف — مُرَبِّيك</title>

  <!-- ✅ Murabbik global styles + central validation/gate -->
  <link rel="stylesheet" href="css/forms.css">
  


 
</head>

<body>
  <!-- ✅ Murabbik Standard Header -->
  <header>
    <div class="mbk-head">
      <a class="mbk-back" href="add-event.html" title="رجوع">رجوع</a>

      <div class="mbk-center">
        <div class="mbk-page-title">التجفيف</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>

      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
    </div>
  </header>

 <main class="mbk-form">
  <!-- ✅ Infobar (سيستخدمه showMsg) -->
  <div id="info" class="infobar"></div>

  <form id="dryOffForm" class="mbk-card" data-event="تجفيف">

    <div class="field">
      <label for="animalNumber">رقم الحيوان</label>
      <input type="text" id="animalNumber" data-field="animalNumber" required />
    </div>

    <div class="field">
      <label for="eventDate">تاريخ التجفيف</label>
      <input type="date" id="eventDate" data-field="eventDate" required />
    </div>

    <div class="field">
      <label for="gestationDays">أيام الحمل (محسوبة تلقائيًا)</label>
      <input type="number" id="gestationDays" data-field="gestationDays" required readonly />
    </div>

   <div class="field">
  <label for="reason">سبب التجفيف (يُحدد تلقائيًا)</label>
  <input type="text" id="reason" data-field="reason" readonly required />
</div>


    <div class="field">
      <label>تأكيد الحمل</label>
      <div class="radio-group">
        <label><input type="radio" data-field="pregnancyStatus" name="pregnancyStatus" value="عشار" required /> عشار</label>
        <label><input type="radio" data-field="pregnancyStatus" name="pregnancyStatus" value="فارغة" required /> فارغة</label>
      </div>
    </div>
  

        <div class="field">
      <label>تم استخدام محاقن التجفيف؟</label>
     <div class="radio-group"> 
        <label><input type="radio" data-field="usedDryingAntibiotics" name="usedDryingAntibiotics" value="نعم" required /> نعم</label>
        <label><input type="radio" data-field="usedDryingAntibiotics" name="usedDryingAntibiotics" value="لا" required /> لا</label>
      </div>
    </div>

    <div class="field">
      <label for="performedBy">الفني / الطبيب</label>
      <input
        type="text"
        id="performedBy"
        data-field="performedBy"
        list="dryOffPerformersList"
        autocomplete="off"
        required
      />
           <datalist id="dryOffPerformersList"></datalist>
    </div>

    <div class="row" id="editToolsRow" style="display:none">
      <div>
        <label for="correctionPerformedBy">القائم بالتعديل</label>
        <input
          type="text"
          id="correctionPerformedBy"
          maxlength="160"
          list="dryOffPerformersList"
          placeholder="اسم الفني أو الطبيب"
          autocomplete="off"
        >
        <small class="form-hint">
          يُستخدم نفس دليل الفنيين والأطباء في مُرَبِّيك.
        </small>
      </div>

      <div>
        <label for="correctionReason">سبب التعديل</label>
        <input
          type="text"
          id="correctionReason"
          maxlength="500"
          placeholder="اكتب سبب تصحيح التجفيف"
        >
        <small class="form-hint">
          يُحفظ سبب التعديل داخل سجل التصحيحات.
        </small>
      </div>
    </div>
 

    <!-- ✅ Bottom actions -->
    <div class="actions-bar">
  <button class="save" type="submit">حفظ التجفيف</button>
  <button class="ghost" id="openCowCard" type="button">فتح بطاقة الحيوان</button>
</div>
  </form>
</main>

 <script>
  const form = document.getElementById("dryOffForm");

  const qp = new URLSearchParams(location.search);

  const requestedEditMode =
    String(qp.get("mode") || "")
      .trim()
      .toLowerCase() === "edit";

  const editEventId =
    String(qp.get("eventId") || "").trim();

  const isEditMode =
    requestedEditMode && !!editEventId;

  const animalEl = document.getElementById("animalNumber");
  const dateEl = document.getElementById("eventDate");
   const gestEl = document.getElementById("gestationDays");
  const reasonEl = document.getElementById("reason");
  const performedByEl = document.getElementById("performedBy");
  const performersListEl = document.getElementById("dryOffPerformersList");
   const info = document.getElementById("info");
  const openCardBtn = document.getElementById("openCowCard");
  const saveBtn = form.querySelector('button[type="submit"]');
  const editToolsRow = document.getElementById("editToolsRow");
  const correctionPerformedByEl =
    document.getElementById("correctionPerformedBy");
  const correctionReasonEl =
    document.getElementById("correctionReason");

  let acceptedRows = [];
  let rejectedRows = [];
  let gateOk = false;
  let gateTimer = null;


  function todayYYYYMMDD() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${m}-${day}`;
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showMsg(msg, type = "info") {
    if (!info) return;

    const cls =
      type === "error" ? "error" :
      type === "success" ? "success" :
      type === "warning" ? "warning" :
      "info";

    info.style.display = "block";
    info.className = `infobar mbk-infobar show ${cls}`;
    info.innerHTML = `
      <div style="white-space:pre-line;font-weight:900;font-size:16px;line-height:1.7">
        ${escapeHtml(msg)}
      </div>
    `;

    try {
      info.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (_) {}
  }
  async function sessionPostJson(path, payload) {
  const r = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify(payload || {})
  });

  const data = await r.json().catch(() => null);

  if (r.status === 401 || data?.error === "auth_required") {
    showMsg(data?.message || "❌ سجّل الدخول أولًا.", "error");
    return { r, data, authRequired: true };
  }

  return { r, data, authRequired: false };
}
   async function loadDryOffOptions() {
  if (!performersListEl) return;

  try {
    const r = await fetch("/api/dry-off/options", {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store",
      headers: {
        "Accept": "application/json"
      }
    });

    const data = await r.json().catch(() => null);

    if (r.status === 401 || data?.error === "auth_required") {
      showMsg(data?.message || "❌ سجّل الدخول أولًا.", "error");
      return;
    }

    if (!data || data.ok !== true) {
      console.warn(
        "dry-off options unavailable:",
        data?.message || r.status
      );
      return;
    }

    const performers = Array.isArray(data.performers)
      ? [...new Set(
          data.performers
            .map(x => String(x || "").trim())
            .filter(Boolean)
        )]
      : [];

       renderDryOffPerformers(performers);

  } catch (err) {
    console.warn("dry-off options failed:", err);
  }
}
  function renderDryOffPerformers(items = []) {
    if (!performersListEl) return;

    const current = Array.from(
      performersListEl.querySelectorAll("option")
    )
      .map(option => String(option.value || "").trim())
      .filter(Boolean);

    const names = [
      ...new Set(
        [
          ...current,
          ...(Array.isArray(items) ? items : [])
        ]
          .map(x => String(x || "").trim())
          .filter(Boolean)
      )
    ];

    performersListEl.innerHTML = "";

    for (const name of names) {
      const option = document.createElement("option");
      option.value = name;
      performersListEl.appendChild(option);
    }
  }

  function setRadioValue(name, value) {
    const wanted = String(value || "").trim();

    form
      .querySelectorAll(`input[name="${name}"]`)
      .forEach(input => {
        input.checked =
          String(input.value || "").trim() === wanted;
      });
  }

  async function loadEditEvent() {
    if (!isEditMode) return;

    try {
      showMsg(
        "جارِ تحميل بيانات التجفيف للتعديل...",
        "info"
      );

      const r = await fetch(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`,
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

      const data =
        await r.json().catch(() => null);

      if (
        r.status === 401 ||
        data?.error === "auth_required"
      ) {
        showMsg(
          data?.message || "❌ سجّل الدخول أولًا.",
          "error"
        );
        return;
      }

      if (
        !r.ok ||
        !data ||
        data.ok !== true ||
        !data.event
      ) {
        showMsg(
          data?.message ||
            "❌ تعذّر تحميل حدث التجفيف للتعديل.",
          "error"
        );
        return;
      }

      const ev = data.event;
      const evData = ev.data || {};

      if (
        String(ev.typeKey || "").trim() !==
        "dry_off"
      ) {
        showMsg(
          "❌ رابط التعديل لا يخص حدث تجفيف.",
          "error"
        );
        return;
      }

      if (ev.editPolicy?.editable !== true) {
        showMsg(
          ev.editPolicy?.reason ||
            "❌ هذا الحدث غير متاح للتعديل.",
          "error"
        );
        return;
      }

      renderDryOffPerformers(
        data.correctionPerformers
      );

      animalEl.value =
        String(ev.animalNumber || "").trim();

      animalEl.readOnly = true;

      dateEl.value =
        String(
          evData.eventDate ||
          ev.eventDate ||
          ""
        )
          .trim()
          .slice(0, 10);

      gestEl.value =
        Number.isFinite(
          Number(evData.gestationDays)
        )
          ? Number(evData.gestationDays)
          : "";

      reasonEl.value =
        String(
          evData.dryOffReason || ""
        ).trim();

      setRadioValue(
        "pregnancyStatus",
        evData.pregnancyStatus
      );

      setRadioValue(
        "usedDryingAntibiotics",
        evData.usedDryingAntibiotics
      );

      performedByEl.value =
        String(
          evData.performedBy || ""
        ).trim();

      gestEl.required = false;
      reasonEl.required = false;

      if (editToolsRow) {
        editToolsRow.style.display = "";
      }

      if (correctionPerformedByEl) {
        correctionPerformedByEl.required = true;
      }

      if (correctionReasonEl) {
        correctionReasonEl.required = true;
      }

      const titleEl =
        document.querySelector(
          ".mbk-page-title"
        );

      if (titleEl) {
        titleEl.textContent =
          "تعديل التجفيف";
      }

      if (saveBtn) {
        saveBtn.textContent =
          "حفظ التعديل ✅";
      }

      const backEl =
        document.querySelector(
          ".mbk-back"
        );

      if (backEl) {
        backEl.href =
          `event-list.html?number=${encodeURIComponent(animalEl.value)}`;
      }

      if (info) {
        info.style.display = "none";
      }

    } catch (err) {
      console.error(
        "dry-off edit load failed:",
        err
      );

      showMsg(
        "❌ تعذّر تحميل حدث التجفيف للتعديل.",
        "error"
      );
    }
  }

  function markEditDerivedFieldsForRecalculation() {
    if (!isEditMode) return;

    gestEl.value = "";
    gestEl.placeholder =
      "يُعاد حسابها عند الحفظ";

    reasonEl.value =
      "يُعاد تحديده تلقائيًا عند الحفظ";
  }
  function normalizeDigits(s) {
    const map = {
      "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
      "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
    };

    return String(s || "")
      .replace(/[٠-٩۰-۹]/g, d => map[d] || d);
  }

  function splitNumbers(raw) {
    return [...new Set(
      normalizeDigits(raw)
        .split(/[\s,،;]+/g)
        .map(x => x.trim())
        .filter(Boolean)
    )];
  }

  function selectedRadio(name) {
    return form.querySelector(`input[name="${name}"]:checked`)?.value || "";
  }

    function setButtonLoading(isLoading) {
    const btn =
      form.querySelector(
        'button[type="submit"]'
      );

    if (!btn) return;

    btn.disabled = !!isLoading;

    btn.textContent =
      isLoading
        ? "جارِ الحفظ..."
        : (
            isEditMode
              ? "حفظ التعديل ✅"
              : "حفظ التجفيف"
          );
  }

  function resetGateResult() {
    acceptedRows = [];
    rejectedRows = [];
    gateOk = false;
    gestEl.value = "";
    reasonEl.value = "";
  }

function renderGateResult(data) {
  acceptedRows = Array.isArray(data?.accepted) ? data.accepted : [];
  rejectedRows = Array.isArray(data?.rejected) ? data.rejected : [];
  gateOk = acceptedRows.length > 0;

  if (acceptedRows.length === 1) {
    const row = acceptedRows[0];
    gestEl.value = row.gestationDays ?? "";
    reasonEl.value = row.reason || "";
  } else if (acceptedRows.length > 1) {
    gestEl.value = "";
    reasonEl.value = "تجفيف جماعي";
  } else {
    gestEl.value = "";
    reasonEl.value = "";
  }

  if (!acceptedRows.length && rejectedRows.length === 1) {
    const r = rejectedRows[0] || {};
    showMsg(r.reason || data?.message || "❌ الحيوان غير مؤهل لتسجيل التجفيف.", "error");
    return;
  }

  if (acceptedRows.length === 1 && !rejectedRows.length) {
    const row = acceptedRows[0];
    showMsg(`✅ الحيوان مؤهل لتسجيل التجفيف.\n${row.animalNumber} — ${row.reason} — ${row.gestationDays} يوم`, "success");
    return;
  }

  let msg = `نتيجة التحقق:\nالمؤهل: ${acceptedRows.length}\nغير المؤهل: ${rejectedRows.length}`;

  if (acceptedRows.length) {
    msg += "\n\n✅ المؤهل:";
    msg += "\n" + acceptedRows
      .map(r => `${r.animalNumber} — ${r.reason} — ${r.gestationDays} يوم`)
      .join("\n");
  }

  if (rejectedRows.length) {
    msg += "\n\n❌ غير المؤهل:";
    msg += "\n" + rejectedRows
      .map(r => `${r.animalNumber || "-"} — ${r.reason || "غير مؤهل"}`)
      .join("\n");
  }

  showMsg(msg, gateOk ? "success" : "error");
}
    async function runDryOffGate({ silent = false } = {}) {
    if (requestedEditMode) return false;

    const animalNumbers =
      animalEl.value.trim();
    const eventDate = dateEl.value;

    resetGateResult();

    if (!animalNumbers || !eventDate) {
      if (!silent) showMsg("أدخل رقم الحيوان وتاريخ التجفيف أولًا.", "warning");
      return false;
    }

    try {
      if (!silent) showMsg("جارِ التحقق من أهلية التجفيف...", "info");

     const { data, authRequired } = await sessionPostJson("/api/dry-off/gate", {
  animalNumbers,
  eventDate
});

if (authRequired) return false;

      if (!data || data.ok !== true || data.allowed !== true) {
        renderGateResult(data || {
          message: "❌ الحيوان غير مؤهل لتسجيل التجفيف.",
          accepted: [],
          rejected: []
        });
        return false;
      }

      renderGateResult(data);
      return true;

    } catch (err) {
      console.error("dry-off gate failed:", err);
      showMsg("❌ تعذّر التحقق من أهلية التجفيف الآن.", "error");
      return false;
    }
  }

   function scheduleGate() {
    if (requestedEditMode) return;

    clearTimeout(gateTimer);
    gateTimer = setTimeout(() => {
      runDryOffGate({ silent: true });
    }, 450);
  }

  async function saveDryOff() {
    const eventDate = dateEl.value;
    const pregnancyStatus = selectedRadio("pregnancyStatus");
    const usedDryingAntibiotics = selectedRadio("usedDryingAntibiotics");
    const performedBy = String(performedByEl?.value || "").trim();


    if (!eventDate) {
      showMsg("❌ تاريخ التجفيف مطلوب.", "error");
      return;
    }

    if (!pregnancyStatus) {
      showMsg("❌ تأكيد الحمل مطلوب.", "error");
      return;
    }

    if (!usedDryingAntibiotics) {
      showMsg("❌ حدد هل تم استخدام محاقن التجفيف.", "error");
      return;
    }
       if (!performedBy) {
      showMsg(
        "❌ أدخل اسم الفني أو الطبيب الذي نفّذ التجفيف.",
        "error"
      );
      performedByEl?.focus();
      return;
    }
       if (isEditMode) {
      const correctionPerformedBy =
        String(
          correctionPerformedByEl?.value ||
          ""
        ).trim();

      const correctionReason =
        String(
          correctionReasonEl?.value ||
          ""
        ).trim();

      if (!correctionPerformedBy) {
        showMsg(
          "❌ أدخل اسم القائم بالتعديل.",
          "error"
        );
        correctionPerformedByEl?.focus();
        return;
      }

      if (!correctionReason) {
        showMsg(
          "❌ اكتب سبب التعديل.",
          "error"
        );
        correctionReasonEl?.focus();
        return;
      }

      try {
        setButtonLoading(true);

        showMsg(
          "جارِ حفظ تعديل التجفيف...",
          "info"
        );

        const {
          r,
          data,
          authRequired
        } =
          await sessionPostJson(
            `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
            {
              animalNumber:
                animalEl.value.trim(),

              eventDate,
              pregnancyStatus,
              usedDryingAntibiotics,
              performedBy,

              correctionPerformedBy,
              correctionReason
            }
          );

        if (authRequired) {
          setButtonLoading(false);
          return;
        }

        if (
          !r.ok ||
          !data ||
          data.ok !== true
        ) {
          showMsg(
            data?.message ||
              "❌ لم يتم حفظ تعديل التجفيف.",
            "error"
          );

          setButtonLoading(false);
          return;
        }

        showMsg(
          data.message ||
            "✅ تم تعديل التجفيف بنجاح.",
          "success"
        );

        setTimeout(() => {
          location.href =
            `event-list.html?number=${encodeURIComponent(animalEl.value.trim())}`;
        }, 700);

      } catch (err) {
        console.error(
          "dry-off correction save failed:",
          err
        );

        showMsg(
          "❌ فشل الاتصال بالسيرفر أثناء حفظ تعديل التجفيف.",
          "error"
        );

        setButtonLoading(false);
      }

      return;
    }

    if (!gateOk || !acceptedRows.length) {
      const ok =
        await runDryOffGate({
          silent: false
        });

      if (!ok) return;
    }

    try {
      setButtonLoading(true);
      showMsg(
        "جارِ حفظ التجفيف...",
        "info"
      );
 const { data, authRequired } = await sessionPostJson("/api/dry-off/save", {
  eventDate,
  pregnancyStatus,
  usedDryingAntibiotics,
  performedBy,
  accepted: acceptedRows,
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"
});

if (authRequired) return;

      if (!data || data.ok !== true) {
        const msg = data?.message || "❌ لم يتم حفظ التجفيف.";
        const rejected = Array.isArray(data?.rejected) && data.rejected.length
          ? "\n\n" + data.rejected.map(x => `❌ ${x.animalNumber || "-"} — ${x.reason || ""}`).join("\n")
          : "";

        showMsg(msg + rejected, "error");
        setButtonLoading(false);
        return;
      }

      let msg = data.message || "✅ تم حفظ التجفيف بنجاح.";

      if (Array.isArray(data.rejected) && data.rejected.length) {
        msg += "\n\nلم تُحفظ:";
        msg += "\n" + data.rejected.map(x => `❌ ${x.animalNumber || "-"} — ${x.reason || ""}`).join("\n");
      }

      showMsg(msg, "success");

      setTimeout(() => {
        if (data.redirectUrl) {
          location.href = data.redirectUrl;
          return;
        }

        const first = data?.saved?.[0]?.animalNumber || acceptedRows?.[0]?.animalNumber || "";
        if (first) {
          location.href = `event-list.html?number=${encodeURIComponent(first)}`;
        } else {
          location.href = "dashboard.html";
        }
      }, 900);

    } catch (err) {
      console.error("dry-off save failed:", err);
      showMsg("❌ فشل الاتصال بالسيرفر أثناء حفظ التجفيف.", "error");
      setButtonLoading(false);
    }
  }

     window.addEventListener("load", () => {
    if (requestedEditMode) {
      if (!editEventId) {
        showMsg(
          "❌ رابط تعديل التجفيف غير مكتمل.",
          "error"
        );
        return;
      }

      loadEditEvent();
      return;
    }

    loadDryOffOptions();

    const qpNum =
      qp.get("numbers") ||
      qp.get("animalNumbers") ||
      qp.get("bulk") ||
      qp.get("number") ||
      qp.get("animalNumber") ||
      qp.get("animalId") ||
      "";

    const startNumber = qpNum || "";

    if (startNumber) {
      animalEl.value = startNumber;
    }

    if (!dateEl.value) {
      dateEl.value =
        todayYYYYMMDD();
    }

    if (
      animalEl.value &&
      dateEl.value
    ) {
      runDryOffGate({
        silent: true
      });
    }
  });

  animalEl.addEventListener(
    "input",
    scheduleGate
  );

  dateEl.addEventListener(
    "change",
    () => {
      if (isEditMode) {
        markEditDerivedFieldsForRecalculation();
        return;
      }

      scheduleGate();
    }
  );
  openCardBtn?.addEventListener("click", () => {
    const first = splitNumbers(animalEl.value)[0] || "";
    if (!first) return;
    location.href = `/cow-card.html?number=${encodeURIComponent(first)}`;
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    saveDryOff();
  });
</script>
</body>
</html>
