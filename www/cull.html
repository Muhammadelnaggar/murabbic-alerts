<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="cull">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل استبعاد — مُرَبِّك</title>
  <link rel="stylesheet" href="css/forms.css" />

</head>
<body>
<header>
  <div class="mbk-head">
    <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
    <div class="mbk-center">
      <div class="mbk-page-title" id="pageTitle">تسجيل الاستبعاد</div>
      <div class="mbk-app-name">مُرَبِّيك</div>
    </div>
  <a class="mbk-back" id="backLink" href="add-event.html">رجوع</a>
  </div>
</header>


 <main class="mbk-form">
  <form id="cullForm" data-event="استبعاد" novalidate>
    <div id="info" class="infobar"></div>
    <section class="mbk-card">
    <label>رقم الحيوان</label>
   <input id="animalNumber" data-field="animalNumber" readonly />

    <label>تاريخ الاستبعاد</label>
   <input id="eventDate" data-field="eventDate" type="date" />

    <label>سبب الاستبعاد (رئيسي)</label>
    <select id="cullMain" data-field="cullMain">
      <option value="">— اختر —</option>
      <option value="انتاجي">إنتاجي</option>
      <option value="تناسلي">تناسلي</option>
      <option value="صحي">صحي</option>
    </select>

    <label>تفصيل السبب</label>
<select id="cullDetail" data-field="cullDetail" disabled>    
  <option value="">— اختر السبب الرئيسي أولاً —</option>
    </select>

    <label>ملاحظات</label>
   <textarea id="notes" data-field="notes" rows="3" placeholder="اختياري"></textarea>
       </section>

<section class="mbk-card" id="editToolsCard" hidden style="display:none">
  <label for="correctionPerformedBy">القائم بالتعديل</label>
  <input
    id="correctionPerformedBy"
    type="text"
    list="operationalPerformersList"
    maxlength="160"
    autocomplete="off"
    placeholder="اسم القائم بالتعديل"
  />

  <label for="correctionReason">سبب التعديل</label>
  <input
    id="correctionReason"
    type="text"
    maxlength="500"
    autocomplete="off"
    placeholder="اكتب سبب تصحيح الاستبعاد"
  />

  <datalist id="operationalPerformersList"></datalist>
</section>

<div class="actions-bar">
  <button class="save" id="saveBtn" type="submit">تسجيل الاستبعاد</button>
  <button class="ghost" type="button" id="openCardBtn">بطاقة الحيوان</button>
</div>
</form>
  </main>

 <script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const form = $("cullForm");
  const info = $("info");
  const btn = $("saveBtn");
  const openBtn = $("openCardBtn");

  const animalEl = $("animalNumber");
  const eventDateEl = $("eventDate");
  const mainEl = $("cullMain");
  const detailEl = $("cullDetail");
  const notesEl = $("notes");

  const pageTitle = $("pageTitle");
  const backLink = $("backLink");

  const editToolsCard = $("editToolsCard");
  const correctionPerformedByEl = $("correctionPerformedBy");
  const correctionReasonEl = $("correctionReason");
  const operationalPerformersList = $("operationalPerformersList");

  const qs = new URLSearchParams(location.search);

  const requestedMode =
    String(
      qs.get("mode") ||
      qs.get("mbkMode") ||
      ""
    )
      .trim()
      .toLowerCase();

  const requestedEditMode =
    requestedMode === "edit";

  const editEventId =
    String(
      qs.get("eventId") ||
      ""
    ).trim();

  const isEditMode =
    requestedEditMode &&
    !!editEventId;

  let cullGateAllowed = false;
  let cullOptions = {};

  function msg(text, type = "info") {
    if (!info) return;

    const cls =
      type === "success" ? "success" :
      type === "error" ? "error" :
      type === "warning" ? "warning" :
      "info";

    info.className =
      `infobar mbk-infobar show ${cls}`;

    info.style.display =
      "block";

    info.textContent =
      String(text || "");

    try {
      info.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    } catch (_) {}
  }

  async function sessionFetchJson(
    path,
    options = {}
  ) {
    const r = await fetch(path, {
      method:
        options.method || "GET",

      credentials:
        "same-origin",

      cache:
        "no-store",

      headers: {
        "Accept":
          "application/json",

        ...(options.body
          ? {
              "Content-Type":
                "application/json"
            }
          : {}),

        ...(options.headers || {})
      },

      body:
        options.body
          ? JSON.stringify(options.body)
          : undefined
    });

    const data =
      await r
        .json()
        .catch(() => null);

    if (
      r.status === 401 ||
      data?.error ===
        "auth_required"
    ) {
      msg(
        data?.message ||
        "❌ سجّل الدخول أولًا.",
        "error"
      );

      return {
        r,
        data,
        authRequired: true
      };
    }

    return {
      r,
      data,
      authRequired: false
    };
  }

  function renderPerformers(items = []) {
    if (!operationalPerformersList) {
      return;
    }

    operationalPerformersList
      .replaceChildren();

    [
      ...new Set(
        (
          Array.isArray(items)
            ? items
            : []
        )
          .map(x =>
            String(x || "").trim()
          )
          .filter(Boolean)
      )
    ].forEach(name => {
      const option =
        document.createElement(
          "option"
        );

      option.value =
        name;

      operationalPerformersList
        .appendChild(option);
    });
  }

  function setLoading(v) {
    if (!btn) return;

    btn.disabled =
      !!v;

    btn.textContent =
      v
        ? "جارِ الحفظ..."
        : (
            isEditMode
              ? "حفظ التعديل"
              : "تسجيل الاستبعاد"
          );

    if (
      !v &&
      !isEditMode
    ) {
      btn.disabled =
        !cullGateAllowed;
    }
  }

  function initFromUrl() {
    const num =
      qs.get("number") ||
      qs.get("animalNumber") ||
      "";

    const dt =
      qs.get("date") ||
      qs.get("eventDate") ||
      new Date()
        .toISOString()
        .slice(0, 10);

    animalEl.value =
      String(num || "").trim();

    eventDateEl.value =
      String(dt || "")
        .slice(0, 10);
  }

  function fillMainOptions(
    selected = ""
  ) {
    const current =
      String(
        selected ||
        mainEl?.value ||
        ""
      ).trim();

    mainEl.innerHTML =
      `<option value="">— اختر —</option>`;

    Object.keys(
      cullOptions || {}
    ).forEach(key => {
      const opt =
        document.createElement(
          "option"
        );

      opt.value =
        key;

      opt.textContent =
        key;

      mainEl.appendChild(opt);
    });

    if (
      current &&
      cullOptions[current]
    ) {
      mainEl.value =
        current;
    }
  }

  function fillDetails(
    selected = ""
  ) {
    const m =
      String(
        mainEl?.value ||
        ""
      ).trim();

    const current =
      String(
        selected ||
        detailEl?.value ||
        ""
      ).trim();

    if (
      !m ||
      !Array.isArray(
        cullOptions[m]
      )
    ) {
      detailEl.innerHTML =
        `<option value="">— اختر السبب الرئيسي أولاً —</option>`;

      detailEl.value =
        "";

      detailEl.disabled =
        true;

      return;
    }

    detailEl.disabled =
      false;

    detailEl.innerHTML =
      `<option value="">— اختر —</option>`;

    cullOptions[m]
      .forEach(label => {
        const value =
          String(
            label || ""
          ).trim();

        const opt =
          document.createElement(
            "option"
          );

        opt.value =
          value;

        opt.textContent =
          value;

        detailEl.appendChild(opt);
      });

    if (
      current &&
      cullOptions[m]
        .includes(current)
    ) {
      detailEl.value =
        current;
    }
  }

  async function loadCullOptions() {
    try {
      const {
        r,
        data,
        authRequired
      } =
        await sessionFetchJson(
          "/api/cull/options"
        );

      if (authRequired) {
        return false;
      }

      if (
        !r.ok ||
        data?.ok !== true ||
        !data?.options
      ) {
        msg(
          data?.message ||
          "❌ تعذّر تحميل أسباب الاستبعاد.",
          "error"
        );

        return false;
      }

      cullOptions =
        data.options || {};

      fillMainOptions();
      fillDetails();

      return true;

    } catch (e) {
      console.error(
        "load cull options failed",
        e
      );

      msg(
        "❌ فشل الاتصال بالسيرفر أثناء تحميل أسباب الاستبعاد.",
        "error"
      );

      return false;
    }
  }

  async function runCullGate() {
    if (requestedEditMode) {
      return false;
    }

    const animalNumber =
      String(
        animalEl?.value ||
        ""
      ).trim();

    cullGateAllowed =
      false;

    if (btn) {
      btn.disabled = true;
    }

    if (!animalNumber) {
      msg(
        "❌ رقم الحيوان مطلوب.",
        "error"
      );

      return false;
    }

    try {
      msg(
        "جارِ التحقق من الحيوان...",
        "info"
      );

      const {
        r,
        data,
        authRequired
      } =
        await sessionFetchJson(
          "/api/cull/gate",
          {
            method: "POST",
            body: {
              animalNumber
            }
          }
        );

      if (authRequired) {
        return false;
      }

      if (
        !r.ok ||
        data?.allowed !== true
      ) {
        cullGateAllowed =
          false;

        if (btn) {
          btn.disabled =
            true;
        }

        msg(
          data?.message ||
          "❌ لا يمكن تسجيل استبعاد لهذا الحيوان.",
          "error"
        );

        return false;
      }

      cullGateAllowed =
        true;

      if (btn) {
        btn.disabled =
          false;
      }

      msg(
        data.message ||
        "✅ الحيوان مؤهل لتسجيل الاستبعاد.",
        "success"
      );

      return true;

    } catch (e) {
      console.error(
        "cull gate failed",
        e
      );

      cullGateAllowed =
        false;

      if (btn) {
        btn.disabled =
          true;
      }

      msg(
        "❌ فشل الاتصال بالسيرفر أثناء التحقق من الحيوان.",
        "error"
      );

      return false;
    }
  }

  async function saveCull() {
    if (!cullGateAllowed) {
      msg(
        "❌ لا يمكن الحفظ قبل نجاح التحقق من الحيوان.",
        "error"
      );

      return;
    }

    const payload = {
      animalNumber:
        String(
          animalEl?.value ||
          ""
        ).trim(),

      eventDate:
        String(
          eventDateEl?.value ||
          ""
        ).slice(0, 10),

      cullMain:
        String(
          mainEl?.value ||
          ""
        ).trim(),

      cullDetail:
        String(
          detailEl?.value ||
          ""
        ).trim(),

      notes:
        String(
          notesEl?.value ||
          ""
        ).trim()
    };

    if (!payload.cullMain) {
      msg(
        "⚠️ اختر سبب الاستبعاد الرئيسي.",
        "warning"
      );

      return;
    }

    if (!payload.cullDetail) {
      msg(
        "⚠️ اختر تفصيل سبب الاستبعاد.",
        "warning"
      );

      return;
    }

    try {
      setLoading(true);

      msg(
        "جارِ حفظ الاستبعاد...",
        "info"
      );

      const {
        r,
        data,
        authRequired
      } =
        await sessionFetchJson(
          "/api/cull/save",
          {
            method: "POST",
            body: payload
          }
        );

      if (authRequired) {
        return;
      }

      if (
        !r.ok ||
        data?.ok !== true
      ) {
        msg(
          data?.message ||
          "❌ فشل حفظ الاستبعاد.",
          "error"
        );

        return;
      }

      msg(
        data.message ||
        "✅ تم حفظ الاستبعاد بنجاح",
        "success"
      );

      setTimeout(() => {
        location.href =
          data.redirectUrl ||
          `cow-card.html?number=${encodeURIComponent(payload.animalNumber)}`;
      }, 900);

    } catch (e) {
      console.error(
        "save cull failed",
        e
      );

      msg(
        "❌ فشل الاتصال بالسيرفر أثناء حفظ الاستبعاد.",
        "error"
      );

    } finally {
      setLoading(false);
    }
  }

  async function loadEditEvent() {
    msg(
      "جارِ تحميل حدث الاستبعاد للتعديل...",
      "info"
    );

    if (btn) {
      btn.disabled =
        true;
    }

    const {
      r,
      data,
      authRequired
    } =
      await sessionFetchJson(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`
      );

    if (authRequired) {
      return false;
    }

    if (
      !r.ok ||
      data?.ok !== true ||
      !data?.event
    ) {
      throw new Error(
        data?.message ||
        "تعذّر تحميل حدث الاستبعاد للتعديل."
      );
    }

    const ev =
      data.event;

    if (
      ev.typeKey !==
      "cull"
    ) {
      throw new Error(
        "الحدث المطلوب ليس حدث استبعاد."
      );
    }

    if (
      ev.editPolicy
        ?.editable !== true
    ) {
      throw new Error(
        ev.editPolicy
          ?.reason ||
        "هذا الحدث غير متاح للتعديل."
      );
    }

    animalEl.value =
      ev.animalNumber ||
      "";

    animalEl.readOnly =
      true;

    eventDateEl.value =
      ev.data?.eventDate ||
      ev.eventDate ||
      "";

    eventDateEl.disabled =
      true;

    fillMainOptions(
      ev.data?.cullMain ||
      ""
    );

    mainEl.value =
      ev.data?.cullMain ||
      "";

    fillDetails(
      ev.data?.cullDetail ||
      ""
    );

    notesEl.value =
      ev.data?.notes ||
      "";

    renderPerformers(
      data.correctionPerformers ||
      []
    );

    if (editToolsCard) {
      editToolsCard.hidden =
        false;

      editToolsCard.style.display =
        "";
    }

    correctionPerformedByEl.required =
      true;

    correctionReasonEl.required =
      true;

    if (pageTitle) {
      pageTitle.textContent =
        "تعديل الاستبعاد";
    }

    document.title =
      "تعديل الاستبعاد — مُرَبِّيك";

    if (backLink) {
      backLink.href =
        `event-list.html?number=${encodeURIComponent(ev.animalNumber || "")}`;
    }

    cullGateAllowed =
      true;

    if (btn) {
      btn.disabled =
        false;

      btn.textContent =
        "حفظ التعديل";
    }

    msg(
      "يمكن تعديل سبب الاستبعاد الرئيسي والتفصيلي والملاحظات فقط. رقم الحيوان وتاريخ الاستبعاد ثابتان.",
      "success"
    );

    return true;
  }

  async function saveCorrection() {
    const animalNumber =
      String(
        animalEl?.value ||
        ""
      ).trim();

    const eventDate =
      String(
        eventDateEl?.value ||
        ""
      ).slice(0, 10);

    const cullMain =
      String(
        mainEl?.value ||
        ""
      ).trim();

    const cullDetail =
      String(
        detailEl?.value ||
        ""
      ).trim();

    const notes =
      String(
        notesEl?.value ||
        ""
      ).trim();

    const performedBy =
      String(
        correctionPerformedByEl
          ?.value ||
        ""
      ).trim();

    const correctionReason =
      String(
        correctionReasonEl
          ?.value ||
        ""
      ).trim();

    if (
      !animalNumber ||
      !eventDate
    ) {
      msg(
        "❌ تعذّر تحديد حدث الاستبعاد المطلوب تعديله.",
        "error"
      );

      return;
    }

    if (!cullMain) {
      msg(
        "⚠️ اختر سبب الاستبعاد الرئيسي.",
        "warning"
      );

      return;
    }

    if (!cullDetail) {
      msg(
        "⚠️ اختر تفصيل سبب الاستبعاد.",
        "warning"
      );

      return;
    }

    if (!performedBy) {
      msg(
        "❌ أدخل اسم القائم بالتعديل.",
        "error"
      );

      return;
    }

    if (!correctionReason) {
      msg(
        "❌ اكتب سبب التعديل.",
        "error"
      );

      return;
    }

    try {
      setLoading(true);

      msg(
        "جارِ حفظ تعديل الاستبعاد...",
        "info"
      );

      const {
        r,
        data,
        authRequired
      } =
        await sessionFetchJson(
          `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
          {
            method: "POST",

            body: {
              animalNumber,
              eventDate,
              cullMain,
              cullDetail,
              notes,
              correctionPerformedBy:
                performedBy,
              correctionReason
            }
          }
        );

      if (authRequired) {
        return;
      }

      if (
        !r.ok ||
        data?.ok !== true
      ) {
        msg(
          data?.message ||
          "❌ تعذّر تعديل حدث الاستبعاد.",
          "error"
        );

        return;
      }

      msg(
        data?.message ||
        "✅ تم تعديل حدث الاستبعاد بنجاح.",
        "success"
      );

      setTimeout(() => {
        location.href =
          `event-list.html?number=${encodeURIComponent(animalNumber)}`;
      }, 900);

    } catch (e) {
      console.error(
        "cull correction failed",
        e
      );

      msg(
        "❌ فشل الاتصال بالسيرفر أثناء تعديل الاستبعاد.",
        "error"
      );

    } finally {
      setLoading(false);
    }
  }

  mainEl
    ?.addEventListener(
      "change",
      () => {
        fillDetails();
      }
    );

  openBtn
    ?.addEventListener(
      "click",
      () => {
        const n =
          String(
            animalEl?.value ||
            ""
          ).trim();

        if (!n) return;

        location.href =
          `cow-card.html?number=${encodeURIComponent(n)}`;
      }
    );

  form
    ?.addEventListener(
      "submit",
      e => {
        e.preventDefault();

        if (isEditMode) {
          saveCorrection();
          return;
        }

        if (requestedEditMode) {
          msg(
            "❌ رابط تعديل الاستبعاد غير مكتمل.",
            "error"
          );

          return;
        }

        saveCull();
      }
    );

  async function init() {
    try {
      const optionsOk =
        await loadCullOptions();

      if (!optionsOk) {
        if (btn) {
          btn.disabled =
            true;
        }

        return;
      }

      if (requestedEditMode) {
        if (!editEventId) {
          throw new Error(
            "رابط تعديل الاستبعاد غير مكتمل."
          );
        }

        await loadEditEvent();

        return;
      }

      initFromUrl();
      await runCullGate();

    } catch (e) {
      console.error(
        "cull page init failed",
        e
      );

      if (btn) {
        btn.disabled =
          true;
      }

      msg(
        e.message ||
        "❌ تعذّر تجهيز صفحة الاستبعاد.",
        "error"
      );
    }
  }

  init();
})();
</script>
</body>
</html>
