<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تحضير للولادة — مُرَبِّك</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
 
  <link rel="stylesheet" href="css/forms.css">

 
</head>
<body>
 <header>
  <div class="mbk-head">
    <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
    <div class="mbk-center">
      <div class="mbk-page-title">التحضير للولادة</div>
      <div class="mbk-app-name">مُرَبِّيك</div>
    </div>
    <a class="mbk-back" href="add-event.html">رجوع</a>
  </div>
</header>

<div id="sysbar" class="infobar" role="status" aria-live="polite"></div>
 <main class="mbk-form">
  <form id="closeupForm" class="mbk-card">
    <label for="animalNumber">رقم الحيوان / الحيوانات</label>
<input id="animalNumber" name="animalNumber" inputmode="text" autocomplete="off" required />

    <label for="eventDate">تاريخ التحضير</label>
    <input id="eventDate" name="eventDate" type="date" required />

    <fieldset>
      <legend>عليقة التحضير</legend>
      <div class="radio-group">
        <label><input type="radio" name="ration" value="نعم" required> نعم</label>
        <label><input type="radio" name="ration" value="لا" required> لا</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>الأملاح الأنيونية</legend>
      <div class="radio-group">
        <label><input type="radio" name="anionicSalts" value="نعم" required> نعم</label>
        <label><input type="radio" name="anionicSalts" value="لا" required> لا</label>
      </div>
    </fieldset>

    <div class="actions-bar inline">
      <button class="save" id="saveBtn" type="submit">حفظ التحضير</button>
      <button class="ghost" id="openCowCard" type="button">فتح بطاقة الحيوان</button>
    </div>
  </form>
</main>

<div id="nutritionDialog" class="mbk-card hide" role="dialog" aria-modal="true" aria-labelledby="nd_t">
  <div class="card">
    <h3 id="nd_t">إدخال عليقة التحضير؟</h3>
    <p class="form-hint">يمكنك الانتقال الآن لصفحة التغذية لإدخال مكونات العليقة لهذا الحيوان.</p>
    <div class="actions-bar inline">
      <button type="button" id="nd_yes" class="save">نعم، انتقل الآن</button>
      <button type="button" id="nd_no" class="ghost">لاحقًا</button>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  const form = $("closeupForm");
  const inputAnimal = $("animalNumber");
  const inputDate = $("eventDate");
  const saveBtn = $("saveBtn");
  const openCowCardBtn = $("openCowCard");
  const dialog = $("nutritionDialog");
  const ndYes = $("nd_yes");
  const ndNo = $("nd_no");
  const sysbar = $("sysbar");

  let acceptedRows = [];
  let rejectedRows = [];
  let gateOk = false;
  let gateTimer = null;
  let lastSavedRows = [];

  function normalizeDigits(v){
    const map = {
      "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
      "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
      "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
      "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
    };

    return String(v || "")
      .replace(/[٠-٩۰-۹]/g, d => map[d] || d);
  }

  function splitNumbers(raw){
    return [...new Set(
      normalizeDigits(raw)
        .split(/[\s,،;]+/g)
        .map(v => v.trim().replace(/[^\d]/g, ""))
        .filter(Boolean)
    )];
  }

  function numbersText(raw){
    return splitNumbers(raw).join(", ");
  }

  function todayISO(){
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }

  function getQS(name){
    return new URL(location.href).searchParams.get(name) || "";
  }

  function firstNonEmpty(...vals){
    return vals.find(v => String(v || "").trim() !== "") || "";
  }

  function buildUrl(path, params){
    const u = new URL(path, location.origin);

    Object.entries(params || {}).forEach(([k,v]) => {
      if (String(v || "").trim()) {
        u.searchParams.set(k, v);
      }
    });

    return u.toString();
  }

  function showMsg(text, ok){
    if (!sysbar) return;

    sysbar.textContent = text || "";
    sysbar.className =
      "infobar show " +
      (ok ? "success" : "error");

    try {
      sysbar.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    } catch(_){}
  }

  function hideMsg(){
    if (!sysbar) return;

    sysbar.textContent = "";
    sysbar.className = "infobar";
  }

  function getRadio(name){
    return form.querySelector(
      `input[name="${name}"]:checked`
    )?.value || "";
  }

  async function sessionPostJson(path, payload){
    const r = await fetch(path, {
      method: "POST",
      credentials: "same-origin",
      cache: "no-store",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload || {})
    });

    const j = await r.json().catch(() => ({
      ok: false,
      allowed: false,
      message: "تعذّر قراءة رد السيرفر."
    }));

    if (
      r.status === 401 ||
      j?.error === "auth_required"
    ) {
      showMsg(
        j?.message || "سجّل الدخول أولًا.",
        false
      );

      return {
        r,
        j,
        authRequired: true
      };
    }

    return {
      r,
      j,
      authRequired: false
    };
  }

  function setSaveEnabled(v){
    if (saveBtn) {
      saveBtn.disabled = !v;
    }
  }

  function setSaveLoading(v){
    if (!saveBtn) return;

    saveBtn.disabled = !!v;
    saveBtn.textContent =
      v
        ? "جارٍ الحفظ…"
        : "حفظ التحضير";
  }

  function resetGate(){
    acceptedRows = [];
    rejectedRows = [];
    gateOk = false;

    setSaveEnabled(false);
  }

  function renderGateResult(j = {}){
    acceptedRows =
      Array.isArray(j.accepted)
        ? j.accepted
        : [];

    rejectedRows =
      Array.isArray(j.rejected)
        ? j.rejected
        : [];

    gateOk = acceptedRows.length > 0;

    setSaveEnabled(gateOk);

    if (
      acceptedRows.length === 1 &&
      rejectedRows.length === 0
    ) {
      showMsg(
        j.message ||
        `✅ الحيوان رقم ${acceptedRows[0].animalNumber} مؤهل لتسجيل تحضير الولادة.`,
        true
      );

      return;
    }

    if (
      acceptedRows.length === 0 &&
      rejectedRows.length === 1
    ) {
      showMsg(
        rejectedRows[0].reason ||
        j.message ||
        "❌ الحيوان غير مؤهل لتسجيل تحضير الولادة.",
        false
      );

      return;
    }

    let msg =
      `نتيجة التحقق:\n` +
      `المؤهل: ${acceptedRows.length}\n` +
      `غير المؤهل: ${rejectedRows.length}`;

    if (acceptedRows.length) {
      msg += "\n\n✅ المؤهل:";

      msg += "\n" + acceptedRows
        .map(row => row.animalNumber)
        .join("، ");
    }

    if (rejectedRows.length) {
      msg += "\n\n❌ غير المؤهل:";

      msg += "\n" + rejectedRows
        .map(row =>
          `${row.animalNumber || "-"} — ${row.reason || "غير مؤهل"}`
        )
        .join("\n");
    }

    showMsg(msg, gateOk);
  }

  async function runGate(){
    const animalNumbers =
      numbersText(inputAnimal.value);

    const eventDate =
      String(inputDate.value || "").trim();

    resetGate();

    if (!animalNumbers || !eventDate) {
      hideMsg();
      return false;
    }

    try {
      const {
        r,
        j,
        authRequired
      } = await sessionPostJson(
        "/api/close-up/gate",
        {
          animalNumbers,
          eventDate
        }
      );

      if (authRequired) return false;

      renderGateResult(j || {});

      return Boolean(
        r.ok &&
        j?.ok === true &&
        j?.allowed === true &&
        acceptedRows.length
      );

    } catch(e) {
      console.error(
        "close-up gate error:",
        e
      );

      resetGate();

      showMsg(
        "تعذّر التحقق من تحضير الولادة الآن.",
        false
      );

      return false;
    }
  }

  function scheduleGate(){
    clearTimeout(gateTimer);

    gateTimer =
      setTimeout(runGate, 350);
  }

  async function saveCloseup(e){
    e.preventDefault();

    const animalNumbers =
      numbersText(inputAnimal.value);

    const eventDate =
      String(inputDate.value || "").trim();

    const ration =
      getRadio("ration");

    const anionicSalts =
      getRadio("anionicSalts");

    if (!animalNumbers) {
      return showMsg(
        "❌ رقم الحيوان مطلوب.",
        false
      );
    }

    if (!eventDate) {
      return showMsg(
        "❌ تاريخ التحضير مطلوب.",
        false
      );
    }

    if (!ration) {
      return showMsg(
        "❌ يجب تحديد هل تم تقديم عليقة التحضير.",
        false
      );
    }

    if (!anionicSalts) {
      return showMsg(
        "❌ يجب تحديد هل تم استخدام الأملاح الأنيونية.",
        false
      );
    }

    try {
      setSaveLoading(true);

      if (
        !gateOk ||
        !acceptedRows.length
      ) {
        const allowed =
          await runGate();

        if (!allowed) return;
      }

      const {
        r,
        j,
        authRequired
      } = await sessionPostJson(
        "/api/close-up/save",
        {
          animalNumbers,
          accepted: acceptedRows,
          eventDate,
          ration,
          anionicSalts
        }
      );

      if (authRequired) return;

      if (!r.ok || !j.ok) {
        let msg =
          j.message ||
          "تعذّر حفظ تحضير الولادة.";

        if (
          Array.isArray(j.rejected) &&
          j.rejected.length
        ) {
          msg += "\n\nلم تُحفظ:";

          msg += "\n" + j.rejected
            .map(row =>
              `${row.animalNumber || "-"} — ${row.reason || ""}`
            )
            .join("\n");
        }

        throw new Error(msg);
      }

      lastSavedRows =
        Array.isArray(j.saved)
          ? j.saved
          : [];

      let msg =
        j.message ||
        "✅ تم حفظ تحضير الولادة بنجاح.";

      if (
        Array.isArray(j.rejected) &&
        j.rejected.length
      ) {
        msg += "\n\nلم تُحفظ:";

        msg += "\n" + j.rejected
          .map(row =>
            `${row.animalNumber || "-"} — ${row.reason || ""}`
          )
          .join("\n");
      }

      showMsg(msg, true);

      const firstSaved =
        lastSavedRows[0]?.animalNumber ||
        acceptedRows[0]?.animalNumber ||
        splitNumbers(inputAnimal.value)[0] ||
        "";

      if (
        ration === "نعم" &&
        lastSavedRows.length === 1
      ) {
        dialog.classList.remove("hide");
        return;
      }

      setTimeout(() => {
        if (j.redirectUrl) {
          location.href = j.redirectUrl;
          return;
        }

        if (
          lastSavedRows.length === 1 &&
          firstSaved
        ) {
          location.href =
            `/event-list.html?number=${encodeURIComponent(firstSaved)}`;

          return;
        }

        location.href = "dashboard.html";
      }, 900);

    } catch(err) {
      console.error(
        "close-up save error:",
        err
      );

      showMsg(
        err.message ||
        "تعذّر حفظ تحضير الولادة.",
        false
      );

    } finally {
      setSaveLoading(false);
    }
  }

  const qsAnimal = firstNonEmpty(
    getQS("numbers"),
    getQS("animalNumbers"),
    getQS("bulk"),
    getQS("animalId"),
    getQS("number"),
    getQS("animalNumber")
  );

  const qsDate = firstNonEmpty(
    getQS("date"),
    getQS("eventDate"),
    todayISO()
  );

  if (inputAnimal && qsAnimal) {
    inputAnimal.value =
      numbersText(qsAnimal);
  }

  if (inputDate && qsDate) {
    inputDate.value = qsDate;
  }

  setSaveEnabled(false);
  scheduleGate();

  inputAnimal?.addEventListener(
    "input",
    scheduleGate
  );

  inputDate?.addEventListener(
    "change",
    scheduleGate
  );

  form?.addEventListener(
    "submit",
    saveCloseup
  );

  openCowCardBtn?.addEventListener(
    "click",
    () => {
      const n =
        splitNumbers(inputAnimal.value)[0] ||
        "";

      if (!n) return;

      location.href =
        `/cow-card.html?number=${encodeURIComponent(n)}`;
    }
  );

  ndYes?.addEventListener(
    "click",
    () => {
      const n =
        lastSavedRows[0]?.animalNumber ||
        splitNumbers(inputAnimal.value)[0] ||
        "";

      const d =
        String(inputDate.value || "").trim();

      location.href =
        buildUrl(
          "/nutrition.html",
          {
            animalId: n,
            number: n,
            date: d
          }
        );
    }
  );

  ndNo?.addEventListener(
    "click",
    () => {
      const n =
        lastSavedRows[0]?.animalNumber ||
        splitNumbers(inputAnimal.value)[0] ||
        "";

      dialog.classList.add("hide");

      if (n) {
        location.href =
          `/event-list.html?number=${encodeURIComponent(n)}`;

        return;
      }

      location.href = "dashboard.html";
    }
  );
})();
</script>
</body>
</html>
