<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="heat">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل شياع — مُرَبِّيك</title>

  <link rel="stylesheet" href="css/forms.css" />

</head>

<body data-page="heat">

  <header>
    <div class="mbk-head">
      <a class="mbk-back" href="add-event.html" title="رجوع">رجوع</a>

      <div class="mbk-center">
        <div class="mbk-page-title">تسجيل شياع</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>

      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
    </div>
  </header>

  <!-- infobar -->
  <div id="sysbar" class="infobar"></div>

  <div class="wrap">

   <form id="heatForm" class="mbk-card" novalidate>

      <!-- Hidden: علشان forms-init يحقن animalId -->
      <input id="animalId" data-field="animalId" type="hidden" />

      <label>رقم الحيوان</label>
     <textarea id="animalNumber" data-field="animalNumber" rows="3" style="width:100%"></textarea>
     <div class="form-hint">يمكن إدخال رقم واحد أو عدة أرقام مفصولة بفاصلة أو مسافة.</div>

      <label>تاريخ الشياع</label>
      <input id="eventDate" data-field="eventDate" type="date" />
<label>وقت ملاحظة الشياع</label>
<div class="radio-group">
  <label>
    <input type="radio" name="heatTime" data-field="heatTime" value="صباحا" />
    صباحًا
  </label>

  <label>
    <input type="radio" name="heatTime" data-field="heatTime" value="مساءا" />
    مساءً
  </label>
</div>

      <label>الحالة التناسلية الحالية</label>
      <input id="reproStatus" data-field="reproductiveStatusSnapshot" readonly />

      <label>أيام الحليب (DIM)</label>
      <input id="dim" data-field="dimAtEvent" readonly />
      <label>عدد الأيام منذ آخر شياع / تلقيح</label>
<input id="daysSinceLastHeatOrAI" readonly />
      <label>ملاحظات</label>
<textarea id="notes" data-field="notes" rows="3" placeholder="اختياري"></textarea>

<div class="row" id="editToolsRow" style="display:none">
  <div>
    <label>القائم بالتعديل</label>

    <input
      id="correctionPerformedBy"
      type="text"
      maxlength="160"
      list="correctionPerformersList"
      placeholder="اسم الفني أو الطبيب"
      autocomplete="off"
    />

    <datalist id="correctionPerformersList"></datalist>

    <small class="form-hint">
      يُستخدم نفس دليل الفنيين والأطباء في مُرَبِّيك.
    </small>
  </div>

  <div>
    <label>سبب التعديل</label>

    <input
      id="correctionReason"
      type="text"
      maxlength="500"
      placeholder="اكتب سبب تصحيح بيانات الشياع"
    />

    <small class="form-hint">
      يُحفظ سبب التعديل داخل سجل التصحيحات.
    </small>
  </div>
</div>

<!-- زر داخلي مخفي فقط للتوافق لو احتجناه -->
      <button type="submit" id="saveBtn" style="display:none"></button>
    </form>
  </div>

 <div class="actions-bar">
    <!-- ✅ زر الحفظ = submit (بدون onclick) -->
   <button id="saveBtnUI" class="save" type="submit" form="heatForm">✅ تسجيل الشياع</button>
   <button id="openCowCard" class="ghost" type="button">🧾 بطاقة الحيوان</button>
  </div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  const form = $("heatForm");
  const bar = $("sysbar");
  const animalEl = $("animalNumber");
  const dateEl = $("eventDate");
  const saveBtn = $("saveBtnUI");
const openCowCardBtn = $("openCowCard");

const p = new URLSearchParams(location.search);

const requestedEditMode =
  String(p.get("mode") || "")
    .trim()
    .toLowerCase() === "edit";

const editEventId =
  String(p.get("eventId") || "").trim();

const isEditMode =
  requestedEditMode && !!editEventId;

const correctionPerformedByEl =
  $("correctionPerformedBy");

const correctionPerformersListEl =
  $("correctionPerformersList");

let gateTimer = null;
  let gateState = {
    allowed: false,
    animalNumbers: [],
    results: []
  };

  function normDigits(v){
    const map = {
      "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
      "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
    };

    return String(v || "")
      .trim()
      .replace(/[٠-٩۰-۹]/g, d => map[d] || d);
  }

  function splitNumbers(v){
    return String(v || "")
      .split(/[\s,،;]+/)
      .map(x => normDigits(x).replace(/[^\d]/g, ""))
      .filter(Boolean);
  }

  function todayISO(){
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }

  function getQS(name){
    return new URL(location.href).searchParams.get(name) || "";
  }

  

function msg(text, ok=false, actionUrl="", actionLabel="الذهاب لتأكيد الحمل الآن"){
  if (!bar) return;

  bar.className = "infobar show " + (ok ? "success" : "error");
  bar.style.display = "block";

  const safeText = String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  const safeActionLabel = String(actionLabel || "متابعة")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  bar.innerHTML = `
    <div style="display:grid;gap:10px;text-align:center;line-height:1.7;font-weight:900">
      <div style="white-space:pre-line">${safeText}</div>
      ${
        actionUrl
          ? `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
                <button type="button" id="heatGateActionBtn"
                  style="width:auto;min-width:170px;padding:9px 18px;border-radius:999px;border:2px solid #0b7f47;background:#fff;color:#0b7f47;font-weight:900;cursor:pointer">
                  ${safeActionLabel}
                </button>

                <button type="button" id="heatGateLaterBtn"
                  style="width:auto;min-width:110px;padding:9px 18px;border-radius:999px;border:2px solid #777;background:#fff;color:#555;font-weight:900;cursor:pointer">
                  لاحقًا
                </button>
             </div>`
          : ""
      }
    </div>
  `;

  if (actionUrl) {
    bar.querySelector("#heatGateActionBtn")?.addEventListener("click", () => {
      location.href = actionUrl;
    });

    bar.querySelector("#heatGateLaterBtn")?.addEventListener("click", () => {
      bar.style.display = "none";
    });
  }

  try { bar.scrollIntoView({ behavior:"smooth", block:"start" }); } catch(_){}
}
  function clearMsg(){
    if (!bar) return;
    bar.className = "infobar";
    bar.textContent = "";
  }

  function getHeatTime(){
  return form.querySelector('input[name="heatTime"]:checked')?.value || "";
}

function setHeatTime(value){
  const raw =
    String(value || "")
      .trim()
      .replace(/[ًٌٍَُِّْ]/g, "")
      .replace(/\s+/g, "");

  const wanted =
    raw === "ص" || raw.includes("صباح")
      ? "صباحا"
      : (
          raw === "م" || raw.includes("مساء")
            ? "مساءا"
            : ""
        );

  if (!wanted) return;

  const target =
    form.querySelector(
      `input[name="heatTime"][value="${wanted}"]`
    );

  if (target) {
    target.checked = true;
  }
}

function renderCorrectionPerformers(items = []){
  if (!correctionPerformersListEl) return;

  const values =
    [...new Set(
      (Array.isArray(items) ? items : [])
        .map(x => String(x || "").trim())
        .filter(Boolean)
    )];

  correctionPerformersListEl.replaceChildren(
    ...values.map(value => {
      const option =
        document.createElement("option");

      option.value = value;

      return option;
    })
  );
}

async function loadEditEvent(){
  if (!editEventId) {
    msg(
      "❌ تعذّر تحديد حدث الشياع المطلوب تعديله.",
      false
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }

    return;
  }

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
    }

    if (animalEl) {
      animalEl.readOnly = true;
    }

    const r =
      await fetch(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`,
        {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

    const data =
      await r.json().catch(() => ({
        ok: false,
        message:
          "تعذّر قراءة بيانات الشياع."
      }));

    if (
      r.status === 401 ||
      data?.error === "auth_required"
    ) {
      msg(
        data?.message ||
          "سجّل الدخول أولًا.",
        false
      );

      return;
    }

    if (
      !r.ok ||
      !data?.ok ||
      !data?.event
    ) {
      msg(
        data?.message ||
          "❌ تعذّر تحميل بيانات الشياع للتعديل.",
        false
      );

      return;
    }

    if (
      String(
        data.event.typeKey || ""
      ).trim() !== "heat"
    ) {
      msg(
        "❌ الحدث المحدد ليس حدث شياع.",
        false
      );

      return;
    }

    if (
      data.event?.editPolicy?.editable !== true
    ) {
      msg(
        data.event?.editPolicy?.reason ||
          "❌ هذا الحدث غير متاح للتعديل.",
        false
      );

      return;
    }

    renderCorrectionPerformers(
      data.correctionPerformers
    );

    const ev =
      data.event;

    const d =
      ev.data || {};

    if (animalEl) {
      animalEl.value =
        String(
          ev.animalNumber || ""
        ).trim();

      animalEl.readOnly = true;
    }

    if (dateEl) {
      dateEl.value =
        String(
          d.eventDate ||
          ev.eventDate ||
          ""
        )
          .trim()
          .slice(0, 10);
    }

    setHeatTime(
      d.heatTime || ""
    );

    if ($("notes")) {
      $("notes").value =
        String(
          d.notes || ""
        );
    }

    clearContextFields();

    const editToolsRow =
      $("editToolsRow");

    const correctionReasonEl =
      $("correctionReason");

    if (editToolsRow) {
      editToolsRow.style.display = "";
    }

    if (correctionPerformedByEl) {
      correctionPerformedByEl.required = true;
    }

    if (correctionReasonEl) {
      correctionReasonEl.required = true;
    }

    const title =
      document.querySelector(
        ".mbk-page-title"
      );

    if (title) {
      title.textContent =
        "تعديل شياع";
    }

    document.title =
      "تعديل شياع — مُرَبِّيك";

    if (saveBtn) {
      saveBtn.textContent =
        "حفظ التعديل ✅";

      saveBtn.disabled = false;
    }

    const back =
      document.querySelector(
        ".mbk-back"
      );

    if (back) {
      back.href =
        `event-list.html?number=${encodeURIComponent(
          ev.animalNumber || ""
        )}`;
    }

    clearMsg();

  } catch(err) {
    console.error(
      "heat edit load failed:",
      err
    );

    msg(
      "❌ تعذّر تحميل بيانات الشياع للتعديل.",
      false
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }
  }
}

async function postJson(url, body){
  const r = await fetch(url, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify(body || {})
  });

  const j = await r.json().catch(() => ({}));

  if (r.status === 401 || j?.error === "auth_required") {
    const err = new Error(j.message || "سجّل الدخول أولًا.");
    err.payload = j;
    throw err;
  }

  if (!r.ok) {
    const err = new Error(j.message || "تعذّر الاتصال بالسيرفر.");
    err.payload = j;
    throw err;
  }

  return j;
}

async function getContextSingle(number, eventDate){
  const q =
    `/api/heat/context?animalNumber=${encodeURIComponent(number)}` +
    `&eventDate=${encodeURIComponent(eventDate)}`;

  const r = await fetch(q, {
    method: "GET",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Accept": "application/json"
    }
  });

  return await r.json().catch(() => ({}));
}
  function clearContextFields(){
    if ($("animalId")) $("animalId").value = "";
    if ($("reproStatus")) $("reproStatus").value = "";
    if ($("dim")) $("dim").value = "";
    if ($("daysSinceLastHeatOrAI")) $("daysSinceLastHeatOrAI").value = "";
  }

  async function loadContextAfterGate(){
    const nums = splitNumbers(animalEl.value);
    const eventDate = String(dateEl.value || "").slice(0,10);

    if (nums.length !== 1 || !eventDate) {
      clearContextFields();
      return;
    }

    try {
      const res = await getContextSingle(nums[0], eventDate);

      if (!res?.ok) {
        clearContextFields();
        return;
      }

      if ($("animalId")) $("animalId").value = String(res.animalId || "");
      if ($("reproStatus")) $("reproStatus").value = String(res.reproductiveStatus || "");
      if ($("dim")) $("dim").value = res.dimAtEvent == null ? "" : String(res.dimAtEvent);
      if ($("daysSinceLastHeatOrAI")) {
        $("daysSinceLastHeatOrAI").value =
          res.daysSinceLastHeatOrAI == null ? "" : String(res.daysSinceLastHeatOrAI);
      }

    } catch(e) {
      console.error("heat context failed:", e);
      clearContextFields();
    }
  }

  async function runGate(){
  if (requestedEditMode) return;

  const raw = String(animalEl.value || "").trim();
    const eventDate = String(dateEl.value || "").slice(0,10);

    gateState = { allowed:false, animalNumbers:[], results:[] };
    if (saveBtn) saveBtn.disabled = true;

    if (!raw || !eventDate) {
      clearContextFields();
      clearMsg();
      return;
    }

    try {
      const res = await postJson("/api/heat/gate", {
        animalNumber: raw,
        eventDate
      });

      gateState = {
        allowed: !!res.allowed,
        animalNumbers: Array.isArray(res.animalNumbers) ? res.animalNumbers : [],
        results: Array.isArray(res.results) ? res.results : []
      };

if (!res.allowed) {
  const preview = gateState.results
    .slice(0,5)
    .map(x => `${x.animalNumber}: ${x.message}`)
    .join(" — ");

 msg(
  preview || res.message || "❌ لا يوجد أي رقم مؤهل لتسجيل الشياع.",
  false,
  res.redirectUrl || ""
);
clearContextFields();
return;
}
     // لا نغيّر أرقام المستخدم هنا؛ السيرفر وحده يقرر المقبول والمرفوض.

      const rejected = Array.isArray(res.rejected) ? res.rejected : [];
      const suffix = rejected.length
        ? ` — تم استبعاد ${rejected.length}: ${rejected.slice(0,3).map(x => x.animalNumber).join("، ")}${rejected.length > 3 ? "…" : ""}`
        : "";

      msg((res.message || "✅ تم التحقق — يمكن تسجيل الشياع.") + suffix, true);

      if (saveBtn) saveBtn.disabled = false;
      await loadContextAfterGate();

} catch(e) {
  console.error("heat gate failed:", e);

  const payload = e?.payload || {};

  msg(
    payload.message || e.message || "تعذّر التحقق من الشياع الآن.",
    false,
    payload.redirectUrl || ""
  );

  clearContextFields();
}
}
  function scheduleGate(){
  if (requestedEditMode) return;

  clearTimeout(gateTimer);
  gateTimer = setTimeout(runGate, 350);
}

async function saveHeat(e){
  e.preventDefault();

  const raw = String(animalEl.value || "").trim();
  const eventDate = String(dateEl.value || "").slice(0,10);
  const heatTime = getHeatTime();
  const notes = String($("notes")?.value || "").trim();

  if (!raw) return msg("❌ رقم الحيوان مطلوب.", false);
if (!eventDate) return msg("❌ تاريخ الشياع مطلوب.", false);
if (!heatTime) return msg("❌ وقت ملاحظة الشياع مطلوب.", false);

if (requestedEditMode) {
  if (!isEditMode) {
    return msg(
      "❌ تعذّر تحديد حدث الشياع المطلوب تعديله.",
      false
    );
  }

  const correctionPerformedBy =
    String(
      correctionPerformedByEl?.value || ""
    ).trim();

  if (!correctionPerformedBy) {
    msg(
      "❌ أدخل اسم القائم بالتعديل.",
      false
    );

    correctionPerformedByEl?.focus?.();

    return;
  }

  const correctionReason =
    String(
      $("correctionReason")?.value || ""
    ).trim();

  if (!correctionReason) {
    msg(
      "❌ اكتب سبب التعديل.",
      false
    );

    $("correctionReason")?.focus?.();

    return;
  }

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent =
        "جارٍ حفظ التعديل…";
    }

    const res =
      await postJson(
        `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
        {
          animalNumber: raw,
          eventDate,
          heatTime,
          notes: notes || null,
          correctionPerformedBy,
          correctionReason
        }
      );

    msg(
      res.message ||
        "✅ تم تعديل الشياع بنجاح.",
      true
    );

    setTimeout(() => {
      location.href =
        `event-list.html?number=${encodeURIComponent(raw)}`;
    }, 1000);

  } catch(err) {
    console.error(
      "heat correction failed:",
      err
    );

    const payload =
      err?.payload || {};

    msg(
      payload.message ||
        err.message ||
        "❌ تعذّر حفظ تعديل الشياع الآن.",
      false
    );

  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent =
        "حفظ التعديل ✅";
    }
  }

  return;
}

try {
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.textContent = "جارٍ الحفظ…";
    }

    if (!gateState.allowed) {
      await runGate();
      if (!gateState.allowed) return;
    }

    const res = await postJson("/api/heat/save", {
      animalNumber: animalEl.value,
      eventDate,
      heatTime,
      notes: notes || null
    });

    const action = res.postSaveAction || {};
    const actionUrl = String(action.url || res.inseminationRedirectUrl || "").trim();
    const actionLabel = String(action.label || "تسجيل التلقيح الآن").trim();

    if (actionUrl) {
      msg(
        res.message || "✅ تم حفظ الشياع بنجاح\n\nهل تريد تسجيل التلقيح الآن؟",
        true,
        actionUrl,
        actionLabel
      );
      return;
    }

    msg(res.message || "✅ تم حفظ الشياع بنجاح", true);

  } catch(err) {
    console.error(err);
    msg(err.message || "❌ حدث خطأ أثناء الحفظ.", false);
  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = "✅ تسجيل الشياع";
    }
  }
}


const bulk =
  String(
    p.get("bulk") ||
    p.get("numbers") ||
    p.get("animalNumbers") ||
    ""
  ).trim();

const num =
  bulk ||
  String(
    p.get("number") ||
    p.get("animalNumber") ||
    p.get("animalId") ||
    ""
  ).trim();

const dt =
  String(p.get("date") || p.get("eventDate") || todayISO())
    .slice(0,10);

  if (animalEl) animalEl.value = num;
  if (dateEl) dateEl.value = dt;

  animalEl?.addEventListener("input", scheduleGate);
  animalEl?.addEventListener("blur", runGate);
  dateEl?.addEventListener("change", scheduleGate);
  form?.addEventListener("submit", saveHeat);

  openCowCardBtn?.addEventListener("click", () => {
    const nums = splitNumbers(animalEl.value);
    if (!nums.length) return msg("⚠️ لم يتم تمرير رقم الحيوان.", false);
    if (nums.length > 1) return msg("⚠️ بطاقة الحيوان تعمل مع رقم واحد فقط.", false);
    location.href = `cow-card.html?number=${encodeURIComponent(nums[0])}`;
  });

 if (requestedEditMode) {
  if (!editEventId) {
    msg(
      "❌ رابط تعديل الشياع غير مكتمل.",
      false
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }

  } else {
    loadEditEvent();
  }

} else {
  scheduleGate();
}

})();
</script>

</body>
</html>
