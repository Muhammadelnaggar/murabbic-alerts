<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="weaning">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل الفطام — مُرَبِّيك</title>
  <link rel="stylesheet" href="css/forms.css" />
 
</head>
<body>
<header>
  <div class="mbk-head">
    <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
    <div class="mbk-center">
      <div class="mbk-page-title" id="pageTitle">تسجيل الفطام</div>
      <div class="mbk-app-name">مُرَبِّيك</div>
    </div>
    <a class="mbk-back" id="backLink" href="add-event.html">رجوع</a>
  </div>
</header>

<main class="mbk-form">
  <div id="info" class="infobar"></div>
  <form id="weaningForm" data-event="فطام" novalidate>

    <section class="mbk-card">
     <div class="field">
  <label for="animalNumber">رقم الحيوان</label>
  <textarea id="animalNumber" data-field="animalNumber"></textarea>
</div>
      <div class="field">
        <label for="eventDate">تاريخ الفطام</label>
        <input id="eventDate" data-field="eventDate" type="date" />
      </div>

      <div class="field" id="singleAgeWrap" hidden>
        <label for="weaningAgeDays">عمر الفطام (يوم)</label>
        <input id="weaningAgeDays" data-field="weaningAgeDays" type="number" readonly />
      </div>
      <div class="field" id="weaningWeightWrap">
  <label for="weaningWeightKg">وزن الفطام (كجم)</label>
  <input id="weaningWeightKg" data-field="weaningWeightKg" type="number" min="0" step="0.1" placeholder="اختياري" />
</div>
<div class="field" id="bulkWeightsWrap" hidden>
  <label>أوزان الفطام للعجول المقبولة</label>

  <div id="bulkWeightsList"></div>

  <div class="form-hint">
    الوزن اختياري لكل عجل، ويُحفظ لكل عجل بشكل مستقل.
  </div>
</div>
      <div class="field" id="bulkAgeHint" hidden>
        <label>عمر الفطام</label>
       <div class="form-hint">سيتم حساب عمر الفطام تلقائيًا من السيرفر لكل حيوان حسب تاريخ الميلاد المسجل.</div>
      </div>

      <div class="field">
        <label for="notes">ملاحظات</label>
        <textarea id="notes" data-field="notes" rows="3" placeholder="اختياري"></textarea>
      </div>
      </section>

    <section class="mbk-card" id="editToolsCard" hidden>
      <div class="field">
        <label for="correctionPerformedBy">القائم بالتعديل</label>
        <input
          id="correctionPerformedBy"
          type="text"
          list="operationalPerformersList"
          maxlength="160"
          autocomplete="off"
          placeholder="اسم القائم بالتعديل"
        />
      </div>

      <div class="field">
        <label for="correctionReason">سبب التعديل</label>
        <input
          id="correctionReason"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="اكتب سبب تصحيح حدث الفطام"
        />
      </div>

      <datalist id="operationalPerformersList"></datalist>
    </section>

    <div class="actions-bar">
  <button class="save" id="saveBtn" type="submit">تسجيل الحدث</button>
  <button class="ghost" id="cardBtn" type="button">بطاقة الحيوان</button>
</div>
  </form>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const form = $("weaningForm");
  const info = $("info");
  const saveBtn = $("saveBtn");
  const cardBtn = $("cardBtn");
  const animalNumberEl = $("animalNumber");
  const eventDateEl = $("eventDate");
  const ageWrap = $("singleAgeWrap");
  const ageEl = $("weaningAgeDays");
  const bulkAgeHint = $("bulkAgeHint");

const weightWrap =
  $("weaningWeightWrap");

const weightEl =
  $("weaningWeightKg");

const bulkWeightsWrap =
  $("bulkWeightsWrap");

const bulkWeightsList =
  $("bulkWeightsList");

const notesEl =
  $("notes");

  const editToolsCard = $("editToolsCard");
  const correctionPerformedByEl = $("correctionPerformedBy");
  const correctionReasonEl = $("correctionReason");
  const operationalPerformersList = $("operationalPerformersList");
  const pageTitle = $("pageTitle");
  const backLink = $("backLink");

  const qs = new URLSearchParams(location.search);
  const requestedMode = String(
    qs.get("mode") ||
    qs.get("mbkMode") ||
    ""
  ).trim().toLowerCase();

  const requestedEditMode =
    requestedMode === "edit";

  const editEventId =
    String(
      qs.get("eventId") || ""
    ).trim();

  const isEditMode =
    requestedEditMode &&
    !!editEventId;

  const DIGITS = {
    "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
    "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
    "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
    "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
  };

  function toLatin(v){
    return String(v || "")
      .replace(
        /[٠-٩۰-۹]/g,
        d => DIGITS[d] || d
      );
  }

  function parseNumbers(raw){
    return [
      ...new Set(
        (
          toLatin(raw)
            .match(/\d+/g) ||
          []
        )
          .map(x =>
            x.replace(/\D/g, "")
          )
          .filter(Boolean)
      )
    ];
  }

  function todayISO(){
  const now =
    new Date(
      new Date().toLocaleString(
        "en-US",
        {
          timeZone:
            "Africa/Cairo"
        }
      )
    );

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      now.getDate()
    ).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

  const initialRaw =
    String(
      qs.get("numbers") ||
      qs.get("bulk") ||
      qs.get("animalNumbers") ||
      qs.get("selectedNumbers") ||
      qs.get("number") ||
      qs.get("animalNumber") ||
      ""
    ).trim();

  const initialNumbers =
    parseNumbers(initialRaw);

  const startsBulk =
    !requestedEditMode &&
    (
      requestedMode === "bulk" ||
      requestedMode === "group" ||
      initialNumbers.length > 1
    );

  const initialDate =
    String(
      qs.get("date") ||
      qs.get("eventDate") ||
      todayISO()
    ).slice(0, 10);

  let lastGate = null;
  let gateTimer = null;
  const bulkWeightsByNumber =
  new Map();

  function getCurrentNumbers(){
    return parseNumbers(
      animalNumberEl.value || ""
    );
  }

  function isBulkNow(){
    return (
      !requestedEditMode &&
      (
        startsBulk ||
        getCurrentNumbers().length > 1
      )
    );
  }
  function collectBulkWeightsFromUi(){
  if (!bulkWeightsList) return;

  bulkWeightsList
    .querySelectorAll(
      "[data-weaning-weight-number]"
    )
    .forEach(input => {
      const number =
        String(
          input.dataset
            .weaningWeightNumber ||
          ""
        ).trim();

      if (!number) return;

      bulkWeightsByNumber.set(
        number,
        String(
          input.value || ""
        ).trim()
      );
    });
}


function renderBulkWeights(
  accepted = []
){
  collectBulkWeightsFromUi();

  const bulk =
    isBulkNow();

  if (weightWrap) {
    weightWrap.hidden = bulk;
  }

  if (
    !bulkWeightsWrap ||
    !bulkWeightsList
  ) {
    return;
  }

  bulkWeightsList
    .replaceChildren();

  if (!bulk) {
    bulkWeightsWrap.hidden = true;
    return;
  }

  const rows =
    Array.isArray(accepted)
      ? accepted
      : [];

  bulkWeightsWrap.hidden =
    rows.length === 0;

  rows.forEach(row => {
    const animalNumber =
      String(
        row.animalNumber ||
        row.calfNumber ||
        row.number ||
        ""
      ).trim();

    if (!animalNumber) return;

    const ageDays =
      Number(
        row.weaningAgeDays
      );

    const field =
      document.createElement(
        "div"
      );

    field.className = "field";

    const label =
      document.createElement(
        "label"
      );

    label.textContent =
      Number.isFinite(ageDays)
        ? `العجل ${animalNumber} — العمر ${ageDays} يوم`
        : `العجل ${animalNumber}`;

    const input =
      document.createElement(
        "input"
      );

    input.type = "number";
    input.min = "0";
    input.step = "0.1";
    input.inputMode = "decimal";

    input.placeholder =
      "وزن الفطام (كجم) — اختياري";

    input.dataset
      .weaningWeightNumber =
        animalNumber;

    input.value =
      bulkWeightsByNumber.get(
        animalNumber
      ) || "";

    input.addEventListener(
      "input",
      () => {
        bulkWeightsByNumber.set(
          animalNumber,
          String(
            input.value || ""
          ).trim()
        );
      }
    );

    field.appendChild(label);
    field.appendChild(input);

    bulkWeightsList.appendChild(
      field
    );
  });
}


function currentBulkWeightsPayload(){
  collectBulkWeightsFromUi();

  const accepted =
    Array.isArray(
      lastGate?.accepted
    )
      ? lastGate.accepted
      : [];

  return accepted
    .map(row => {
      const animalNumber =
        String(
          row.animalNumber ||
          row.calfNumber ||
          row.number ||
          ""
        ).trim();

      if (!animalNumber) {
        return null;
      }

      return {
        animalNumber,

        weaningWeightKg:
          bulkWeightsByNumber.get(
            animalNumber
          ) || ""
      };
    })
    .filter(Boolean);
}

  function setMessage(
    text,
    type = "info"
  ){
    info.className =
      `infobar show ${type}`;

    info.textContent =
      String(text || "");

    info.style.whiteSpace =
      "pre-line";
  }

  function clearMessage(){
    info.className =
      "infobar";

    info.textContent =
      "";

    info.innerHTML =
      "";
  }

  function setMessageWithOk(
    text,
    type = "success",
    okLabel = "حسنًا",
    onOk = null
  ){
    info.className =
      `infobar show ${type}`;

    info.innerHTML =
      "";

    info.style.whiteSpace =
      "normal";

    const msg =
      document.createElement(
        "div"
      );

    msg.textContent =
      String(text || "");

    msg.style.whiteSpace =
      "pre-line";

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "mbk-weaning-ok-actions";

    const btn =
      document.createElement(
        "button"
      );

    btn.type =
      "button";

    btn.className =
      "mbk-weaning-ok-btn";

    btn.textContent =
      okLabel;

    btn.addEventListener(
      "click",
      () => {
        if (
          typeof onOk ===
          "function"
        ) {
          onOk();
        } else {
          clearMessage();
        }
      },
      { once:true }
    );

    actions.appendChild(btn);
info.appendChild(msg);
info.appendChild(actions);

requestAnimationFrame(() => {
  info.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
});
  }

  function setBusy(busy){
    if (saveBtn) {
      saveBtn.disabled =
        !!busy ||
        (
          !isEditMode &&
          !lastGate?.canSave
        );
    }

    if (cardBtn) {
      cardBtn.disabled =
        !!busy ||
        getCurrentNumbers()
          .length !== 1;
    }
  }

  function responseText(j = {}){
    return String(
      j?.message ||
      j?.ui?.message ||
      ""
    ).trim();
  }

  async function request(
    path,
    {
      method = "GET",
      body
    } = {}
  ){
    const options = {
      method,
      credentials:
        "same-origin",
      cache:
        "no-store",
      headers: {
        "Accept":
          "application/json"
      }
    };

    if (body !== undefined) {
      options.headers[
        "Content-Type"
      ] =
        "application/json";

      options.body =
        JSON.stringify(
          body || {}
        );
    }

    const r =
      await fetch(
        path,
        options
      );

    const j =
      await r
        .json()
        .catch(() => ({
          ok: false,
          canSave: false,
          message:
            "❌ رد السيرفر غير صالح."
        }));

    if (
      r.status === 401 ||
      j?.error ===
        "auth_required"
    ) {
      location.href =
        "login.html?next=" +
        encodeURIComponent(
          location.pathname +
          location.search
        );

      throw new Error(
        j?.message ||
        "❌ سجّل الدخول أولًا."
      );
    }

    return {
      httpStatus:
        r.status,
      ...j
    };
  }

  function renderPerformers(
    items = []
  ){
    operationalPerformersList
      .replaceChildren();

    [
      ...new Set(
        (
          Array.isArray(items)
            ? items
            : []
        )
          .map(x =>
            String(x || "")
              .trim()
          )
          .filter(Boolean)
      )
    ].forEach(name => {
      const option =
        document.createElement(
          "option"
        );

      option.value =
        name;

      operationalPerformersList
        .appendChild(option);
    });
  }

  function renderGate(j = {}){
    lastGate = j;

    const accepted =
      Array.isArray(j.accepted)
        ? j.accepted
        : [];

    const first =
      accepted[0] ||
      null;

    const bulk =
      isBulkNow();
      renderBulkWeights(accepted);

    ageWrap.hidden = bulk;

bulkAgeHint.hidden = !bulk;

    ageEl.value =
      !bulk &&
      first &&
      Number.isFinite(
        Number(
          first.weaningAgeDays
        )
      )
        ? String(
            first.weaningAgeDays
          )
        : "";

    if (saveBtn) {
      saveBtn.disabled =
        !j.canSave;
    }

    const nums =
      getCurrentNumbers();

    if (cardBtn) {
      cardBtn.disabled =
        nums.length !== 1;

      cardBtn.style.opacity =
        nums.length === 1
          ? "1"
          : ".6";

      cardBtn.style.pointerEvents =
        nums.length === 1
          ? "auto"
          : "none";
    }

    const text =
      responseText(j);

    if (text) {
      setMessage(
        text,
        j.canSave
          ? "success"
          : "error"
      );
    } else {
      clearMessage();
    }
  }

  async function runGate(
    { silent = false } = {}
  ){
    if (requestedEditMode) {
      return;
    }

    const numbers =
      getCurrentNumbers();

    const eventDate =
      String(
        eventDateEl.value ||
        ""
      ).slice(0, 10);

    if (
      !numbers.length ||
      !eventDate
    ) {
      lastGate = {
        canSave:false
      };

      saveBtn.disabled =
        true;

      if (!silent) {
        setMessage(
          "اكتب رقم الحيوان وتاريخ الفطام.",
          "info"
        );
      }

      return;
    }

    if (!silent) {
      setMessage(
        "جاري التحقق من السيرفر…",
        "info"
      );
    }

    setBusy(true);

    try {
      const j =
        await request(
          "/api/weaning/gate",
          {
            method:
              "POST",

            body: {
              numbers,
              animalNumbers:
                numbers,
              eventDate
            }
          }
        );

      renderGate(j);

    } catch (e) {
      console.error(e);

      lastGate = {
        canSave:false
      };

      saveBtn.disabled =
        true;

      setMessage(
        e.message ||
        "❌ تعذّر التحقق من السيرفر الآن.",
        "error"
      );

    } finally {
      setBusy(false);
    }
  }

  function scheduleGate(){
    if (requestedEditMode) {
      return;
    }

    clearTimeout(
      gateTimer
    );

    gateTimer =
      setTimeout(
        () =>
          runGate({
            silent:true
          }),
        350
      );
  }

  function hydrateNormal(){
    eventDateEl.value =
      initialDate;

    animalNumberEl.value =
      initialNumbers.join(
        startsBulk
          ? "\n"
          : ""
      );

    animalNumberEl.rows =
      startsBulk
        ? Math.max(
            3,
            initialNumbers.length
          )
        : 1;

    ageWrap.hidden = startsBulk;

bulkAgeHint.hidden = !startsBulk;

    saveBtn.disabled =
      true;

    cardBtn.disabled =
      initialNumbers.length !== 1;
  }

  async function loadEditEvent(){
    setMessage(
      "جاري تحميل حدث الفطام للتعديل...",
      "info"
    );

    const data =
      await request(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`
      );

    if (
      !data.ok ||
      !data.event
    ) {
      throw new Error(
        responseText(data) ||
        "تعذّر تحميل حدث الفطام للتعديل."
      );
    }

    const ev =
      data.event;

    if (
      ev.typeKey !==
      "weaning"
    ) {
      throw new Error(
        "الحدث المطلوب ليس حدث فطام."
      );
    }

    if (
      ev.editPolicy
        ?.editable !== true
    ) {
      throw new Error(
        ev.editPolicy
          ?.reason ||
        "هذا الحدث غير متاح للتعديل."
      );
    }

    animalNumberEl.value =
      ev.animalNumber ||
      "";

    animalNumberEl.readOnly =
      true;

    animalNumberEl.rows =
      1;

    eventDateEl.value =
      ev.data?.eventDate ||
      ev.eventDate ||
      "";

    eventDateEl.disabled =
      true;

    notesEl.value =
      ev.data?.notes ||
      "";

    const currentWeight =
      ev.data
        ?.weaningWeightKg;

    weightEl.value =
      currentWeight !== null &&
      currentWeight !== undefined &&
      Number.isFinite(
        Number(
          currentWeight
        )
      )
        ? String(
            currentWeight
          )
        : "";

    ageWrap.hidden = true;

bulkAgeHint.hidden = true;
    renderPerformers(
      data.correctionPerformers ||
      []
    );

    editToolsCard.hidden =
  false;

    correctionPerformedByEl.required =
      true;

    correctionReasonEl.required =
      true;

    pageTitle.textContent =
      "تعديل الفطام";

    document.title =
      "تعديل الفطام — مُرَبِّيك";

    backLink.href =
      `event-list.html?number=${encodeURIComponent(ev.animalNumber || "")}`;

    saveBtn.textContent =
      "حفظ التعديل";

    lastGate = {
      canSave:true
    };

    saveBtn.disabled =
      false;

    setMessage(
      "يمكن تعديل وزن الفطام والملاحظات فقط. رقم الحيوان وتاريخ الفطام ثابتان. ترك خانة الوزن فارغة يعني عدم تغيير الوزن المسجل.",
      "success"
    );
  }

  async function saveCorrection(){
    const numbers =
      getCurrentNumbers();

    const animalNumber =
      numbers[0] ||
      "";

    const eventDate =
      String(
        eventDateEl.value ||
        ""
      ).slice(0, 10);

    const notes =
      String(
        notesEl.value ||
        ""
      ).trim();

    const weaningWeightKg =
      String(
        weightEl.value ||
        ""
      ).trim();

    const correctionPerformedBy =
      String(
        correctionPerformedByEl
          .value ||
        ""
      ).trim();

    const correctionReason =
      String(
        correctionReasonEl
          .value ||
        ""
      ).trim();

    if (
      numbers.length !== 1 ||
      !animalNumber ||
      !eventDate
    ) {
      setMessage(
        "❌ تعذّر تحديد حدث الفطام المطلوب تعديله.",
        "error"
      );

      return;
    }

    if (
      weaningWeightKg &&
      (
        !Number.isFinite(
          Number(
            weaningWeightKg
          )
        ) ||
        Number(
          weaningWeightKg
        ) < 0
      )
    ) {
      setMessage(
        "❌ أدخل وزن فطام رقميًا صحيحًا أو اترك الحقل فارغًا.",
        "error"
      );

      return;
    }

    if (
      !correctionPerformedBy
    ) {
      setMessage(
        "❌ أدخل اسم القائم بالتعديل.",
        "error"
      );

      return;
    }

    if (
      !correctionReason
    ) {
      setMessage(
        "❌ اكتب سبب التعديل.",
        "error"
      );

      return;
    }

    setMessage(
      "جاري حفظ تعديل الفطام...",
      "info"
    );

    setBusy(true);

    try {
      const j =
        await request(
          `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
          {
            method:
              "POST",

            body: {
              animalNumber,
              eventDate,
              weaningWeightKg,
              notes,
              correctionPerformedBy,
              correctionReason
            }
          }
        );

      if (!j.ok) {
        setMessage(
          responseText(j) ||
          "❌ تعذّر تعديل حدث الفطام.",
          "error"
        );

        return;
      }

      setMessageWithOk(
        responseText(j) ||
        "✅ تم تعديل حدث الفطام بنجاح.",
        "success",
        "حسنًا",
        () => {
          location.href =
            `event-list.html?number=${encodeURIComponent(animalNumber)}`;
        }
      );

    } catch (e) {
      console.error(
        "weaning correction failed",
        e
      );

      setMessage(
        e.message ||
        "❌ تعذّر تعديل حدث الفطام.",
        "error"
      );

    } finally {
      setBusy(false);
    }
  }

  cardBtn.addEventListener(
    "click",
    () => {
      const nums =
        getCurrentNumbers();

      if (
        nums.length !== 1
      ) {
        return;
      }

      location.href =
        `calf-card.html?number=${encodeURIComponent(nums[0])}`;
    }
  );

  animalNumberEl
    .addEventListener(
      "input",
      scheduleGate
    );

  eventDateEl
    .addEventListener(
      "input",
      scheduleGate
    );

  eventDateEl
    .addEventListener(
      "change",
      () => {
        if (
          !requestedEditMode
        ) {
          runGate({
            silent:false
          });
        }
      }
    );

  form.addEventListener(
    "submit",
    async (ev) => {
      ev.preventDefault();

      if (isEditMode) {
        await saveCorrection();
        return;
      }

      if (requestedEditMode) {
        setMessage(
          "❌ رابط تعديل الفطام غير مكتمل.",
          "error"
        );

        return;
      }

      const numbers =
        getCurrentNumbers();

      const eventDate =
        String(
          eventDateEl.value ||
          ""
        ).slice(0, 10);

      const notes =
        String(
          notesEl.value ||
          ""
        ).trim();

      const bulk =
  isBulkNow();

const weaningWeights =
  bulk
    ? currentBulkWeightsPayload()
    : [];

const weaningWeightKg =
  bulk
    ? ""
    : String(
        weightEl.value ||
        ""
      ).trim();

      setMessage(
        "جاري الحفظ من السيرفر…",
        "info"
      );

      setBusy(true);

      try {
        const j =
          await request(
            "/api/weaning/save",
            {
              method:
                "POST",

              body: {
  numbers,
  animalNumbers:
    numbers,
  eventDate,
  notes,

  ...(bulk
    ? { weaningWeights }
    : { weaningWeightKg })
}
            }
          );

        const text =
          responseText(j) ||
          "تمت المعالجة.";

        if (j.ok) {
          setMessageWithOk(
            text ||
            "✅ تم حفظ الفطام بنجاح.",
            "success",
            "حسنًا",
            () => {
              if (
                j.redirectUrl
              ) {
                location.href =
                  j.redirectUrl;
              } else {
                clearMessage();
              }
            }
          );

          return;
        }

        setMessage(
          text,
          "error"
        );

        await runGate({
          silent:true
        });

      } catch (e) {
        console.error(e);

        setMessage(
          e.message ||
          "❌ فشل حفظ الفطام من السيرفر.",
          "error"
        );

      } finally {
        setBusy(false);
      }
    }
  );

  async function init(){
    try {
      if (requestedEditMode) {
        if (!editEventId) {
          throw new Error(
            "رابط تعديل الفطام غير مكتمل."
          );
        }

        await loadEditEvent();

      } else {
        hydrateNormal();

        await runGate({
          silent:true
        });
      }

    } catch (e) {
      console.error(
        "weaning page init failed",
        e
      );

      saveBtn.disabled =
        true;

      setMessage(
        e.message ||
        "❌ تعذّر تجهيز صفحة الفطام.",
        "error"
      );
    }
  }

  init();
})();
</script>
</body>
</html>
