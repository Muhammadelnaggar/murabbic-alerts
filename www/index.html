<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مُرَبِّيك</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b7f47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/splash.css">

 
</head>

<body>

 <div class="splash-art" aria-label="مُرَبِّيك">
  <picture>
    <source media="(min-width: 768px)" srcset="/images/murabbik-splash-desktop.png">
    <img src="/images/murabbik-splash-mobile.png" alt="مُرَبِّيك — إدارة ذكية للقطيع والإنتاج">
  </picture>
</div>
   <div id="installBox" class="install-box" hidden>
    <button id="installBtn" class="install-btn" type="button">تثبيت مُرَبِّيك</button>
    <div class="install-note">اضغط مرة واحدة لتثبيت التطبيق على جهازك</div>
  </div>
<script>
  let deferredInstallPrompt = null;
  let installPromptSeen = false;
  let installDone = false;
  let nextActionBusy = false;

  const installBox = document.getElementById('installBox');
  const installBtn = document.getElementById('installBtn');
  const installNote = installBox
    ? installBox.querySelector('.install-note')
    : null;

  function mbkInstallDeviceText(state = 'ready') {
    const ua = String(navigator.userAgent || '').toLowerCase();
    const platform = String(navigator.platform || '').toLowerCase();
    const touch = Number(navigator.maxTouchPoints || 0);

    const isIpad =
      ua.includes('ipad') ||
      (platform.includes('mac') && touch > 1);

    const isMobile =
      /iphone|ipod|android.*mobile|windows phone/.test(ua);

    const isTablet =
      isIpad ||
      ua.includes('tablet') ||
      (ua.includes('android') && !ua.includes('mobile'));

    const deviceText = isMobile
      ? 'موبايلك'
      : isTablet
        ? 'التابلت'
        : 'الكمبيوتر';

    const openText = isMobile || isTablet
      ? 'الشاشة الرئيسية'
      : 'سطح المكتب أو قائمة Start';

    if (state === 'installed') {
      return {
        button: 'تم تثبيت مُرَبِّيك بنجاح',
        note: `افتح مُرَبِّيك من الأيقونة الجديدة على ${openText}.`
      };
    }

    return {
      button: `تثبيت مُرَبِّيك على ${deviceText}`,
      note: `اضغط مرة واحدة لتثبيت التطبيق على ${deviceText}.`
    };
  }

  function applyInstallDeviceText(state = 'ready') {
    const t = mbkInstallDeviceText(state);

    if (installBtn) {
      installBtn.textContent = t.button;
    }

    if (installNote) {
      installNote.textContent = t.note;
    }
  }

  function isStandaloneApp() {
    return (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true
    );
  }

  async function executeServerNext(delay = 0) {
    if (nextActionBusy) return;

    nextActionBusy = true;

    if (delay > 0) {
      await new Promise(resolve => setTimeout(resolve, delay));
    }

    try {
      const response = await fetch('/api/auth/onboarding/next', {
        method: 'GET',
        credentials: 'include',
        cache: 'no-store'
      });

      const data = await response.json().catch(() => ({}));

      if (
        !response.ok ||
        data?.ok !== true ||
        !data?.redirectUrl
      ) {
        throw new Error('onboarding_next_failed');
      }

      window.location.replace(data.redirectUrl);

    } catch (_) {
      nextActionBusy = false;

      if (installBox) {
        installBox.hidden = false;
      }

      if (installNote) {
        installNote.textContent =
          'تعذّر فتح مُرَبِّيك الآن. حاول مرة أخرى بعد لحظات.';
      }
    }
  }

  function showInstalledMessage() {
    installDone = true;

    if (installBox) {
      installBox.hidden = false;
    }

    const t = mbkInstallDeviceText('installed');

    if (installBtn) {
      installBtn.disabled = true;
      installBtn.textContent = t.button;
      installBtn.style.opacity = '0.9';
      installBtn.style.cursor = 'default';
    }

    if (installNote) {
      installNote.textContent = t.note;
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('/sw.js', { scope: '/' })
        .catch(function () {});
    });
  }

  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();

    deferredInstallPrompt = event;
    installPromptSeen = true;

    applyInstallDeviceText('ready');

    if (installBox) {
      installBox.hidden = false;
    }
  });

  if (installBtn) {
    installBtn.addEventListener('click', async function () {
      if (!deferredInstallPrompt) {
        if (installNote) {
          installNote.textContent =
            'استخدم خيار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية» من قائمة المتصفح.';
        }

        return;
      }

      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;

      try {
        promptEvent.prompt();

        const choice = await promptEvent.userChoice;

        if (
          choice &&
          choice.outcome === 'accepted'
        ) {
          if (installBtn) {
            installBtn.disabled = true;
            installBtn.textContent =
              'جارٍ تثبيت مُرَبِّيك...';
          }

          if (installNote) {
            installNote.textContent =
              'انتظر حتى يكتمل التثبيت، ثم افتح مُرَبِّيك من الأيقونة الجديدة.';
          }

          return;
        }
      } catch (_) {}

      if (!installDone) {
        if (installBtn) {
          installBtn.disabled = false;
        }

        applyInstallDeviceText('ready');

        if (installBox) {
          installBox.hidden = false;
        }
      }
    });
  }

  window.addEventListener('appinstalled', function () {
    showInstalledMessage();
  });

  if (isStandaloneApp()) {
    executeServerNext(300);

  } else {
    setTimeout(function () {
      if (
        !installPromptSeen &&
        !installDone &&
        installBox
      ) {
        installBox.hidden = false;

        if (installNote) {
          installNote.textContent =
            'إذا لم يظهر طلب التثبيت تلقائيًا، اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية» من قائمة المتصفح.';
        }
      }
    }, 4000);
  }
</script>
</body>
</html>
