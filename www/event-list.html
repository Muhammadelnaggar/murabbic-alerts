<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>قائمة أحداث الحيوان — مُرَبِّك</title>
  <link rel="icon" type="image/svg+xml" href="/images/dashboard.svg">
  <meta name="theme-color" content="#2e7d32" />

  <!-- نفس اعتماد animal-list -->
  <link rel="stylesheet" href="css/forms.css">
 

  </head>
<body class="event-list-page">
    <header>
    <div class="mbk-head">
      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
      <div class="mbk-center">
        <div class="mbk-page-title">قائمة أحداث الحيوان</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>
      <a class="mbk-back" href="add-event.html">رجوع</a>
    </div>
  </header>
  <div class="wrap">
   

    <div class="controls">
      <input id="f-num" type="text" inputmode="numeric" placeholder="رقم الحيوان (مثال 108)" aria-label="رقم الحيوان">
      
       <select id="f-type" aria-label="نوع الحدث">
  <option value="">كل الأنواع</option>
</select>
     
     
    </div>

    <div class="table">
      <table id="evTable" dir="rtl">
        <thead>
          <tr>
         <th class="sticky-col sticky-date">تاريخ الحدث</th>
<th class="sticky-col sticky-type">نوع الحدث</th>
<th>تفاصيل الحدث</th>
          </tr>
        </thead>
        <tbody id="evBody">
         <tr><td colspan="3" class="empty">لا توجد بيانات بعد…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

 <script>
  const fNum  = document.getElementById('f-num');
  const fType = document.getElementById('f-type');
  const evBody = document.getElementById('evBody');

  const getParam = (...keys) => {
    const u = new URL(location.href);
    for (const k of keys){
      const v = u.searchParams.get(k);
      if(v != null && v !== '') return v;
    }
    return '';
  };
  async function sessionGetJson(path) {
  const r = await fetch(path, {
    method: 'GET',
    credentials: 'same-origin',
    cache: 'no-store',
    headers: {
      'Accept': 'application/json'
    }
  });

  const j = await r.json().catch(() => null);

  if (r.status === 401 || j?.error === 'auth_required') {
    return {
      r,
      j: j || {
        ok: false,
        message: 'سجّل الدخول أولًا.'
      },
      authRequired: true
    };
  }

  return { r, j, authRequired: false };
}
 function renderTypeOptions(options = [], selectedValue = '') {
  if (!fType || !Array.isArray(options) || !options.length) return;

  const frag = document.createDocumentFragment();

  for (const item of options) {
    const opt = document.createElement('option');

    opt.value =
      String(item?.value ?? '').trim();

    const label =
      String(
        item?.label ??
        item?.value ??
        ''
      ).trim() || 'كل الأنواع';

    opt.textContent = label;
    frag.appendChild(opt);
  }

  fType.replaceChildren(frag);

  if (
    [...fType.options]
      .some(opt => opt.value === selectedValue)
  ) {
    fType.value = selectedValue;
  }
}

function seasonRangeText(season = {}) {
  const start =
    String(season.startDate || '').trim();

  const next =
    String(season.nextCalvingDate || '').trim();

  if (start && next) {
    return `من ${start} إلى ما قبل ${next}`;
  }

  if (start) {
    return `من ${start} حتى الآن`;
  }

  if (next) {
    return `قبل ${next}`;
  }

  return '';
}

function appendEventRow(frag, row = {}) {
  const tr =
    document.createElement('tr');

  const cDate =
    document.createElement('td');

  cDate.textContent =
    row.eventDate || '';

  cDate.className =
    'sticky-col sticky-date';

  const cType =
    document.createElement('td');

  cType.className =
    'sticky-col sticky-type';

  const pill =
    document.createElement('span');

  pill.className = 'pill';

  pill.textContent =
    row.typeLabel || 'حدث';

  cType.appendChild(pill);

  const cDet =
    document.createElement('td');

  cDet.className =
    'event-details-cell';

  const detScroll =
    document.createElement('div');

  detScroll.className =
    'event-details-scroll';

  detScroll.textContent =
    row.details || '—';

  cDet.appendChild(detScroll);

  tr.append(
    cDate,
    cType,
    cDet
  );

  frag.appendChild(tr);
}

function renderSeasons(seasons = []) {
  if (!evBody) return;

  evBody.innerHTML = '';

  const visibleSeasons =
    Array.isArray(seasons)
      ? seasons.filter(
          season =>
            Array.isArray(season?.events) &&
            season.events.length
        )
      : [];

  if (!visibleSeasons.length) {
    evBody.innerHTML =
      '<tr><td colspan="3" class="empty">لا توجد نتائج مطابقة…</td></tr>';

    return;
  }

  const frag =
    document.createDocumentFragment();

  for (const season of visibleSeasons) {
    const seasonRow =
      document.createElement('tr');

    seasonRow.className =
      'season-row';

    const seasonCell =
      document.createElement('td');

    seasonCell.colSpan = 3;
    seasonCell.className =
      'season-cell';

    const seasonTitle =
      document.createElement('strong');

    seasonTitle.className =
      'season-title';

    seasonTitle.textContent =
      season.label || 'الموسم';

    seasonCell.appendChild(
      seasonTitle
    );

    const rangeText =
      seasonRangeText(season);

    if (rangeText) {
      const seasonRange =
        document.createElement('span');

      seasonRange.className =
        'season-range';

      seasonRange.textContent =
        rangeText;

      seasonCell.appendChild(
        seasonRange
      );
    }

    seasonRow.appendChild(
      seasonCell
    );

    frag.appendChild(
      seasonRow
    );

    for (const row of season.events) {
      appendEventRow(
        frag,
        row
      );
    }
  }

  evBody.appendChild(frag);

  updateStickyWidths();
}

function updateStickyWidths(){
  const thDate =
    document.querySelector(
      'thead th.sticky-date'
    );

  const thType =
    document.querySelector(
      'thead th.sticky-type'
    );

  if(!thDate || !thType) return;

  const wDate =
    Math.ceil(
      thDate
        .getBoundingClientRect()
        .width
    );

  const wType =
    Math.ceil(
      thType
        .getBoundingClientRect()
        .width
    );

  document.documentElement
    .style
    .setProperty(
      '--w-date',
      wDate + 'px'
    );

  document.documentElement
    .style
    .setProperty(
      '--w-type',
      wType + 'px'
    );
}

  async function loadAndFilter(){
    

    const inputNumber = fNum.value.trim();

const fixedNumber =
  inputNumber ||
  getParam('number','animalNumber','num','n') ||
  '';

    const type = (fType.value || '').trim();

    if(!fixedNumber){
      renderSeasons([]);
      return;
    }

   
    try{
      evBody.innerHTML = '<tr><td colspan="3" class="empty">جاري تحميل الأحداث…</td></tr>';

      const qs = new URLSearchParams();
      qs.set('number', fixedNumber);
      if(type) qs.set('type', type);

const { r, j, authRequired } = await sessionGetJson('/api/events-page/list?' + qs.toString());

if (authRequired) {
  evBody.innerHTML = `<tr><td colspan="3" class="empty">${j?.message || 'سجّل الدخول أولًا.'}</td></tr>`;
  return;
}

      if(!r.ok || !j || j.ok === false){
        evBody.innerHTML = `<tr><td colspan="3" class="empty">${j?.message || 'تعذّر تحميل قائمة الأحداث.'}</td></tr>`;
        return;
      }

      renderTypeOptions(
  Array.isArray(j.typeOptions)
    ? j.typeOptions
    : [],
  type
);

renderSeasons(
  Array.isArray(j.seasons)
    ? j.seasons
    : []
);

    }catch(e){
      console.error('[event-list] server load failed', e);
      evBody.innerHTML = '<tr><td colspan="3" class="empty">تعذّر الاتصال بالسيرفر.</td></tr>';
    }
  }

  fType.addEventListener('change', loadAndFilter);

  fNum.addEventListener('input', () => {
    if (fNum.value.trim()) loadAndFilter();
  });

  window.addEventListener('DOMContentLoaded', () => {
    const fixedNumber =
  getParam('number','animalNumber','num','n') ||
  '';

    const cowBtn = document.getElementById('btn-cow-card');

    if(cowBtn && fixedNumber){
      cowBtn.href = `cow-card.html?number=${encodeURIComponent(fixedNumber)}`;
    }

    if(fixedNumber){
      fNum.value = fixedNumber;
    } else {
      fNum.placeholder = 'رقم الحيوان (مثال 108)';
    }

    loadAndFilter();

    window.addEventListener('resize', updateStickyWidths);
    setTimeout(updateStickyWidths, 0);
  });
</script>
  <!-- ===== Bottom Fixed Bar ===== -->
<div class="mbk-bottom-bar">
  <a id="btn-cow-card" class="mbk-bottom-btn secondary">
    بطاقة الحيوان
  </a>

  <a href="dashboard.html" class="mbk-bottom-btn primary">
    لوحة التحكم
  </a>
</div>
</body>
</html>
