<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>قائمة أحداث الحيوان — مُرَبِّك</title>
  <link rel="icon" type="image/svg+xml" href="/images/dashboard.svg">
  <meta name="theme-color" content="#2e7d32" />

  <!-- نفس اعتماد animal-list -->
  <link rel="stylesheet" href="css/forms.css">
 

  </head>
<body class="event-list-page">
    <header>
    <div class="mbk-head">
      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
      <div class="mbk-center">
        <div class="mbk-page-title">قائمة أحداث الحيوان</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>
      <a class="mbk-back" href="add-event.html">رجوع</a>
    </div>
  </header>
  <div class="wrap">
   

    <div class="controls">
      <input id="f-num" type="text" inputmode="numeric" placeholder="رقم الحيوان (مثال 108)" aria-label="رقم الحيوان">
      
       <select id="f-type" aria-label="نوع الحدث">
  <option value="">كل الأنواع</option>
</select>
     
     
    </div>

    <div class="table">
      <table id="evTable" dir="rtl">
        <thead>
          <tr>
         <th class="sticky-col sticky-date">تاريخ الحدث</th>
<th class="sticky-col sticky-type">نوع الحدث</th>
<th class="event-details-head"><span class="event-details-head-label">تفاصيل الحدث</span></th>
          </tr>
        </thead>
        <tbody id="evBody">
         <tr><td colspan="3" class="empty">لا توجد بيانات بعد…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

 <script>
  const fNum  = document.getElementById('f-num');
  const fType = document.getElementById('f-type');
  const evBody = document.getElementById('evBody');

  const getParam = (...keys) => {
    const u = new URL(location.href);
    for (const k of keys){
      const v = u.searchParams.get(k);
      if(v != null && v !== '') return v;
    }
    return '';
  };
  async function sessionGetJson(path) {
  const r = await fetch(path, {
    method: 'GET',
    credentials: 'same-origin',
    cache: 'no-store',
    headers: {
      'Accept': 'application/json'
    }
  });

  const j = await r.json().catch(() => null);

  if (r.status === 401 || j?.error === 'auth_required') {
    return {
      r,
      j: j || {
        ok: false,
        message: 'سجّل الدخول أولًا.'
      },
      authRequired: true
    };
  }

  return { r, j, authRequired: false };
}
 function renderTypeOptions(options = [], selectedValue = '') {
  if (!fType || !Array.isArray(options) || !options.length) return;

  const frag = document.createDocumentFragment();

  for (const item of options) {
    const opt = document.createElement('option');

    opt.value =
      String(item?.value ?? '').trim();

    const label =
      String(
        item?.label ??
        item?.value ??
        ''
      ).trim() || 'كل الأنواع';

    opt.textContent = label;
    frag.appendChild(opt);
  }

  fType.replaceChildren(frag);

  if (
    [...fType.options]
      .some(opt => opt.value === selectedValue)
  ) {
    fType.value = selectedValue;
  }
}
function shortEventDate(value = '') {
  const s = String(value || '').trim();

  const m = s.match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (!m) return s;

  const year =
    m[1].slice(-2);

  const month =
    String(Number(m[2]));

  const day =
    String(Number(m[3]));

  return `${day}/${month}/${year}`;
}
function seasonRangeText(season = {}) {
  const start =
    shortEventDate(
      season.startDate
    );

  const next =
    shortEventDate(
      season.nextCalvingDate
    );

  if (start && next) {
    return `من ${start} إلى ما قبل ${next}`;
  }

  if (start) {
    return `من ${start} حتى الآن`;
  }

  if (next) {
    return `قبل ${next}`;
  }

  return '';
}
function editedAtText(value) {
  const ms =
    Number(value);

  if (
    !Number.isFinite(ms) ||
    ms <= 0
  ) {
    return '';
  }

  const d =
    new Date(ms);

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return '';
  }

  return d.toLocaleString(
    'ar-EG',
    {
      dateStyle: 'short',
      timeStyle: 'short'
    }
  );
}

function appendEventEditAndAudit(
  cell,
  row = {}
) {
  const edit =
    row?.edit || {};

  const audit =
    row?.audit || {};

  if (
    edit?.editable === true &&
    String(edit?.editUrl || '').trim()
  ) {
    const tools =
      document.createElement('div');

    tools.className =
      'event-edit-tools';

    const editLink =
      document.createElement('a');

    editLink.className =
      'event-edit-link';

    editLink.href =
      String(edit.editUrl).trim();

    editLink.textContent =
      'تعديل';

    tools.appendChild(
      editLink
    );

    cell.appendChild(
      tools
    );
  }

  if (audit?.edited !== true) {
    return;
  }

  const auditBox =
    document.createElement('div');

  auditBox.className =
    'event-audit';

  const title =
    document.createElement('span');

  title.className =
    'event-audit-title';

  title.textContent =
    'تم تعديل هذا الحدث';

  auditBox.appendChild(
    title
  );

  const correctionPerformedBy =
  String(
    audit?.correctionPerformedBy || ''
  ).trim();

if (correctionPerformedBy) {
  const line =
    document.createElement('span');

  line.className =
    'event-audit-line';

  line.textContent =
    `القائم بالتعديل: ${correctionPerformedBy}`;

  auditBox.appendChild(
    line
  );
}
  const editedAt =
    editedAtText(
      audit?.editedAtMs
    );

  if (editedAt) {
    const line =
      document.createElement('span');

    line.className =
      'event-audit-line';

    line.textContent =
      `تاريخ التعديل: ${editedAt}`;

    auditBox.appendChild(
      line
    );
  }

  const correctionReason =
    String(
      audit?.correctionReason || ''
    ).trim();

  if (correctionReason) {
    const line =
      document.createElement('span');

    line.className =
      'event-audit-line';

    line.textContent =
      `سبب التعديل: ${correctionReason}`;

    auditBox.appendChild(
      line
    );
  }

  const editCount =
    Number(
      audit?.editCount || 0
    );

  if (
    Number.isFinite(editCount) &&
    editCount > 1
  ) {
    const line =
      document.createElement('span');

    line.className =
      'event-audit-line';

    line.textContent =
      `عدد مرات التعديل: ${editCount}`;

    auditBox.appendChild(
      line
    );
  }

  cell.appendChild(
    auditBox
  );
}
function appendEventRow(
  frag,
  row = {},
  {
    seasonKey = '',
    hidden = false
  } = {}
) {
  const tr =
    document.createElement('tr');

  tr.className =
    'season-event-row';

  if (seasonKey) {
    tr.dataset.seasonKey =
      seasonKey;
  }

  tr.hidden =
    Boolean(hidden);

  const cDate =
    document.createElement('td');

  cDate.textContent =
    shortEventDate(
      row.eventDate
    );

  cDate.className =
    'sticky-col sticky-date';

  const cType =
    document.createElement('td');

  cType.className =
    'sticky-col sticky-type';

  const pill =
    document.createElement('span');

  pill.className =
    'pill';

  pill.textContent =
    row.typeLabel || 'حدث';

  cType.appendChild(pill);

  const cDet =
    document.createElement('td');

  cDet.className =
    'event-details-cell';

  const detScroll =
    document.createElement('div');

  detScroll.className =
    'event-details-scroll';

  detScroll.textContent =
    row.details || '—';

  cDet.appendChild(detScroll);

appendEventEditAndAudit(
  cDet,
  row
);

tr.append(
    cDate,
    cType,
    cDet
  );

  frag.appendChild(tr);

  return tr;
}

function renderSeasons(seasons = []) {
  if (!evBody) return;

  evBody.innerHTML = '';

  const visibleSeasons =
    Array.isArray(seasons)
      ? seasons.filter(season => {
          const events =
            Array.isArray(season?.events)
              ? season.events
              : [];

          return (
            season?.isCurrent === true ||
            events.length > 0
          );
        })
      : [];

  if (!visibleSeasons.length) {
    evBody.innerHTML =
      '<tr><td colspan="3" class="empty">لا توجد نتائج مطابقة…</td></tr>';

    return;
  }

  const frag =
    document.createDocumentFragment();

  for (const season of visibleSeasons) {
    const events =
      Array.isArray(season?.events)
        ? season.events
        : [];

    const isCurrent =
      season?.isCurrent === true;

    const seasonKey =
      String(
        season?.key ||
        ''
      );

    const seasonRow =
      document.createElement('tr');

    seasonRow.className =
      isCurrent
        ? 'season-row current-season'
        : 'season-row previous-season';

    const seasonCell =
      document.createElement('td');

    seasonCell.colSpan = 3;
    seasonCell.className =
      'season-cell';

    const rangeText =
      seasonRangeText(season);

    if (isCurrent) {
      const header =
        document.createElement('div');

      header.className =
        'season-current-header';

      const title =
        document.createElement('strong');

      title.className =
        'season-title';

      title.textContent =
        season.label ||
        'الموسم الحالي';

      header.appendChild(title);

      if (rangeText) {
        const range =
          document.createElement('span');

        range.className =
          'season-range';

        range.textContent =
          rangeText;

        header.appendChild(range);
      }

      seasonCell.appendChild(header);

    } else {
      const toggle =
        document.createElement('button');

      toggle.type = 'button';
      toggle.className =
        'season-toggle';

      toggle.setAttribute(
        'aria-expanded',
        'false'
      );

      const main =
        document.createElement('span');

      main.className =
        'season-toggle-main';

      const title =
        document.createElement('strong');

      title.className =
        'season-title';

      title.textContent =
        season.label ||
        'موسم سابق';

      main.appendChild(title);

      if (rangeText) {
        const range =
          document.createElement('span');

        range.className =
          'season-range';

        range.textContent =
          rangeText;

        main.appendChild(range);
      }

      const icon =
        document.createElement('span');

      icon.className =
        'season-toggle-icon';

      icon.textContent = '＋';

      toggle.append(
        main,
        icon
      );

      seasonCell.appendChild(toggle);

      season._toggleButton =
        toggle;

      season._toggleIcon =
        icon;
    }

    seasonRow.appendChild(
      seasonCell
    );

    frag.appendChild(
      seasonRow
    );

    const eventRows = [];

    for (const row of events) {
      eventRows.push(
        appendEventRow(
          frag,
          row,
          {
            seasonKey,
            hidden: !isCurrent
          }
        )
      );
    }

    if (
      !isCurrent &&
      season._toggleButton
    ) {
      const toggle =
        season._toggleButton;

      const icon =
        season._toggleIcon;

      toggle.addEventListener(
        'click',
        () => {
          const expanded =
            toggle.getAttribute(
              'aria-expanded'
            ) === 'true';

          const open =
            !expanded;

          toggle.setAttribute(
            'aria-expanded',
            String(open)
          );

          icon.textContent =
            open ? '−' : '＋';

          for (const row of eventRows) {
            row.hidden = !open;
          }

          updateStickyWidths();
        }
      );
    }
  }

  

  evBody.appendChild(frag);

  updateStickyWidths();
}

function updateStickyWidths(){
  const thDate =
    document.querySelector(
      'thead th.sticky-date'
    );

  const thType =
    document.querySelector(
      'thead th.sticky-type'
    );

  if(!thDate || !thType) return;

  const wDate =
    Math.ceil(
      thDate
        .getBoundingClientRect()
        .width
    );

  const wType =
    Math.ceil(
      thType
        .getBoundingClientRect()
        .width
    );

  document.documentElement
    .style
    .setProperty(
      '--w-date',
      wDate + 'px'
    );

  document.documentElement
    .style
    .setProperty(
      '--w-type',
      wType + 'px'
    );
}

  async function loadAndFilter(){
    

    const inputNumber = fNum.value.trim();

const fixedNumber =
  inputNumber ||
  getParam('number','animalNumber','num','n') ||
  '';

    const type = (fType.value || '').trim();

    if(!fixedNumber){
      renderSeasons([]);
      return;
    }

   
    try{
      evBody.innerHTML = '<tr><td colspan="3" class="empty">جاري تحميل الأحداث…</td></tr>';

      const qs = new URLSearchParams();
      qs.set('number', fixedNumber);
      if(type) qs.set('type', type);

const { r, j, authRequired } = await sessionGetJson('/api/events-page/list?' + qs.toString());

if (authRequired) {
  evBody.innerHTML = `<tr><td colspan="3" class="empty">${j?.message || 'سجّل الدخول أولًا.'}</td></tr>`;
  return;
}

      if(!r.ok || !j || j.ok === false){
        evBody.innerHTML = `<tr><td colspan="3" class="empty">${j?.message || 'تعذّر تحميل قائمة الأحداث.'}</td></tr>`;
        return;
      }

      renderTypeOptions(
  Array.isArray(j.typeOptions)
    ? j.typeOptions
    : [],
  type
);

renderSeasons(
  Array.isArray(j.seasons)
    ? j.seasons
    : []
);

    }catch(e){
      console.error('[event-list] server load failed', e);
      evBody.innerHTML = '<tr><td colspan="3" class="empty">تعذّر الاتصال بالسيرفر.</td></tr>';
    }
  }

  fType.addEventListener('change', loadAndFilter);

  fNum.addEventListener('input', () => {
    if (fNum.value.trim()) loadAndFilter();
  });

  window.addEventListener('DOMContentLoaded', () => {
    const fixedNumber =
  getParam('number','animalNumber','num','n') ||
  '';

    const cowBtn = document.getElementById('btn-cow-card');

    if(cowBtn && fixedNumber){
      cowBtn.href = `cow-card.html?number=${encodeURIComponent(fixedNumber)}`;
    }

    if(fixedNumber){
      fNum.value = fixedNumber;
    } else {
      fNum.placeholder = 'رقم الحيوان (مثال 108)';
    }

    loadAndFilter();

    window.addEventListener('resize', updateStickyWidths);
    setTimeout(updateStickyWidths, 0);
  });
</script>
  <!-- ===== Bottom Fixed Bar ===== -->
<div class="mbk-bottom-bar">
  <a id="btn-cow-card" class="mbk-bottom-btn secondary">
    بطاقة الحيوان
  </a>

  <a href="dashboard.html" class="mbk-bottom-btn primary">
    لوحة التحكم
  </a>
</div>
</body>
</html>
