<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="calving">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/forms.css">

  <title>تسجيل ولادة — مُرَبِّيك</title>


</head>

<body>
  <!-- تتبّع أساسي -->
  <script>window.dataLayer = window.dataLayer || [];</script>

  <header>
    <div class="mbk-head">
      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
      <div class="mbk-center">
        <div class="mbk-page-title">تسجيل ولادة</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>
      <a class="mbk-back" href="add-event.html">رجوع</a>
    </div>
  </header>

  <!-- ✅ كل رسائل النظام هنا تحت العنوان مباشرة -->
  <div id="sysbar" class="infobar" role="status" aria-live="polite"></div>

  <main>
   <form id="calving-form" class="card grid" autocomplete="off" novalidate data-event="ولادة">

      <input type="hidden" data-field="animalId" id="animalId">
      <input type="hidden" data-field="species" id="species">
      <input type="hidden" data-field="reproStatus" value="عشار">

           <div class="row">
        <div>
          <label>رقم الحيوان</label>
          <input id="animalNumber" data-field="animalNumber" inputmode="numeric"
                 placeholder="مثال: 1023" required />
        </div>
        <div>
          <label>تاريخ الولادة</label>
          <input id="eventDate" data-field="eventDate" type="date" required />
        </div>
      </div>

      <!-- يظهر فقط عند أول ولادة لعجلة موجودة في التوابع -->
      <div class="row" id="newMotherNumberRow" style="display:none">
        <div>
          <label>رقم الأم الجديد</label>
          <input
            id="newMotherNumber"
            data-field="newMotherNumber"
            inputmode="numeric"
            placeholder="حسب سيريال المزرعة"
          />
          <small
            id="newMotherNumberHint"
            style="display:block;margin-top:6px;font-weight:800;line-height:1.6;color:#556"
          >
            سيظل رقم العجلة القديم محفوظًا داخل وثيقة الأم وتاريخها.
          </small>
        </div>
      </div>

      <div class="row">
        <div>
          <label>نوع الولادة</label>
          <select id="calvingKind" data-field="calvingKind" required>
            <option value="">اختر</option>
            <option value="طبيعية">طبيعية</option>
            <option value="متعسرة">متعسرة</option>
            <option value="قيصرية">قيصرية</option>
            <option value="نافقة">نافقة</option>
          </select>
        </div>
        <div class="live-only">
          <label>عدد المواليد</label>
          <div class="radio-group">
            <label><input type="radio" name="calfCount" data-field="calfCount" value="1" required> 1</label>
            <label><input type="radio" name="calfCount" data-field="calfCount" value="2"> 2</label>
            <label><input type="radio" name="calfCount" data-field="calfCount" value="3"> 3</label>
          </div>
        </div>
      </div>

      <!-- ===================== مولود (1) ===================== -->
      <div class="offspring-group live-only" id="offspring1">
        <label>المولود (1)</label>

        <div class="row">
          <div>
            <label>جنس المولود</label>
            <div class="radio-group">
              <label><input type="radio" name="calf1Sex" data-field="calf1Sex" value="ذكر" required> ذكر</label>
              <label><input type="radio" name="calf1Sex" data-field="calf1Sex" value="أنثى"> أنثى</label>
            </div>
          </div>
          <div>
            <label>رقم العجل</label>
            <input id="calfId" data-field="calfId" placeholder="رقم تعريف العجل" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>مصير العجل (1)</label>
            <div class="radio-group">
              <label><input type="radio" name="calf1Fate" data-field="calf1Fate" value="تربية" required> تربية</label>
              <label><input type="radio" name="calf1Fate" data-field="calf1Fate" value="بيع"> بيع</label>
            </div>
          </div>
        </div>
      </div>

      <!-- ===================== مولود (2) ===================== -->
      <div class="offspring-group live-only" id="offspring2" style="display:none">
        <label>المولود (2)</label>

        <div class="row">
          <div>
            <label>جنس المولود</label>
            <div class="radio-group">
              <label><input type="radio" name="calf2Sex" data-field="calf2Sex" value="ذكر" required> ذكر</label>
              <label><input type="radio" name="calf2Sex" data-field="calf2Sex" value="أنثى"> أنثى</label>
            </div>
          </div>
          <div>
            <label>رقم العجل</label>
            <input id="calf2Id" data-field="calf2Id" placeholder="رقم تعريف العجل الثاني" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>مصير العجل (2)</label>
            <div class="radio-group">
              <label><input type="radio" name="calf2Fate" data-field="calf2Fate" value="تربية" required> تربية</label>
              <label><input type="radio" name="calf2Fate" data-field="calf2Fate" value="بيع"> بيع</label>
            </div>
          </div>
        </div>
      </div>

      <!-- ===================== مولود (3) ===================== -->
      <div class="offspring-group live-only" id="offspring3" style="display:none">
        <label>المولود (3)</label>

        <div class="row">
          <div>
            <label>جنس المولود</label>
            <div class="radio-group">
              <label><input type="radio" name="calf3Sex" data-field="calf3Sex" value="ذكر" required> ذكر</label>
              <label><input type="radio" name="calf3Sex" data-field="calf3Sex" value="أنثى"> أنثى</label>
            </div>
          </div>
          <div>
            <label>رقم العجل</label>
            <input id="calf3Id" data-field="calf3Id" placeholder="رقم تعريف العجل الثالث" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>مصير العجل (3)</label>
            <div class="radio-group">
              <label><input type="radio" name="calf3Fate" data-field="calf3Fate" value="تربية" required> تربية</label>
              <label><input type="radio" name="calf3Fate" data-field="calf3Fate" value="بيع"> بيع</label>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>آخر تلقيح مُخصِّب</label>
         <input id="lastInseminationDate" type="date" data-field="lastInseminationDate" required readonly />
        </div>
        <div>
          <label>ملاحظات</label>
          <input id="notes" data-field="notes" placeholder="اختياري" />
        </div>
      </div>
      <div class="row" id="editToolsRow" style="display:none">
  <div style="grid-column:1/-1">
    <label>سبب التعديل</label>
    <input
      id="correctionReason"
      type="text"
      maxlength="500"
      placeholder="اكتب سبب تصحيح بيانات الولادة"
    />
    <small style="display:block;margin-top:6px;font-weight:800;color:#556">
      يُحفظ سبب التعديل داخل سجل التصحيحات.
    </small>
  </div>
</div>
    </form>
  </main>

  <div class="actions-bar">
    <button class="save" id="saveBtn" type="submit" form="calving-form">حفظ الولادة ✅</button>
    <button class="ghost" id="toCardBtn" type="button">فتح بطاقة الحيوان</button>
  </div>

<script>
  const qp = new URLSearchParams(location.search);
  const requestedEditMode =
  String(qp.get("mode") || "").trim().toLowerCase() === "edit";

const editEventId =
  String(qp.get("eventId") || "").trim();

const isEditMode =
  requestedEditMode && !!editEventId;

  const form = document.getElementById("calving-form");
  const sysbar = document.getElementById("sysbar");

  const animalEl = document.getElementById("animalNumber");
  const dateEl = document.getElementById("eventDate");
  const kindEl = document.getElementById("calvingKind");
  const lastAiEl = document.getElementById("lastInseminationDate");
  const animalIdEl = document.getElementById("animalId");
  const speciesEl = document.getElementById("species");

  const newMotherNumberRow =
    document.getElementById("newMotherNumberRow");

  const newMotherNumberEl =
    document.getElementById("newMotherNumber");

  const newMotherNumberHint =
    document.getElementById("newMotherNumberHint");

  const saveBtn = document.getElementById("saveBtn");

  let requiresNewMotherNumber = false;
  let loadedOriginalCalfCount = 0;

  function toISO(s) {
    const v = String(s || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const d = new Date(v);
    if (Number.isNaN(d.getTime())) return "";
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
      .toISOString()
      .slice(0, 10);
  }

  function normalizeDigits(raw) {
    const map = {
      "٠": "0","١": "1","٢": "2","٣": "3","٤": "4","٥": "5","٦": "6","٧": "7","٨": "8","٩": "9",
      "۰": "0","۱": "1","۲": "2","۳": "3","۴": "4","۵": "5","۶": "6","۷": "7","۸": "8","۹": "9"
    };

    return String(raw || "")
      .replace(/[٠-٩۰-۹]/g, d => map[d] || d)
      .replace(/[^\d]/g, "")
      .trim();
  }
  async function sessionPostJson(path, payload, fallbackMessage) {
  const r = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify(payload || {})
  });

  const data = await r.json().catch(() => ({
    ok: false,
    allowed: false,
    message: "تعذّر قراءة رد السيرفر."
  }));

  if (r.status === 401 || data?.error === "auth_required") {
    showSysbar(data?.message || "سجّل الدخول أولًا.", "error");
    return { data, authRequired: true };
  }

  return { data, authRequired: false };
}
  function readRadio(name) {
    return String(form.querySelector(`input[name="${name}"]:checked`)?.value || "").trim();
  }
  function setRadioValue(name, value) {
  const wanted =
    String(value || "").trim();

  form
    .querySelectorAll(`input[name="${name}"]`)
    .forEach(r => {
      r.checked =
        String(r.value || "").trim() === wanted;
    });
}

function lockEditIdentityFields() {
  if (animalEl) {
    animalEl.readOnly = true;
  }

  form
    .querySelectorAll('input[name="calfCount"]')
    .forEach(r => {
      r.disabled = false;
    });

  if (kindEl) {
    Array.from(kindEl.options).forEach(opt => {
      const value = String(opt.value || "").trim();
      if (!value) return;

      opt.disabled =
        loadedOriginalCalfCount > 0
          ? value === "نافقة"
          : value !== "نافقة";
    });
  }

  [
    ["calfId", 1],
    ["calf2Id", 2],
    ["calf3Id", 3]
  ].forEach(([id, index]) => {
    const el = document.getElementById(id);

    if (el) {
      el.readOnly =
        index <= loadedOriginalCalfCount;
    }
  });
}

async function loadEditEvent() {
  if (!editEventId) {
    showSysbar(
      "❌ تعذّر تحديد حدث الولادة المطلوب تعديله.",
      "error"
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }

    return;
  }

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
    }

    if (animalEl) {
      animalEl.readOnly = true;
    }

    if (dateEl) {
      dateEl.disabled = true;
    }

    showSysbar(
      "جارِ تحميل بيانات الولادة للتعديل…",
      "info"
    );

    const r =
      await fetch(
        `/api/events-page/event/${encodeURIComponent(editEventId)}`,
        {
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

    const data =
      await r.json().catch(() => ({
        ok: false,
        message:
          "تعذّر قراءة بيانات الولادة."
      }));

    if (
      r.status === 401 ||
      data?.error === "auth_required"
    ) {
      showSysbar(
        data?.message ||
          "سجّل الدخول أولًا.",
        "error"
      );

      return;
    }

    if (
      !r.ok ||
      !data?.ok ||
      !data?.event
    ) {
      showSysbar(
        data?.message ||
          "❌ تعذّر تحميل بيانات الولادة للتعديل.",
        "error"
      );

      return;
    }

    if (
      String(
        data.event.typeKey || ""
      ).trim() !== "calving"
    ) {
      showSysbar(
        "❌ الحدث المحدد ليس حدث ولادة.",
        "error"
      );

      return;
    }

    const ev =
      data.event;

    const d =
      ev.data || {};
      const parsedOriginalCalfCount =
  Number(d.calfCount || 0);

loadedOriginalCalfCount =
  [1, 2, 3].includes(parsedOriginalCalfCount)
    ? parsedOriginalCalfCount
    : (
        String(d.calvingKind || "").trim() === "نافقة"
          ? 0
          : [
              d.calfId,
              d.calf2Id,
              d.calf3Id
            ].filter(Boolean).length
      );

    animalEl.value =
      normalizeDigits(
        ev.animalNumber || ""
      );

    dateEl.value =
      toISO(
        d.eventDate ||
        ev.eventDate ||
        ""
      );

    kindEl.value =
      String(
        d.calvingKind || ""
      ).trim();

    lastAiEl.value =
      toISO(
        d.lastFertileInseminationDate ||
        ""
      );

    document.getElementById("notes").value =
      String(
        d.notes || ""
      );

    setRadioValue(
      "calfCount",
      d.calfCount
    );

    setRadioValue(
      "calf1Sex",
      d.calf1Sex
    );

    setRadioValue(
      "calf1Fate",
      d.calf1Fate
    );

    setRadioValue(
      "calf2Sex",
      d.calf2Sex
    );

    setRadioValue(
      "calf2Fate",
      d.calf2Fate
    );

    setRadioValue(
      "calf3Sex",
      d.calf3Sex
    );

    setRadioValue(
      "calf3Fate",
      d.calf3Fate
    );

    document.getElementById("calfId").value =
      normalizeDigits(
        d.calfId || ""
      );

    document.getElementById("calf2Id").value =
      normalizeDigits(
        d.calf2Id || ""
      );

    document.getElementById("calf3Id").value =
      normalizeDigits(
        d.calf3Id || ""
      );

    setDetailsDisabled(false);

    if (dateEl) {
      dateEl.disabled = false;
    }

    syncCalfGroups();

    requiresNewMotherNumber = false;

    if (
      d.convertedFromFollower === true
    ) {
      if (newMotherNumberRow) {
        newMotherNumberRow.style.display = "";
      }

      if (newMotherNumberEl) {
        newMotherNumberEl.disabled = false;
        newMotherNumberEl.required = false;
        newMotherNumberEl.readOnly = true;

        newMotherNumberEl.value =
          normalizeDigits(
            d.newMotherNumber ||
            ev.animalNumber ||
            ""
          );
      }

      if (newMotherNumberHint) {
        newMotherNumberHint.textContent =
          "رقم الأم ثابت أثناء تصحيح حدث الولادة.";
      }
    } else {
      syncNewMotherNumberField(false);
    }

    lockEditIdentityFields();

    const editToolsRow =
      document.getElementById(
        "editToolsRow"
      );

    const correctionReasonEl =
      document.getElementById(
        "correctionReason"
      );

    if (editToolsRow) {
      editToolsRow.style.display = "";
    }

    if (correctionReasonEl) {
      correctionReasonEl.required = true;
    }

    const title =
      document.querySelector(
        ".mbk-page-title"
      );

    if (title) {
      title.textContent =
        "تعديل ولادة";
    }

    document.title =
      "تعديل ولادة — مُرَبِّيك";

    if (saveBtn) {
      saveBtn.textContent =
        "حفظ التعديل ✅";

      saveBtn.disabled = false;
    }

    const back =
      document.querySelector(
        ".mbk-back"
      );

    if (back) {
      back.href =
        `event-list.html?number=${encodeURIComponent(
          ev.animalNumber || ""
        )}`;
    }

    if (sysbar) {
      sysbar.style.display = "none";
    }

  } catch (err) {
    console.error(
      "calving edit load failed",
      err
    );

    showSysbar(
      "❌ تعذّر تحميل بيانات الولادة للتعديل.",
      "error"
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }
  }
}
  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function compactReason(reason) {
    return String(reason || "")
      .replace(/^❌\s*/, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function showSysbar(msg, type = "info", actions = []) {
    if (!sysbar) return;

    sysbar.style.display = "block";
    sysbar.className = "infobar show " + (
      type === "error" ? "error" :
      type === "success" ? "success" :
      "info"
    );

    sysbar.innerHTML = `
      <div style="display:grid;gap:10px;text-align:center">
        <div style="white-space:pre-line;font-weight:900;font-size:15px;line-height:1.7">
          ${escapeHtml(msg)}
        </div>

        <button type="button" id="gateOkBtn"
          style="width:auto;min-width:110px;margin:0 auto;padding:8px 16px;border-radius:999px;border:2px solid #0b7f47;background:#fff;color:#0b7f47;font-weight:900;cursor:pointer">
          حسنًا
        </button>
      </div>
    `;

    const okBtn = sysbar.querySelector("#gateOkBtn");
    okBtn?.addEventListener("click", () => {
      sysbar.style.display = "none";
    });

    if (Array.isArray(actions) && actions.length) {
      const wrap = document.createElement("div");
      wrap.className = "sys-actions";

      actions.forEach((a) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sys-btn" + (a.primary ? " primary" : "");
        btn.textContent = a.label || "إجراء";

        btn.addEventListener("click", () => {
          if (a.url) {
            location.href = a.url;
            return;
          }

          if (a.focus) {
            document.querySelector(`[data-field="${a.focus}"]`)?.focus?.();
            document.getElementById(a.focus)?.focus?.();
          }
        });

        wrap.appendChild(btn);
      });

      sysbar.appendChild(wrap);
    }

    try { sysbar.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (_) {}
  }

  function setDetailsDisabled(disabled) {
    form.querySelectorAll("[data-field], button[type='submit']").forEach((el) => {
      const key = el.getAttribute("data-field") || "";
      if (key === "animalNumber" || key === "eventDate") return;
      el.disabled = !!disabled;
    });

    if (saveBtn) saveBtn.disabled = !!disabled;
  }

  function collectPayload() {
    return {
      animalNumber: normalizeDigits(animalEl?.value || ""),
      number: normalizeDigits(animalEl?.value || ""),
      eventDate: String(dateEl?.value || "").trim(),
      date: String(dateEl?.value || "").trim(),

       animalId: String(animalIdEl?.value || "").trim(),
      species: String(speciesEl?.value || "").trim(),
      reproStatus: "عشار",

      newMotherNumber:
        normalizeDigits(newMotherNumberEl?.value || ""),

      calvingKind: String(kindEl?.value || "").trim(),
      calfCount: readRadio("calfCount"),

      calf1Sex: readRadio("calf1Sex"),
      calfId: String(document.getElementById("calfId")?.value || "").trim(),
      calf1Fate: readRadio("calf1Fate"),

      calf2Sex: readRadio("calf2Sex"),
      calf2Id: String(document.getElementById("calf2Id")?.value || "").trim(),
      calf2Fate: readRadio("calf2Fate"),

      calf3Sex: readRadio("calf3Sex"),
      calf3Id: String(document.getElementById("calf3Id")?.value || "").trim(),
      calf3Fate: readRadio("calf3Fate"),

      lastInseminationDate: String(lastAiEl?.value || "").trim(),
      notes: String(document.getElementById("notes")?.value || "").trim()
    };
  }

  function renderServerMessage(data, fallback, successByAllowed = false) {
    const msg = String(data?.message || data?.error || fallback || "").trim();
    const msgClean = compactReason(msg);

    const rejectedItems = Array.isArray(data?.rejected) ? data.rejected : [];

    const rejectedLines = rejectedItems
      .slice(0, 8)
      .map(x => {
        const n = String(x.animalNumber || "").trim();
        const reason = compactReason(x.reason || "");
        if (!reason) return "";
        if (reason === msgClean) return "";
        return `${n}: ${reason}`;
      })
      .filter(Boolean);

    const fullMsg = [
      msg,
      rejectedLines.length ? rejectedLines.join("\n") : ""
    ].filter(Boolean).join("\n\n");

    const isSuccess = successByAllowed ? !!data?.allowed : !!data?.ok;

    showSysbar(
      fullMsg || fallback || "تعذّر تنفيذ الطلب.",
      isSuccess ? "success" : "error",
      Array.isArray(data?.actions) ? data.actions : []
    );
  }

  function syncNewMotherNumberField(
    required,
    previousFollowerNumber = ""
  ) {
    requiresNewMotherNumber = !!required;

    if (newMotherNumberRow) {
      newMotherNumberRow.style.display =
        requiresNewMotherNumber
          ? ""
          : "none";
    }

    if (newMotherNumberEl) {
      newMotherNumberEl.required =
        requiresNewMotherNumber;

      newMotherNumberEl.disabled =
        !requiresNewMotherNumber;

      if (!requiresNewMotherNumber) {
        newMotherNumberEl.value = "";
      }
    }

    if (
      newMotherNumberHint &&
      requiresNewMotherNumber
    ) {
      const oldNumber =
        normalizeDigits(
          previousFollowerNumber ||
          animalEl?.value ||
          ""
        );

      newMotherNumberHint.textContent =
        oldNumber
          ? `العجلة رقم ${oldNumber} ستنتقل إلى الأمهات بالرقم الجديد، وسيظل رقمها القديم محفوظًا داخل وثيقة الأم وتاريخها.`
          : "سيظل رقم العجلة القديم محفوظًا داخل وثيقة الأم وتاريخها.";
    }
  }

  function applyGateData(data) {
    if (animalIdEl && data?.animalId) {
      animalIdEl.value = String(data.animalId || "");
    }

    if (speciesEl && data?.species) {
      speciesEl.value = String(data.species || "");
    }

    if (lastAiEl && data?.lastInseminationDate) {
      lastAiEl.value = String(data.lastInseminationDate || "").slice(0, 10);
    }

    syncNewMotherNumberField(
      data?.requiresNewMotherNumber === true,
      data?.previousFollowerNumber || ""
    );
  }
  function syncCalfGroups() {
    const isDead = (kindEl?.value === "نافقة");
    const count = parseInt(
      form.querySelector('input[name="calfCount"]:checked')?.value || "1",
      10
    );

    document.querySelectorAll(".live-only").forEach(el => {
      el.style.display = isDead ? "none" : "";
    });

    const enableLive = !isDead;

    const calfCountRadios = form.querySelectorAll('input[name="calfCount"]');
    calfCountRadios.forEach((r, i) => {
      if (enableLive) {
        r.required = (i === 0);
      } else {
        r.required = false;
        r.checked = false;
      }
    });

    const calfId1 = document.getElementById("calfId");
    const calf1SexRadios = form.querySelectorAll('input[name="calf1Sex"]');
    const calf1FateRadios = form.querySelectorAll('input[name="calf1Fate"]');

    if (calfId1) {
      calfId1.required = enableLive;
      if (!enableLive && !isEditMode) calfId1.value = "";
    }

    calf1SexRadios.forEach((r, i) => {
      r.required = enableLive && i === 0;
      if (!enableLive && !isEditMode) r.checked = false;
    });

    calf1FateRadios.forEach((r, i) => {
      r.required = enableLive && i === 0;
      if (!enableLive && !isEditMode) r.checked = false;
    });

    [["offspring2", 2], ["offspring3", 3]].forEach(([id, idx]) => {
      const group = document.getElementById(id);
      const visible = enableLive && count >= idx;

      if (group) group.style.display = visible ? "" : "none";

      const idEl = document.getElementById(`calf${idx}Id`);
      const sexRadios = form.querySelectorAll(`input[name="calf${idx}Sex"]`);
      const fateRadios = form.querySelectorAll(`input[name="calf${idx}Fate"]`);

      if (idEl) {
        idEl.required = visible;
        if (!visible && !isEditMode) idEl.value = "";
      }

      sexRadios.forEach((r, i) => {
        r.required = visible && i === 0;
        if (!visible && !isEditMode) r.checked = false;
      });

      fateRadios.forEach((r, i) => {
        r.required = visible && i === 0;
        if (!visible && !isEditMode) r.checked = false;
      });
    });
  }

  let gateTimer = null;
  let lastGateKey = "";

  async function runGateNow() {
    const payload = collectPayload();

    const gateKey = JSON.stringify({
      n: payload.animalNumber,
      d: payload.eventDate
    });

    if (gateKey === lastGateKey) return;
    lastGateKey = gateKey;

   if (!payload.animalNumber || !payload.eventDate) {
      setDetailsDisabled(true);
      if (sysbar) sysbar.style.display = "none";
      return;
    }

    try {
      setDetailsDisabled(true);
      showSysbar("جارِ التحقق من أهلية الولادة…", "info");

      const { data, authRequired } = await sessionPostJson(
  "/api/calving/gate",
  payload,
  "تعذّر قراءة رد السيرفر."
);

if (authRequired) return;
      renderServerMessage(data, "تعذّر التحقق من أهلية الولادة.", true);

          if (data?.allowed) {
        setDetailsDisabled(false);
        applyGateData(data);
        syncCalfGroups();
      } else {
        syncNewMotherNumberField(false);
        setDetailsDisabled(true);
      }

    } catch (err) {
      console.error("calving gate failed", err);
      showSysbar("❌ تعذّر التحقق من أهلية الولادة الآن.", "error");
      setDetailsDisabled(true);
    }
  }

  function scheduleGate() {
  if (requestedEditMode) return;

  clearTimeout(gateTimer);
  gateTimer = setTimeout(runGateNow, 350);
}

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = collectPayload();
    if (requestedEditMode) {
  if (!isEditMode) {
    showSysbar(
      "❌ تعذّر تحديد حدث الولادة المطلوب تعديله.",
      "error"
    );

    return;
  }

  const correctionReason =
    String(
      document.getElementById(
        "correctionReason"
      )?.value || ""
    ).trim();

  if (!correctionReason) {
    showSysbar(
      "❌ اكتب سبب التعديل.",
      "error"
    );

    document
      .getElementById(
        "correctionReason"
      )
      ?.focus?.();

    return;
  }

  payload.correctionReason =
    correctionReason;

  try {
    if (saveBtn) {
      saveBtn.disabled = true;
    }

    showSysbar(
      "جارِ حفظ تعديل الولادة…",
      "info"
    );

    const {
      data,
      authRequired
    } =
      await sessionPostJson(
        `/api/events-page/event/${encodeURIComponent(editEventId)}/correct`,
        payload,
        "تعذّر قراءة رد السيرفر."
      );

    if (authRequired) {
      return;
    }

    renderServerMessage(
      data,
      "تعذّر حفظ تعديل الولادة.",
      false
    );

    if (data?.ok) {
      setTimeout(() => {
        location.href =
          `event-list.html?number=${encodeURIComponent(
            payload.animalNumber
          )}`;
      }, 1000);
    }

  } catch (err) {
    console.error(
      "calving correction failed",
      err
    );

    showSysbar(
      "❌ تعذّر حفظ تعديل الولادة الآن.",
      "error"
    );

  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
    }
  }

  return;
}

    if (
      requiresNewMotherNumber &&
      !payload.newMotherNumber
    ) {
      showSysbar(
        "❌ أدخل رقم الأم الجديد حسب سيريال المزرعة.",
        "error"
      );

      newMotherNumberEl?.focus?.();
      return;
    }

    if (
      requiresNewMotherNumber &&
      payload.newMotherNumber === payload.animalNumber
    ) {
      showSysbar(
        "❌ رقم الأم الجديد يجب أن يختلف عن رقم العجلة الحالي.",
        "error"
      );

      newMotherNumberEl?.focus?.();
      return;
    }

    try {
      if (saveBtn) saveBtn.disabled = true;

      showSysbar("جارِ حفظ الولادة…", "info");

     const { data, authRequired } = await sessionPostJson(
  "/api/calving/save",
  payload,
  "تعذّر قراءة رد السيرفر."
);

if (authRequired) return;

      renderServerMessage(data, "تعذّر حفظ الولادة.", false);

      if (data?.ok) {

        if (data.redirectUrl) {
          setTimeout(() => {
            location.href = data.redirectUrl;
          }, 1100);
        }
      }

    } catch (err) {
      console.error("calving save failed", err);
      showSysbar("❌ تعذّر حفظ الولادة الآن.", "error");
    } finally {
      if (saveBtn) saveBtn.disabled = false;
    }
  });

  kindEl?.addEventListener("change", syncCalfGroups);
  form?.querySelectorAll('input[name="calfCount"]').forEach(r => {
    r.addEventListener("change", syncCalfGroups);
  });

  animalEl?.addEventListener("input", scheduleGate);
  animalEl?.addEventListener("change", scheduleGate);
  dateEl?.addEventListener("change", scheduleGate);

  document.getElementById("toCardBtn")?.addEventListener("click", () => {
    const n = normalizeDigits(animalEl?.value || "");
    if (!n) {
      showSysbar("أدخل رقم الحيوان أولًا قبل فتح البطاقة.", "error");
      return;
    }

    location.href = `/cow-card.html?number=${encodeURIComponent(n)}`;
  });

   document.addEventListener("DOMContentLoaded", () => {
    if (requestedEditMode) {
  syncNewMotherNumberField(false);
  setDetailsDisabled(true);
  syncCalfGroups();

  if (!editEventId) {
    showSysbar(
      "❌ رابط تعديل الولادة غير مكتمل.",
      "error"
    );

    if (saveBtn) {
      saveBtn.disabled = true;
    }

    return;
  }

  loadEditEvent();
  return;
}
    const n =
      qp.get("animalNumber") ||
      qp.get("number") ||
      qp.get("animalId") ||
      "";

    const d =
      qp.get("eventDate") ||
      qp.get("date") ||
      qp.get("dt") ||
      "";

    if (animalEl) {
      animalEl.value =
        normalizeDigits(n);
    }

    if (dateEl) {
      dateEl.value =
        toISO(d) ||
        new Date().toISOString().slice(0, 10);
    }

    syncNewMotherNumberField(false);
    setDetailsDisabled(true);
    syncCalfGroups();
    scheduleGate();
  });
</script>
</body>
</html>
