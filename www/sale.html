<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="sale">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل بيع — مُرَبِّيك</title>
  <link rel="icon" type="image/svg+xml" href="/images/dashboard.svg">
  <meta name="theme-color" content="#2e7d32" />
  <link rel="stylesheet" href="css/forms.css" />
  
</head>

<body>
  <!-- ✅ هيدر مُرَبِّيك القياسي -->
  <header>
    <div class="mbk-head">
      <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">
      <div class="mbk-center">
        <div class="mbk-page-title">تسجيل بيع</div>
        <div class="mbk-app-name">مُرَبِّيك</div>
      </div>
      <a class="mbk-back" href="add-event.html">رجوع</a>
    </div>
  </header>

  <main class="mbk-form">
   <form id="saleForm" data-event="بيع" novalidate>
    <div id="sysbar" class="infobar mbk-infobar" hidden></div>
    <section class="mbk-card">
    <label>رقم الحيوان</label>
    <input id="animalNumber" data-field="animalNumber" readonly />

    <label>تاريخ البيع</label>
    <input id="eventDate" data-field="eventDate" type="date" required />
   <label>سعر البيع (اختياري)</label>
<input
  id="price"
  data-field="price"
  type="number"
  inputmode="decimal"
  min="0"
  step="any"
  placeholder="مثال: 85000"
/>

<label for="saleReason">سبب البيع</label>
<input
  id="saleReason"
  data-field="saleReason"
  list="saleReasonOptions"
  autocomplete="off"
  placeholder="اكتب سبب البيع"
  required
/>
<datalist id="saleReasonOptions"></datalist>
    <label>ملاحظات</label>
    <textarea id="notes" data-field="notes" rows="3" placeholder="اختياري"></textarea>
</section>
    <!-- ✅ زر يطلب التحقق المركزي فقط -->
<div class="actions-bar">
  <button class="save" id="saveBtn" type="submit" disabled>تسجيل الحدث</button>
<button class="ghost" id="cardBtn" type="button" disabled>بطاقة الحيوان</button>
</div>
      </form>
  </main>

<script>
  const $ = (id) => document.getElementById(id);

  const p = new URLSearchParams(location.search);
  const num = p.get("number") || p.get("animalNumber") || "";
  const dt  = p.get("date") || p.get("eventDate") || new Date().toISOString().slice(0,10);

  $("animalNumber").value = String(num || "");
  $("eventDate").value = dt;
  let saleCardUrl = "";
async function sessionPostJson(path, payload) {
  const r = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify(payload || {})
  });

  const data = await r.json().catch(() => null);

  if (r.status === 401 || data?.error === "auth_required") {
    msg(data?.message || "❌ سجّل الدخول أولًا.");
    return { r, data, authRequired: true };
  }

  return { r, data, authRequired: false };
}
async function loadSaleReasonOptions() {
  try {
    const r = await fetch("/api/sale-reasons/options", {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store",
      headers: {
        "Accept": "application/json"
      }
    });

    const data = await r.json().catch(() => null);

    if (r.status === 401 || data?.error === "auth_required") {
      msg(data?.message || "❌ سجّل الدخول أولًا.");
      return;
    }

    if (!r.ok || data?.ok !== true) {
      return;
    }

    const list = $("saleReasonOptions");
    if (!list) return;

    list.replaceChildren();

    for (const reason of Array.isArray(data.reasons) ? data.reasons : []) {
      const value = String(reason || "").trim();
      if (!value) continue;

      const option = document.createElement("option");
      option.value = value;
      list.appendChild(option);
    }

  } catch (err) {
    console.error("sale reasons options", err);
  }
}
async function runSaleGate() {
  const animalNumber =
    String($("animalNumber")?.value || "").trim();

  $("saveBtn").disabled = true;
  $("cardBtn").disabled = true;
  saleCardUrl = "";

  if (!animalNumber) {
    msg("❌ رقم الحيوان مطلوب.");
    return false;
  }

  try {
    msg("جارِ التحقق من الحيوان...");

    const {
      r,
      data,
      authRequired
    } = await sessionPostJson(
      "/api/animals/archive/gate",
      {
        animalNumber,
        archiveReason: "sale"
      }
    );

    if (authRequired) {
      return false;
    }

    if (
      !r.ok ||
      data?.ok === false ||
      data?.allowed !== true
    ) {
      $("saveBtn").disabled = true;
      $("cardBtn").disabled = true;
      saleCardUrl = "";

      msg(
        data?.message ||
        "❌ لا يمكن تسجيل بيع لهذا الحيوان."
      );

      return false;
    }

    saleCardUrl =
      String(
        data?.animal?.cardUrl || ""
      ).trim();

    $("saveBtn").disabled = false;
    $("cardBtn").disabled = !saleCardUrl;

    msg(
      data?.message ||
      "✅ الحيوان مؤهل لتسجيل البيع.",
      true
    );

    return true;

  } catch (err) {
    console.error(err);

    $("saveBtn").disabled = true;
    $("cardBtn").disabled = true;
    saleCardUrl = "";

    msg(
      "❌ فشل الاتصال بالسيرفر أثناء التحقق من الحيوان."
    );

    return false;
  }
}

runSaleGate();
loadSaleReasonOptions();
 

  function msg(t, ok = false) {
    const bar = document.getElementById("sysbar");
    if (!bar) return;

    bar.className = "infobar mbk-infobar show " + (ok ? "success" : "error");
    bar.hidden = false;
    bar.textContent = t;

    try { bar.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (_) {}
  }



  $("cardBtn")?.addEventListener("click", () => {
  if (saleCardUrl) {
    location.href = saleCardUrl;
  }
});

 $("saleForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();

    
    const payload = {
  animalNumber:
    String($("animalNumber")?.value || "").trim(),

  eventDate:
    String($("eventDate")?.value || "").trim(),

  archiveReason: "sale",

  price:
    String($("price")?.value || "").trim(),

  saleReason:
    String($("saleReason")?.value || "").trim(),

  notes:
    String($("notes")?.value || "").trim()
};

    try {
     
      $("saveBtn").disabled = true;
      msg("جارِ أرشفة الحيوان بعد البيع...");

         const { r, data, authRequired } = await sessionPostJson("/api/animals/archive", payload);

      if (authRequired) return;
     if (!r.ok || data?.ok !== true) {
  msg(
    data?.message ||
    "❌ فشل أرشفة الحيوان بعد البيع."
  );

  await runSaleGate();
  return;
}

      msg(data.message || "✅ تم أرشفة الحيوان وأحداثه بعد البيع.", true);

      const redirectUrl =
  String(
    data?.redirectUrl || ""
  ).trim();

if (redirectUrl) {
  setTimeout(() => {
    location.href =
      redirectUrl;
  }, 900);
}

    } catch (err) {
      console.error(err);
      msg("❌ فشل الاتصال بالسيرفر أثناء أرشفة البيع.");
await runSaleGate();
    }
  });
</script>
</body>
</html>
