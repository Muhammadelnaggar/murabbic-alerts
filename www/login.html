<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول — مُرَبِّيك</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b7f47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="css/forms.css">
 

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">


</head>

<body class="login-page">

  <div class="topbar">
    <div class="brand">
      <img src="/images/logo.png" alt="مُرَبِّيك">
      <div class="brand-text">
        <div class="main">مُرَبِّيك</div>
        <div class="sub">نظام خبير يصنع القرار.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>تسجيل الدخول</h2>
    <div class="desc">أدخل رقم هاتفك للمتابعة</div>

    <div id="formMsg" class="msg"></div>

    <form id="loginForm">
      <input type="text" id="phone" placeholder="رقم الهاتف" required />
      <input type="password" id="password" placeholder="كلمة المرور" required />
      <div class="forgot-line">
  <a href="forgot-password.html">نسيت كلمة المرور؟</a>
</div>
      <button id="submitBtn" type="submit">دخول</button>
    </form>

    <div class="hint">
      نظام ذكي لتحليل القطيع وتبسيط القرار للمربي
    </div>
  </div>
<div class="signup-line">
  ليس لديك حساب؟
  <a href="register.html">أنشئ حساب جديد</a>
</div>

  <footer>
    © 2026 Murabbik. All rights reserved.
  </footer>

<script>
  const form = document.getElementById("loginForm");
  const btn  = document.getElementById("submitBtn");
  const msg  = document.getElementById("formMsg");

  function setMsg(t, ok=false){
    msg.textContent = t;
    msg.className   = "msg " + (ok ? "ok" : "err");
    msg.style.display = "block";
  }

  function apiUrl(path) {
    const apiBase = String(window.API_BASE || "").replace(/\/$/, "");
    return apiBase ? `${apiBase}${path}` : path;
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    msg.style.display = "none";

    const prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = "جارٍ التحقق…";

    try {
      const phoneIn = document.getElementById("phone").value;
      const passIn  = document.getElementById("password").value;

      if (!phoneIn || !passIn) {
        setMsg("أدخل رقم الهاتف وكلمة المرور.");
        return;
      }

      const r = await fetch(apiUrl("/api/auth/login"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          phone: phoneIn,
          password: passIn
        })
      });

      const data = await r.json().catch(() => ({}));

      if (!r.ok || data.ok !== true || !data.userId) {
        setMsg(data.message || "رقم الهاتف أو كلمة المرور غير صحيحة.");
        return;
      }

      // جسر مؤقت مهم جدًا:
      // باقي صفحات مُرَبِّيك ما زالت تعتمد على localStorage ثم X-User-Id
      localStorage.setItem("userId", data.userId);

      setMsg(data.message || "✅ تم تسجيل الدخول — تحويل…", true);

      setTimeout(() => {
        location.replace(data.redirectUrl || "dashboard.html");
      }, 600);

    } catch (err) {
      setMsg("تعذّر الاتصال بالسيرفر. حاول مرة أخرى.");
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  });
</script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(()=>{});
  }
</script>


</body>
</html>
