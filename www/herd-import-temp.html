<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
 <title>استيراد القطيع</title>
  <link rel="stylesheet" href="css/forms.css" />
 <style>
  .herd-import-systems .system-future {
    opacity: 0.22;
    filter: grayscale(1);
    pointer-events: none;
    user-select: none;
    box-shadow: none !important;
  }

  .herd-import-systems .system-active {
    opacity: 1;
    font-weight: 700;
  }
</style>
</head>

<body data-page="herd-import">
<header class="mbk-head">
  <img class="mbk-logo" src="/images/logo.png" alt="مُرَبِّيك">

  <div class="mbk-center">
    <div class="mbk-title">استيراد القطيع</div>
    <div class="mbk-sub">مُرَبِّيك</div>
  </div>

  <button type="button" class="mbk-head-btn" onclick="location.href='add-animal.html'">
    رجوع
  </button>
</header>

<div id="messageBox" class="infobar" role="status" aria-live="polite"></div>

<main class="page">
 <section class="card herd-import-hero">
  <div class="herd-import-title">استيراد قطيع كامل</div>
  <div class="herd-import-sub">
   ارفع ملف Excel باستخدام قالب مُرَبِّيك المعتمد، وسيقوم مُرَبِّيك بمراجعة البيانات قبل الحفظ.
  </div>

 <div class="herd-import-systems">
  <span class="system-future">DairyComp / DC305</span>
  <span class="system-future">DelPro</span>
  <span class="system-future">AfiMilk</span>
  <span class="system-future">Uniform-Agri</span>
  <span class="system-active">Excel عربي</span>
</div>

   <label for="herdFile">ملف قالب مُرَبِّيك المعتمد (.xlsx)</label>
  <input id="herdFile" type="file" accept=".xlsx" />

  <div class="actions-bar inline">
    <a
      href="/murabbik-herd-import-template.xlsx"
      download="murabbik-herd-import-template.xlsx"
      class="ghost"
      style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;"
    >
      تحميل قالب مُرَبِّيك
    </a>

    <button id="btnGuide" type="button" class="ghost">
      كيف أجهّز ملف الاستيراد؟
    </button>

    <button id="btnPreview" type="button" class="ghost">
      معاينة ذكية
    </button>
  </div>
</section>

<section id="importGuideBox" class="card" style="display:none;">
  <h2 id="importGuideTitle"></h2>
  <div id="importGuideIntro" class="hint"></div>
  <div id="importGuideContent" class="preview-scroll"></div>
</section>

  <section id="summaryBox" class="card" style="display:none;">
    <h2>ملخص المعاينة</h2>
    <div class="kpi-grid">
      <div class="kpi-box">
        <div id="totalRows" class="kpi-value">0</div>
        <div class="kpi-label">إجمالي السجلات</div>
      </div>
      <div class="kpi-box">
        <div id="readyRows" class="kpi-value">0</div>
        <div class="kpi-label">جاهز</div>
      </div>
      <div class="kpi-box">
        <div id="rejectedRows" class="kpi-value">0</div>
        <div class="kpi-label">مرفوض</div>
      </div>
     
    </div>
  </section>

  <section id="resultsBox" class="card" style="display:none;">
    <h2>تفاصيل المعاينة</h2>
    <div id="rowsList" class="preview-scroll"></div>
  </section>
</main>

<div id="pageBottomBar" class="mbk-page-bottom-bar">
  <button id="btnSave" type="button" class="mbk-bottom-btn mbk-bottom-btn-primary" disabled>
    حفظ القطيع
  </button>

  <button id="animalsListBtn" type="button" class="mbk-bottom-btn mbk-bottom-btn-ghost">
    قائمة الحيوانات
  </button>
</div>

<script>
(function(){
  let currentUser = null;
let currentUserId = null;

async function loadServerSession(){
  const res = await fetch("/api/auth/me", {
    method: "GET",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Accept": "application/json"
    }
  });

  const data = await res.json().catch(() => ({}));

  if (!res.ok || data.ok !== true || !data.userId) {
    location.replace("login.html?next=herd-import-temp.html");
    throw new Error("auth_required");
  }

  currentUser = data.user || {};
  currentUserId = data.userId;
  return data;
}
  const $ = id => document.getElementById(id);

  const herdFile = $("herdFile");
  const btnGuide = $("btnGuide");
  const btnPreview = $("btnPreview");
  const btnSave = $("btnSave");
  const animalsListBtn = $("animalsListBtn");
  const summaryBox = $("summaryBox");
  const messageBox = $("messageBox");
  const resultsBox = $("resultsBox");
  const rowsList = $("rowsList");
  const importGuideBox = $("importGuideBox");
  const importGuideTitle = $("importGuideTitle");
  const importGuideIntro = $("importGuideIntro");
  const importGuideContent = $("importGuideContent");

  let lastFilePayload = null;
  let lastPreviewOk = false;

  

  function showMessage(text, type){
  const cls =
    type === "status-ok" ? "success" :
    type === "status-error" ? "error" :
    type === "status-warn" ? "warning" :
    "info";

  messageBox.className = "infobar show " + cls;
  messageBox.textContent = text || "";

  try {
    messageBox.scrollIntoView({ behavior:"smooth", block:"center" });
  } catch (_) {}
}

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

function setSummary(j){
  const baseline =
    j?.baselineSummary || {};

  const events =
    j?.eventImportSummary || {};

  $("totalRows").textContent =
    Number(baseline.totalRows || 0) +
    Number(events.totalRows || 0);

  $("readyRows").textContent =
    Number(baseline.readyAnimalsCount || 0) +
    Number(events.readyEventsCount || 0);

  $("rejectedRows").textContent =
    Number(baseline.needsReviewCount || 0) +
    Number(events.rejectedEventsCount || 0);

  summaryBox.style.display = "block";
}


function importPreviewCell(value, className = ""){
  const td =
    document.createElement("td");

  if (className) {
    td.className = className;
  }

  td.textContent =
    value === null ||
    value === undefined ||
    String(value).trim() === ""
      ? "—"
      : String(value);

  return td;
}


function appendImportPreviewTable(
  title,
  rows,
  kind
){
  if (
    !Array.isArray(rows) ||
    rows.length === 0
  ) {
    return;
  }

  const rejectedCount =
    rows.filter(
      row => row?.ok !== true
    ).length;

  const section =
    document.createElement("section");

  section.className =
    "import-preview-section";

  const head =
    document.createElement("div");

  head.className =
    "import-preview-head";

  const h3 =
    document.createElement("h3");

  h3.textContent = title;

  const count =
    document.createElement("span");

  count.className =
    "import-preview-count";

  count.textContent =
    rejectedCount > 0
      ? `${rows.length} سجل — ${rejectedCount} مرفوض`
      : `${rows.length} سجل`;

  head.appendChild(h3);
  head.appendChild(count);
  section.appendChild(head);

  const wrap =
    document.createElement("div");

  wrap.className =
    "import-preview-table-wrap";

  const table =
    document.createElement("table");

  table.className =
    "import-preview-table";

  const thead =
    document.createElement("thead");

  const headerRow =
    document.createElement("tr");

  const headers =
    kind === "event"
      ? [
          "رقم الحيوان",
          "نوع الحدث",
          "تاريخ الحدث",
          "النتيجة",
          "سبب الرفض"
        ]
      : [
          "رقم الحيوان",
          "نوع الحيوان",
          "النتيجة",
          "سبب الرفض"
        ];

  headers.forEach(text => {
    const th =
      document.createElement("th");

    th.textContent = text;
    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody =
    document.createElement("tbody");

  rows.forEach(row => {
    const tr =
      document.createElement("tr");

    tr.className =
      row?.ok === true
        ? "is-ready"
        : "is-rejected";

    tr.appendChild(
      importPreviewCell(
        row?.animalNumber ||
        "غير موجود"
      )
    );

    if (kind === "event") {
      tr.appendChild(
        importPreviewCell(
          row?.eventLabel ||
          row?.eventType ||
          "—"
        )
      );

      tr.appendChild(
        importPreviewCell(
          row?.eventDate ||
          "—"
        )
      );
    } else {
      tr.appendChild(
        importPreviewCell(
          row?.animalType ||
          "—"
        )
      );
    }

    const statusCell =
      document.createElement("td");

    const badge =
      document.createElement("span");

    badge.className =
      "import-preview-status " +
      (
        row?.ok === true
          ? "is-ready"
          : "is-rejected"
      );

    badge.textContent =
      row?.status || "—";

    statusCell.appendChild(badge);
    tr.appendChild(statusCell);

    tr.appendChild(
      importPreviewCell(
        row?.ok === true
          ? "—"
          : row?.message,
        "import-preview-reason"
      )
    );

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  section.appendChild(wrap);
  rowsList.appendChild(section);
}


function renderRows(rows, j = {}){
  rowsList.innerHTML = "";

  const source =
    document.createElement("div");

  source.className =
    "import-preview-source";

  const sourceName =
    document.createElement("span");

  sourceName.textContent =
    `مصدر الملف: ${
      j?.sourceProfile?.name ||
      "غير محدد"
    }`;

  const confidence =
    document.createElement("span");

  confidence.textContent =
    `مطابقة شكل الملف: ${
      j?.sourceProfile?.confidenceLevel ||
      "—"
    }`;

  source.appendChild(sourceName);
  source.appendChild(confidence);
  rowsList.appendChild(source);

  const mothers =
    (rows || []).filter(
      row =>
        row?.recordKind === "أم"
    );

  const followers =
    (rows || []).filter(
      row =>
        row?.recordKind === "تابع"
    );

  appendImportPreviewTable(
    "الأمهات",
    mothers,
    "animal"
  );

  appendImportPreviewTable(
    "التوابع",
    followers,
    "animal"
  );

  resultsBox.style.display =
    "block";
}


function renderEvents(events){
  appendImportPreviewTable(
    "الأحداث",
    events || [],
    "event"
  );
}
function renderImportGuide(j){
  importGuideTitle.textContent =
    j.title || "كيف أجهّز ملف الاستيراد؟";

  importGuideIntro.textContent =
    j.intro || "";

  importGuideContent.innerHTML = "";

  for (const section of j.sections || []) {
    const box = document.createElement("div");
    box.className = "preview-row";

    const title = document.createElement("div");
    const strong = document.createElement("b");

    strong.textContent = section.title || "";
    title.appendChild(strong);
    box.appendChild(title);

    const list = document.createElement("ul");

    for (const text of section.items || []) {
      const item = document.createElement("li");
      item.textContent = text;
      list.appendChild(item);
    }

    box.appendChild(list);
    importGuideContent.appendChild(box);
  }

  importGuideBox.style.display = "block";

  importGuideBox.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function loadImportGuide(){
  if (!currentUserId) {
    await loadServerSession();
  }

  const r = await fetch("/api/herd-import-v2/guide", {
    method: "GET",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Accept": "application/json"
    }
  });

  const data = await r.json().catch(() => ({
    ok: false,
    message: "تعذّر قراءة تعليمات الاستيراد."
  }));

  if (r.status === 401 || data?.error === "auth_required") {
    location.replace("login.html?next=herd-import-temp.html");
    return null;
  }

  if (!r.ok || data.ok !== true) {
    throw new Error(
      data.message || "تعذّر تحميل تعليمات الاستيراد."
    );
  }

  return data;
}
async function callHerdImport(path){
  if (!currentUserId) {
    await loadServerSession();
  }

  const r = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
       body: JSON.stringify(lastFilePayload || {})
  });

  const data = await r.json().catch(() => ({
    ok: false,
    message: "تعذّر قراءة رد السيرفر."
  }));

  if (r.status === 401 || data?.error === "auth_required") {
    location.replace("login.html?next=herd-import-temp.html");
    return {
      ok: false,
      message: "انتهت الجلسة. سجّل الدخول مرة أخرى."
    };
  }

  return data;
}
  btnGuide.addEventListener("click", async () => {
  try {
    btnGuide.disabled = true;

    const guide = await loadImportGuide();

    if (guide) {
      renderImportGuide(guide);
    }

  } catch (e) {
    console.error(e);

    showMessage(
      e.message || "تعذّر تحميل تعليمات الاستيراد.",
      "status-error"
    );

  } finally {
    btnGuide.disabled = false;
  }
});
  btnPreview.addEventListener("click", async () => {
    try {
      btnPreview.disabled = true;
      btnSave.disabled = true;
      lastPreviewOk = false;

      const file = herdFile.files && herdFile.files[0];
      if (!file) {
        showMessage("اختر ملفًا أولًا.", "status-error");
        return;
      }

lastFilePayload = {
  fileName: file.name,
  fileBase64: await fileToBase64(file)
};

      showMessage("جاري المعاينة من السيرفر...", "status-warn");

     const j = await callHerdImport("/api/herd-import-v2/preview");

      console.log("HERD PREVIEW:", j);

      setSummary(j);
renderRows(j.previewAnimals || [], j);
renderEvents(j.previewEvents || []);
     
lastPreviewOk =
  j?.eventImportSummary
    ?.readyForSavePreview === true;

btnSave.disabled =
  !lastPreviewOk;
     showMessage(
  j.message || "تمت المعاينة.",
  lastPreviewOk
    ? "status-ok"
    : "status-error"
);

    } catch (e) {
      console.error(e);
      showMessage(e.message || "فشلت المعاينة.", "status-error");
    } finally {
      btnPreview.disabled = false;
    }
  });
  animalsListBtn?.addEventListener("click", () => {
  location.href = "animal-list.html";
});
  btnSave.addEventListener("click", async () => {
    try {
      if (!lastPreviewOk || !lastFilePayload) {
        showMessage("اعمل معاينة ناجحة أولًا.", "status-error");
        return;
      }

      btnSave.disabled = true;
     showMessage("جاري حفظ القطيع داخل مُرَبِّيك...", "status-warn");

const j = await callHerdImport("/api/herd-import-v2/save-operational");

console.log("HERD SAVE:", j);

const mothersCount =
  Number(j.insertedMothersCount || 0);

const followersCount =
  Number(j.insertedFollowersCount || 0);
const serverMessage =
  String(
    j.message ||
    "تمت عملية الاستيراد بنجاح."
  );
const importId =
  String(j.importId || "").trim();

const importQuery =
  importId
    ? `?importId=${encodeURIComponent(importId)}`
    : "";

if (
  j.ok === true &&
  mothersCount > 0 &&
  followersCount > 0
) {
  messageBox.className = "infobar show success";

  messageBox.innerHTML = `
    <div style="font-weight:700; margin-bottom:8px;">
  ${serverMessage}
</div>

    <div style="margin-bottom:12px;">
      اختر القائمة التي تريد فتحها:
    </div>

    <div class="actions-bar inline" style="margin-top:0;">
      <button
        type="button"
        class="ghost"
        onclick="location.href='animal-list.html${importQuery}'"
      >
        عرض الأمهات (${mothersCount})
      </button>

      <button
        type="button"
        class="ghost"
        onclick="location.href='follower-list.html${importQuery}'"
      >
        عرض التوابع (${followersCount})
      </button>
    </div>
  `;

  try {
    messageBox.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  } catch (_) {}

  return;
}

if (j.ok === true && j.redirectUrl) {
  location.replace(j.redirectUrl);
  return;
}

showMessage(
  j.message || "فشل الحفظ.",
  "status-error"
);

     
    } catch (e) {
      console.error(e);
      showMessage(e.message || "فشل الحفظ.", "status-error");
    } finally {
      btnSave.disabled = false;
    }
  });
  loadServerSession().catch(err => {
  console.warn("herd-import auth failed:", err);
});
})();
</script>
</body>
</html>
